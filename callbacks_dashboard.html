 .count{margin-left:auto;color:var(--dim);font-size:13px}
 .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}
 .kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:12px;padding:16px 18px}

 .kpi.hero .val{color:var(--good)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px}

 .bar-row{display:grid;grid-template-columns:150px 1fr 104px;align-items:center;gap:10px;margin:8px 0;font-size:14px}.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

 td.g{color:var(--good)}td.a{color:var(--warn)}td.b{color:var(--bad)}
 .note{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
