<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>2026 4DX Scoreboard — Comfort by Design</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1b212b;--edge:#232a34;--ink:#e7edf5;--dim:#93a1b3;--muted:#7c8a9c;--accent:#4c8dff;--accent2:#2bd4a7;--good:#2bd4a7;--warn:#f5c451;--bad:#f8736a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:22px 22px 70px}
h1{margin:0;font-size:26px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);margin-right:8px;vertical-align:middle}
.sub{color:var(--dim);font-size:14px;margin-top:4px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.chip{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--dim)}
.chip b{color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:16px 18px}
.card h2{margin:0;font-size:16.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:3px 10px;border:1px solid}
.pill.g{color:var(--good);border-color:var(--good);background:rgba(43,212,167,.09)}
.pill.a{color:var(--warn);border-color:var(--warn);background:rgba(245,196,81,.09)}
.pill.r{color:var(--bad);border-color:var(--bad);background:rgba(248,115,106,.09)}
.pill.n{color:var(--muted);border-color:var(--muted);background:rgba(124,138,156,.09)}
.pill.s{color:var(--warn);border-color:var(--warn);background:rgba(245,196,81,.12)}
.base{color:var(--muted);font-size:12.5px;margin:7px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--edge);font-variant-numeric:tabular-nums;vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
td .big{font-weight:750;font-size:14.5px}
td .ft{display:block;color:var(--dim);font-size:11.5px;margin-top:2px;font-weight:400}
td.g{color:var(--good)}td.a{color:var(--warn)}td.b{color:var(--bad)}td.m{color:var(--muted)}
.cnote{color:var(--dim);font-size:12.5px;margin-top:10px;line-height:1.55}
.note{color:var(--muted);font-size:12px;margin-top:22px;line-height:1.65}
.stale{outline:1px dashed rgba(245,196,81,.45);outline-offset:-1px}
</style></head><body><div class="wrap">
<h1><span class="dot"></span>2026 4DX Scoreboard — Comfort by Design</h1>
<div class="sub" id="sub"></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<div class="note" id="note"></div>
<script>
const DATA=/*DATA_START*/{
"asof":"Sep 2, 2026","lastMonth":"Aug","mtd":"Sep 1–2","counts":{"g":1,"a":0,"r":2,"n":1},
"wigs":[
{"id":1,"title":"WIG 1 · Sales from Tech-Generated Leads","status":"g","statusLabel":"Ahead of pace","stale":false,
 "base":"2025 baseline $3,243,320 → 2026 target $3,750,000 · Source: Sales4dx (Estimates Subtotal, lead from any Service BU, dated by Sold On)",
 "rows":[
  {"p":"Last Month · Aug","a":"$162,551","af":"21 sold estimates · closed month","vg":"59% of $273K","vgc":"b","vy":"−31.6% YoY","vyf":"Aug 2025: $237,612","vyc":"b"},
  {"p":"MTD · Sep 1–2","a":"$0","af":"no service-lead sales sold yet · day 2","vg":"0% of $26K","vgc":"m","vy":"—","vyf":"Sep 1–2 2025: $0","vyc":"m"},
  {"p":"YTD · Jan 1–Sep 2","a":"$2,344,335","af":"278 sold estimates","vg":"104% of $2.25M","vgc":"g","vy":"+26.3% YoY","vyf":"YTD 2025: $1,855,993","vyc":"g"}],
 "cnote":"Fully refreshed live from Sales4dx and the 2026 Revenue Budget this run; 2025 full-year recomputes to $3,243,320.25, matching the baseline exactly. No new tech-lead sales posted since yesterday — YTD holds at $2.34M, now 104% of budget (the daily goal keeps accruing, ~$13K/day) and +26.3% YoY. August's $162.6K (59% of budget, −31.6% vs Aug 2025) remains the softest month of 2026; September needs a quick start."},
{"id":2,"title":"WIG 2 · Sales Closing %","status":"r","statusLabel":"Off track","stale":false,
 "base":"2025 baseline 60% → 2026 target 65% · Source: Power BI HVAC Install · Total (Non Retail) Conv CY vs PY (AOP/SVP = Michael Bala, Company = Comfort by Design)",
 "rows":[
  {"p":"Last Month · Aug","a":"51.8%","af":"83 leads · 43 sales · closed month","vg":"−13.2 pts vs 65%","vgc":"b","vy":"—","vyf":"no single-month PY in report","vyc":"m"},
  {"p":"MTD · Sep","a":"—","af":"not read · day 2 (month slicer would not switch to Sep)","vg":"—","vgc":"m","vy":"—","vyf":"","vyc":"m"},
  {"p":"YTD · Jan–Aug","a":"59.5%","af":"693 leads · 412 sales · complete months","vg":"−5.5 pts vs 65%","vgc":"b","vy":"+73 BPS","vyf":"2025: 58.7%","vyc":"g"}],
 "cnote":"Read live from Power BI this run (data updated 9/2). Unchanged from yesterday: August closed at 51.8% — the weakest month of the year — and YTD (Jan–Aug, complete months) sits at 59.5%, 73 BPS ahead of last year but below the 60% baseline, so status stays red. September MTD could not be read (the Month Name slicer kept snapping back to August after three tries); with only two days of data it would be near-empty anyway. The 65% target needs a strong fall."},
{"id":3,"title":"WIG 3 · Net Promoter Score (NPS)","status":"r","statusLabel":"Below target","stale":true,
 "base":"2025 baseline 83 → 2026 target 86 · Source: Qualtrics NPS · Comfort by Design",
 "rows":[
  {"p":"Last Month · Aug","a":"76","af":"n=21 · partial read thru Aug 10 only","vg":"−10 pts vs 86","vgc":"b","vy":"−8 pts","vyf":"Aug 2025: 84 (n=19)","vyc":"b"},
  {"p":"MTD · Sep","a":"—","af":"no read","vg":"—","vgc":"m","vy":"—","vyf":"","vyc":"m"},
  {"p":"YTD","a":"81.1","af":"n=920 · as of Aug 10","vg":"−4.9 pts vs 86","vgc":"b","vy":"−0.9 pts","vyf":"2025: 82","vyc":"b"}],
 "cnote":"NOT refreshed this run — Qualtrics presented a username/password login for the fourth consecutive run, and credentials can't be entered automatically. All figures are carried forward from the Aug 10 read (23 days stale); the August row covers only Aug 1–10 and both August rows have small samples (n<25, not meaningful). Nothing estimated or fabricated. Someone needs to sign in to Qualtrics in Chrome before this WIG can move."},
{"id":4,"title":"WIG 4 · Fireplace Install Gross Profit %","status":"n","statusLabel":"Not started","stale":false,
 "base":"Target: beat budget GP% · Window Aug–Dec 2026 · Source: Power BI P&L 1.2B · CBD Fireplace Install (Act vs Bud)",
 "rows":[],
 "cnote":"Seasonal goal — first official month (August) posts ~Sep 11, after close is finalized. As of Sep 2, August results are not yet official. First real read lands on the first run after Sep 11."}]
}/*DATA_END*/;
const STAMP=/*STAMP_START*/"as of Wed Sep 2, 2026 (run 8:50 AM local)"/*STAMP_END*/;
const PILL={g:"🟢",a:"🟡",r:"🔴",n:"⚪"};
document.getElementById("sub").textContent="4 Wildly Important Goals · "+STAMP+" · Last Month (Aug) / MTD (Sep 1–2) / YTD, each vs Goal & vs Last Year";
const c=DATA.counts;
document.getElementById("chips").innerHTML=
 `<span class="chip">🟢 <b>${c.g}</b> ahead</span><span class="chip">🟡 <b>${c.a}</b> watch</span><span class="chip">🔴 <b>${c.r}</b> off track</span><span class="chip">⚪ <b>${c.n}</b> not started</span><span class="chip">⚠️ NPS <b>stale</b> (Aug 10 read · 4th miss)</span>`;
const cls={g:"g",a:"a",r:"r",n:"n"};
document.getElementById("grid").innerHTML=DATA.wigs.map(w=>{
 const pill=`<span class="pill ${cls[w.status]}">${PILL[w.status]} ${w.statusLabel}</span>`+(w.stale?` <span class="pill s">⚠ stale</span>`:"");
 const tbl=w.rows.length?`<table><thead><tr><th>Period</th><th>Actual</th><th>vs Goal</th><th>vs Last Yr</th></tr></thead><tbody>`+
  w.rows.map(r=>`<tr><td>${r.p}</td><td><span class="big">${r.a}</span><span class="ft">${r.af}</span></td><td class="${r.vgc}">${r.vg}</td><td class="${r.vyc}">${r.vy}${r.vyf?`<span class="ft">${r.vyf}</span>`:""}</td></tr>`).join("")+`</tbody></table>`:"";
 return `<div class="card${w.stale?" stale":""}"><h2>${w.title} ${pill}</h2><div class="base">${w.base}</div>${tbl}<div class="cnote">${w.cnote}</div></div>`;
}).join("");
document.getElementById("note").innerHTML="<b>Notes:</b> Last Month = August 2026 (closed), MTD = September 1–2 2026 (day 2 — shown honestly), YTD = Jan 1–Sep 2 2026 (WIG 2 YTD = Jan–Aug complete months per its read method), all local time. WIG 1 “vs Goal” = % of daily TGL budget (Daily Goals col J) summed per period; WIG 2 &amp; 3 are points vs the flat 2026 target; “vs Last Yr” compares the same dates in 2025. This run: WIG 1 fully live from Sales4dx + 2026 Revenue Budget; WIG 2 live from Power BI (Aug single-month + Jan–Aug YTD; Sep MTD not read); WIG 3 stale — Qualtrics login required, values held from Aug 10 read; WIG 4 out of season until ~Sep 11. No numbers fabricated.";
</script></body></html>
