<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs Gross Margin % — Comfort by Design</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1b2230; --edge:#232a34; --ink:#e7edf5; --dim:#93a1b3;
    --accent:#8b6dff; --accent2:#b9a6ff;
    --g5:#1f7a4d; --g4:#2f9d63; --g3:#7fae3b; --g2:#c9a227; --g1:#d98324; --g0:#c0483b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:22px 26px 40px}
  h1{margin:0 0 2px;font-size:22px;letter-spacing:.2px}
  h1 .tag{font-size:12px;font-weight:600;color:var(--accent2);background:rgba(139,109,255,.14);border:1px solid rgba(139,109,255,.35);padding:3px 9px;border-radius:20px;margin-left:10px;vertical-align:middle}
  .sub{color:var(--dim);font-size:13px;margin:4px 0 2px}
  .stamp{color:var(--dim);font-size:12px;margin-bottom:18px}
  .stamp b{color:#c3cedb;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 22px}
  @media(max-width:720px){.cards{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
  .card .lbl{font-size:12px;letter-spacing:.4px;color:var(--dim);text-transform:uppercase;font-weight:700}
  .card .rng{font-size:11.5px;color:var(--dim);margin-top:2px}
  .card .big{font-size:34px;font-weight:800;margin:8px 0 2px;letter-spacing:.5px}
  .card .meta{font-size:12px;color:var(--dim)}
  .card .meta b{color:#cdd7e2;font-weight:600}
  .card .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
  thead th{position:sticky;top:0;background:#12161d;color:var(--dim);font-weight:600;text-align:right;padding:10px 12px;border-bottom:1px solid var(--edge);font-size:12px;white-space:nowrap}
  thead th.l{text-align:left}
  .burow{background:rgba(139,109,255,.06);cursor:pointer}
  .burow:hover{background:rgba(139,109,255,.12)}
  .burow td{padding:11px 12px;border-top:1px solid var(--edge);font-weight:700}
  .buname{text-align:left;font-size:13.5px}
  .buname .caret{display:inline-block;width:14px;color:var(--accent2);transition:transform .15s}
  .jtrow td{padding:7px 12px;border-top:1px solid #1a2129;color:#cdd7e2}
  .jtrow .jtname{text-align:left;padding-left:34px;color:#aeb9c7}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  td.pct .n{display:block;font-size:10.5px;font-weight:500;color:var(--dim);margin-top:1px}
  .pill{display:inline-block;min-width:52px;padding:3px 8px;border-radius:7px;text-align:right}
  .dash{color:#54606e}
  .foot{margin-top:20px;color:var(--dim);font-size:12px;line-height:1.7;border-top:1px solid var(--edge);padding-top:12px;max-width:1000px}
  .legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0 0}
  .legend span{font-size:11px;color:var(--dim)}
  .sw{display:inline-block;width:22px;height:11px;border-radius:3px}
</style>
</head>

const usd0=n=>n==null?'—':'$'+Math.round(n).toLocaleString();
const shortD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'});};
function band(p){ if(p==null)return null;
  if(p>=75)return '--g5'; if(p>=65)return '--g4'; if(p>=55)return '--g3'; if(p>=45)return '--g2'; if(p>=35)return '--g1'; return '--g0'; }
function pctCell(o){
  if(!o) return '<td class="pct"><span class="dash">—</span></td>';
  const c=band(o.pct); const col=getComputedStyle(document.documentElement).getPropertyValue(c).trim();
  return `<td class="pct"><span class="pill" style="background:${hexA(col,.16)};color:${lighten(col)}">${o.pct.toFixed(1)}%</span><span class="n">${o.n.toLocaleString()} job${o.n==1?'':'s'}</span></td>`;
}
function hexA(hex,a){const h=hex.replace('#','');const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return `rgba(${r},${g},${b},${a})`;}
function lighten(hex){const h=hex.replace('#','');let r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);r=Math.min(255,r+70);g=Math.min(255,g+70);b=Math.min(255,b+70);return `rgb(${r},${g},${b})`;}

// stamp + headers

document.getElementById('stamp').innerHTML=
  `Data through <b>${shortD(m.dataMax)} 2026</b> · counts jobs completed on/before <b>${shortD(m.cutoffEnd)}</b> (last 5 days excluded) · source: ${m.source}`;
document.getElementById('h60').innerHTML=`Last 60 days<br><span style="font-weight:400;color:var(--dim)">${shortD(m.ranges.d60[0])} – ${shortD(m.ranges.d60[1])}</span>`;
document.getElementById('h120').innerHTML=`Last 120 days<br><span style="font-weight:400;color:var(--dim)">${shortD(m.ranges.d120[0])} – ${shortD(m.ranges.d120[1])}</span>`;
document.getElementById('hytd').innerHTML=`YTD<br><span style="font-weight:400;color:var(--dim)">${shortD(m.ranges.ytd[0])} – ${shortD(m.ranges.ytd[1])}</span>`;

// overall cards
const defs=[['d60','Last 60 days','d60'],['d120','Last 120 days','d120'],['ytd','Year to date','ytd']];
document.getElementById('cards').innerHTML=defs.map(([k,t,r])=>{
  const o=DATA.overall[k]; const col=getComputedStyle(document.documentElement).getPropertyValue(band(o.pct)).trim();
  return `<div class="card"><div class="accent" style="background:${lighten(col)}"></div>
    <div class="lbl">${t}</div><div class="rng">${shortD(m.ranges[r][0])} – ${shortD(m.ranges[r][1])}</div>
    <div class="big" style="color:${lighten(col)}">${o.pct.toFixed(1)}%</div>
    <div class="meta">blended GM · <b>${usd0(o.rev)}</b> revenue · <b>${o.n.toLocaleString()}</b> jobs</div></div>`;
}).join('');

// table body
let rows='';
DATA.bus.forEach((b,i)=>{
  const y=b.per.ytd||b.per.d120||b.per.d60||{};
  rows+=`<tr class="burow" data-i="${i}">
    <td class="buname"><span class="caret">▾</span> ${b.bu}</td>
    ${pctCell(b.per.d60)}${pctCell(b.per.d120)}${pctCell(b.per.ytd)}
    <td class="num">${usd0(y.rev)}</td><td class="num">${(y.n||0).toLocaleString()}</td></tr>`;
  b.jts.forEach(j=>{
    const jy=j.per.ytd||j.per.d120||j.per.d60||{};
    rows+=`<tr class="jtrow" data-p="${i}">
      <td class="jtname">${j.jt}</td>
      ${pctCell(j.per.d60)}${pctCell(j.per.d120)}${pctCell(j.per.ytd)}
      <td class="num" style="color:var(--dim)">${usd0(jy.rev)}</td><td class="num" style="color:var(--dim)">${(jy.n||0).toLocaleString()}</td></tr>`;
  });
});
document.getElementById('body').innerHTML=rows;
document.querySelectorAll('.burow').forEach(r=>r.addEventListener('click',()=>{
  const i=r.dataset.i; const car=r.querySelector('.caret');
  const open=car.textContent==='▾'; car.textContent=open?'▸':'▾';
  document.querySelectorAll(`.jtrow[data-p="${i}"]`).forEach(x=>x.style.display=open?'none':'');
}));

// legend + footer
const bands=[['≥75%','--g5'],['65–75','--g4'],['55–65','--g3'],['45–55','--g2'],['35–45','--g1'],['<35','--g0']];
document.getElementById('legend').innerHTML='<span style="margin-right:4px">Margin shading:</span>'+bands.map(([t,c])=>{
  const col=getComputedStyle(document.documentElement).getPropertyValue(c).trim();
  return `<span class="sw" style="background:${hexA(col,.5)}"></span><span>${t}</span>`;}).join('');
document.getElementById('foot').innerHTML=
  `<b>Method.</b> Gross Margin % is <b>revenue-weighted</b> — total Jobs Gross Margin $ ÷ total Jobs Total Revenue across the jobs in each group (a big job counts more than a small one). Jobs are dated by <b>Completion Date</b>; each window ends at ${shortD(m.cutoffEnd)} (today minus 5 days) so recently-completed jobs whose costs may still be posting are excluded. Business Units and Job Types are shown for every completed job with revenue in the period. Shading reflects the margin <i>level</i> (greener = higher) and is a visual aid, not a target. Click a Business Unit row to collapse its Job Types.`;
</script>
</body>
</html>
