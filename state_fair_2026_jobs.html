.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px 16px;margin-top:12px}.panel h2{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin:6px 0}.bar .lbl{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden}.fill{height:100%;border-radius:6px}.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}

.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--edge);border-radius:999px;padding:3px;gap:2px;margin:0 0 10px}.seg button{border:0;background:transparent;color:var(--dim);padding:5px 13px;border-radius:999px;font-size:13px;cursor:pointer}.seg button.on{background:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--edge);white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}th.sorted{color:var(--accent)}tr:hover td{background:var(--panel2)}td.num{text-align:right;font-variant-numeric:tabular-nums}

     .catch(function(){return null;}); }

 var zips=Object.keys(byZip); var bounds=[]; var mapped=0;
 Promise.all(zips.map(function(z){ return geocode(z).then(function(c){ if(!c)return; var list=byZip[z]; var n=list.length;
   list.forEach(function(r,i){ var lat=c[0],lng=c[1];
     if(n>1){var ang=2*Math.PI*i/n; var rad=0.004+0.0018*Math.floor(i/12); lat+=rad*Math.cos(ang); lng+=rad*Math.sin(ang)/Math.cos(c[0]*Math.PI/180);}
     var col=COL[r.bu]||'#7c8a9c'; mapped++; bounds.push([lat,lng]);
     L.circleMarker([lat,lng],{radius:7,weight:1.5,color:'#0e1116',fillColor:col,fillOpacity:.92}).addTo(map)
      .bindPopup('<b>'+(r.cust||'')+'</b><br>'+(r.city||'')+' '+z+'<br>'+(r.bu||'')+' · '+(r.type||'')+'<br>Sched '+(r.sched||'—')+' · '+(r.tech||'')+'<br>'+(r.status||''));
   });
 }); })).then(function(){ try{localStorage.setItem('sfZipGeo',JSON.stringify(cache));}catch(e){}
   if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:12});
   if(leg){var parts=Object.keys(COL).map(function(k){return '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+COL[k]+';margin:0 4px 0 14px;vertical-align:middle"></span>'+k;}).join('');
     leg.innerHTML='Mapped '+mapped+' of '+rows.length+' jobs across '+zips.length+' ZIPs · located by ZIP-code centroid (same-ZIP markers are fanned out slightly).'+parts;}
 });
})();
</script>
