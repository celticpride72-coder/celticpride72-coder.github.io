<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Rep Scorecard — Comfort by Design</title>
<style>
 :root{--bg:#0e1116;--panel:#161b22;--panel2:#1b212b;--edge:#232a34;--ink:#e7edf5;--dim:#93a1b3;--muted:#7c8a9c;--accent:#4c8dff;--accent2:#2bd4a7;--good:#2bd4a7;--warn:#f5c451;--bad:#f8736a}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .wrap{max-width:1480px;margin:0 auto;padding:22px 22px 70px}h1{margin:0;font-size:26px}
 .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);margin-right:8px;vertical-align:middle}
 .sub{color:var(--dim);font-size:14px;margin-top:4px}.controls{display:flex;gap:10px;align-items:center;margin:16px 0 8px}
 .seg{display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden}.seg button{background:var(--panel);color:var(--dim);border:0;padding:9px 15px;font-size:14px;cursor:pointer}.seg button.on{background:var(--accent);color:#fff;font-weight:700}.count{margin-left:auto;color:var(--dim);font-size:13px}
 .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:14px 0}
 .kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:12px;padding:14px 16px}
 .kpi .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.kpi .val{font-size:25px;font-weight:750;margin-top:5px}.kpi .foot{font-size:11.5px;color:var(--dim);margin-top:4px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px}.panel h3{margin:0 0 12px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
 .bar-row{display:grid;grid-template-columns:130px 1fr 110px;align-items:center;gap:10px;margin:8px 0;font-size:14px}.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:15px;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px}.bar-row .amt{text-align:right;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
 table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--edge);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer}tr:hover td{background:var(--panel)}.twrap{overflow-x:auto;border:1px solid var(--edge);border-radius:12px}td.g{color:var(--good)}td.a{color:var(--warn)}td.b{color:var(--bad)}
 .note{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
 @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
 <h1><span class="dot"></span>Sales Rep Scorecard</h1>
 <div class="sub" id="sub"></div>
 <div class="controls"><div class="seg" id="seg"></div><span class="count" id="count"></span></div>
 <div class="kpis" id="kpis"></div>
 <div class="grid2"><div class="panel"><h3>Sold revenue by rep</h3><div id="revBars"></div></div><div class="panel"><h3>Average ticket by rep</h3><div id="avgBars"></div></div></div>
 <div class="panel"><h3>All reps</h3><div class="twrap"><table id="tbl"><thead></thead><tbody></tbody></table></div></div>
 <div class="note" id="note"></div>
</div>
<script>
const EMB=/*DATA_START*/{"asOf":"2026-08-14","today":"2026-08-17","closeRate":null,"periods":{"d30":{"reps":[{"t":"Aaron Fischer","jobs":64,"inst":60,"rev":449416,"avg":7022,"gp":49.5,"svcPct":22},{"t":"Noah M","jobs":36,"inst":32,"rev":434195,"avg":12061,"gp":53.5,"svcPct":39},{"t":"Michael K","jobs":54,"inst":2,"rev":30277,"avg":561,"gp":61,"svcPct":7},{"t":"Jeremy N","jobs":18,"inst":6,"rev":19170,"avg":1065,"gp":70.9,"svcPct":17},{"t":"Micah G","jobs":11,"inst":7,"rev":13601,"avg":1236,"gp":54.9,"svcPct":0},{"t":"Jesse T","jobs":36,"inst":1,"rev":10811,"avg":300,"gp":null,"svcPct":0},{"t":"Isaiah R","jobs":11,"inst":0,"rev":7114,"avg":647,"gp":null,"svcPct":0},{"t":"Kurtis K","jobs":20,"inst":1,"rev":6294,"avg":315,"gp":null,"svcPct":0},{"t":"Robert J","jobs":6,"inst":0,"rev":3996,"avg":666,"gp":null,"svcPct":0},{"t":"Jacob S","jobs":8,"inst":0,"rev":3267,"avg":408,"gp":null,"svcPct":0},{"t":"Mike R","jobs":6,"inst":0,"rev":2224,"avg":371,"gp":null,"svcPct":0},{"t":"Chuck F","jobs":1,"inst":0,"rev":861,"avg":861,"gp":null,"svcPct":0}],"team":{"reps":12,"jobs":271,"rev":981226,"avg":3621,"gp":52,"svcPct":13}},"d90":{"reps":[{"t":"Aaron Fischer","jobs":198,"inst":188,"rev":1365473,"avg":6896,"gp":50.4,"svcPct":27},{"t":"Noah M","jobs":110,"inst":100,"rev":1045899,"avg":9508,"gp":53.2,"svcPct":45},{"t":"Michael K","jobs":157,"inst":7,"rev":108253,"avg":690,"gp":52.7,"svcPct":4},{"t":"Micah G","jobs":31,"inst":19,"rev":90856,"avg":2931,"gp":49.1,"svcPct":13},{"t":"Jeremy N","jobs":41,"inst":17,"rev":53439,"avg":1303,"gp":64.3,"svcPct":20},{"t":"Kurtis K","jobs":85,"inst":2,"rev":46336,"avg":545,"gp":null,"svcPct":0},{"t":"Lee P","jobs":5,"inst":4,"rev":31499,"avg":6300,"gp":54.2,"svcPct":100},{"t":"Jesse T","jobs":138,"inst":2,"rev":31265,"avg":227,"gp":19.9,"svcPct":0},{"t":"Jacob S","jobs":38,"inst":0,"rev":15818,"avg":416,"gp":null,"svcPct":0},{"t":"Isaiah R","jobs":27,"inst":0,"rev":15736,"avg":583,"gp":null,"svcPct":0},{"t":"Brock H","jobs":21,"inst":0,"rev":7910,"avg":377,"gp":null,"svcPct":0},{"t":"Robert J","jobs":13,"inst":0,"rev":6851,"avg":527,"gp":null,"svcPct":0},{"t":"Mike R","jobs":24,"inst":0,"rev":6310,"avg":263,"gp":null,"svcPct":0},{"t":"Chuck F","jobs":4,"inst":0,"rev":2522,"avg":631,"gp":null,"svcPct":0},{"t":"Collin L","jobs":2,"inst":2,"rev":2087,"avg":1044,"gp":55.4,"svcPct":50}],"team":{"reps":15,"jobs":894,"rev":2830254,"avg":3166,"gp":51.8,"svcPct":14}},"ytd":{"reps":[{"t":"Aaron Fischer","jobs":519,"inst":485,"rev":3299024,"avg":6357,"gp":49.8,"svcPct":24},{"t":"Noah M","jobs":234,"inst":218,"rev":1918296,"avg":8198,"gp":52.7,"svcPct":39},{"t":"Micah G","jobs":74,"inst":48,"rev":218588,"avg":2954,"gp":40.1,"svcPct":5},{"t":"Michael K","jobs":161,"inst":7,"rev":110936,"avg":689,"gp":52.7,"svcPct":4},{"t":"Jeremy N","jobs":41,"inst":17,"rev":53439,"avg":1303,"gp":64.3,"svcPct":20},{"t":"Kurtis K","jobs":88,"inst":3,"rev":52800,"avg":600,"gp":72.2,"svcPct":0},{"t":"Jesse T","jobs":142,"inst":3,"rev":36516,"avg":257,"gp":21.5,"svcPct":0},{"t":"Lee P","jobs":5,"inst":4,"rev":31499,"avg":6300,"gp":54.2,"svcPct":100},{"t":"Chuck F","jobs":15,"inst":3,"rev":20242,"avg":1349,"gp":47.6,"svcPct":0},{"t":"Jacob S","jobs":42,"inst":0,"rev":19072,"avg":454,"gp":null,"svcPct":2},{"t":"Isaiah R","jobs":28,"inst":0,"rev":17008,"avg":607,"gp":null,"svcPct":0},{"t":"Adam Vodnik","jobs":2,"inst":2,"rev":9926,"avg":4963,"gp":54.6,"svcPct":0},{"t":"Collin L","jobs":7,"inst":5,"rev":8350,"avg":1193,"gp":46.5,"svcPct":43},{"t":"Brock H","jobs":21,"inst":0,"rev":7910,"avg":377,"gp":null,"svcPct":0},{"t":"Robert J","jobs":15,"inst":0,"rev":7176,"avg":478,"gp":null,"svcPct":0},{"t":"Mike R","jobs":24,"inst":0,"rev":6310,"avg":263,"gp":null,"svcPct":0},{"t":"1. Install Tech","jobs":1,"inst":0,"rev":4045,"avg":4045,"gp":null,"svcPct":0},{"t":"Ethan E","jobs":1,"inst":0,"rev":582,"avg":582,"gp":null,"svcPct":0}],"team":{"reps":18,"jobs":1420,"rev":5821719,"avg":4100,"gp":50.7,"svcPct":17}}}}/*DATA_END*/;
const REFRESHED=/*STAMP_START*/"Aug 17, 2026"/*STAMP_END*/;
const money=v=>(v||v===0)?"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0}):"—";
let period="ytd";const PT={d30:"Last 30 days",d90:"Last 90 days",ytd:"2026 YTD"};
const seg=document.getElementById("seg");
[["d30","30d"],["d90","90d"],["ytd","YTD"]].forEach(([v,l])=>{const b=document.createElement("button");b.textContent=l;if(v===period)b.className="on";b.onclick=()=>{period=v;[...seg.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");render();};seg.appendChild(b);});
let sortK="rev",sortDir=-1;
const COLS=[{k:"t",h:"Rep"},{k:"jobs",h:"Sold jobs"},{k:"inst",h:"Installs"},{k:"rev",h:"Sold $",f:r=>money(r.rev)},{k:"avg",h:"Avg ticket",f:r=>money(r.avg)},{k:"gp",h:"Install GP%",f:r=>r.gp==null?"—":r.gp+"%",cl:r=>r.gp==null?"":r.gp>=50?"g":r.gp>=42?"a":"b"},{k:"svcPct",h:"From svc leads",f:r=>r.svcPct+"%"},{k:"close",h:"Close %",f:r=>"—"}];
function render(){
 const P=EMB.periods[period],T=P.team;
 document.getElementById("count").textContent=PT[period]+" · "+T.reps+" reps · "+T.jobs+" sold jobs";
 document.getElementById("kpis").innerHTML=[
  {k:"Reps",v:T.reps,f:T.jobs+" sold jobs"},{k:"Sold revenue",v:money(T.rev),f:PT[period]},{k:"Avg ticket",v:money(T.avg),f:"per sold job"},
  {k:"Install GP%",v:(T.gp==null?"—":T.gp+"%"),f:"blended"},{k:"From service leads",v:T.svcPct+"%",f:"vs marketed leads"},{k:"Company close %",v:"see 4DX",f:"WIG-2 closing %"}
 ].map(c=>`<div class="kpi"><div class="k">${c.k}</div><div class="val">${c.v}</div><div class="foot">${c.f}</div></div>`).join("");
 const reps=P.reps;
 const rv=reps.slice().sort((a,b)=>b.rev-a.rev).slice(0,12),mR=Math.max(...rv.map(x=>x.rev),1);
 document.getElementById("revBars").innerHTML=rv.map(x=>`<div class="bar-row"><div class="nm" title="${x.t}">${x.t}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.rev/mR*100)}%;background:var(--accent)"></div></div><div class="amt">${money(x.rev)}</div></div>`).join("");
 const av=reps.filter(x=>x.jobs>=5).sort((a,b)=>b.avg-a.avg).slice(0,12),mA=Math.max(...av.map(x=>x.avg),1);
 document.getElementById("avgBars").innerHTML=av.map(x=>`<div class="bar-row"><div class="nm" title="${x.t}">${x.t}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.avg/mA*100)}%;background:var(--accent2)"></div></div><div class="amt">${money(x.avg)} · ${x.jobs}</div></div>`).join("");
 document.querySelector("#tbl thead").innerHTML="<tr>"+COLS.map(c=>`<th data-k="${c.k}">${c.h}${sortK===c.k?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
 const s=reps.slice().sort((a,b)=>{const va=a[sortK],vb=b[sortK];if(va==null)return 1;if(vb==null)return -1;return va<vb?-sortDir:va>vb?sortDir:0;});
 document.querySelector("#tbl tbody").innerHTML=s.map(r=>"<tr>"+COLS.map(c=>{const v=c.f?c.f(r):r[c.k];return `<td class="${c.cl?c.cl(r):''}">${v}</td>`;}).join("")+"</tr>").join("")
  +`<tr style="font-weight:750;border-top:2px solid var(--edge)"><td>TEAM</td><td>${T.jobs}</td><td></td><td>${money(T.rev)}</td><td>${money(T.avg)}</td><td>${T.gp==null?"—":T.gp+"%"}</td><td>${T.svcPct}%</td><td>—</td></tr>`;
 document.querySelectorAll("#tbl th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortK)sortDir*=-1;else{sortK=k;sortDir=(k==="t")?1:-1;}render();});
}
document.getElementById("sub").innerHTML="Sold production by rep (completed work) &nbsp;·&nbsp; data through "+EMB.asOf+" &nbsp;·&nbsp; updated "+REFRESHED;
document.getElementById("note").innerHTML="<b>Scope:</b> completed 2026 jobs carrying a Sold By, grouped by rep. <b>Sold $</b> = revenue on those jobs; <b>Install GP%</b> = margin on their install jobs; <b>From service leads</b> = share sold off a service/maintenance lead (self-generated) vs a marketed lead. <b>Close %</b> is company-level in the 4DX scoreboard (WIG-2); a per-rep close rate needs the full estimate list from Sales4dx — I can add that column next.";
render();
</script></body></html>
