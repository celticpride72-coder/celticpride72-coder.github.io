<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduled Installs — Comfort by Design</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1b212b; --edge:#232a34; --ink:#e7edf5; --dim:#93a1b3; --muted:#7c8a9c;
    --accent:#4c8dff; --accent2:#2bd4a7;
    --hvac:#4c8dff; --fire:#ff7a59; --elec:#f5c451;
    --good:#2bd4a7; --warn:#f5c451;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit}
  .wrap{max-width:1480px;margin:0 auto;padding:22px 22px 70px}
  header.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  h1{margin:0;font-size:26px;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:14px;margin-top:4px}
  .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);margin-right:8px;vertical-align:middle}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:20px 0 10px}
  .kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:12px;padding:16px 18px}
  .kpi .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .kpi .val{font-size:30px;font-weight:750;margin-top:6px;line-height:1.1}
  .kpi .foot{font-size:12px;color:var(--dim);margin-top:5px}

  .grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:16px 0}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px}
  .panel h3{margin:0 0 12px;font-size:14px;letter-spacing:.3px;color:var(--dim);text-transform:uppercase}
  .bar-row{display:grid;grid-template-columns:132px 1fr 92px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
  .bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track{height:16px;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;overflow:hidden}
  .fill{height:100%;border-radius:8px}
  .bar-row .amt{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}

  /* controls */
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 12px}
  .controls select,.controls input{background:var(--panel);border:1px solid var(--edge);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:14px}
  .controls input{min-width:210px}
  .controls .clr{cursor:pointer;background:var(--panel2);border:1px solid var(--edge);color:var(--dim);border-radius:9px;padding:9px 13px;font-size:13px}
  .controls .count{margin-left:auto;color:var(--dim);font-size:13px}

  /* schedule */
  .day{margin:16px 0}
  .day-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;border-bottom:1px solid var(--edge);padding-bottom:7px}
  .day-h .d{font-size:17px;font-weight:750}
  .day-h .meta{color:var(--dim);font-size:13px}
  .jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .job{background:var(--panel);border:1px solid var(--edge);border-left-width:4px;border-radius:11px;padding:14px 16px}
  .job .jt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .job .cust{font-weight:700;font-size:16px}
  .job .amt{font-weight:750;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .job .line{color:var(--dim);font-size:13px;margin-top:4px}
  .job .tags{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
  .tag{background:var(--panel2);border:1px solid var(--edge);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--dim)}
  .badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:750;letter-spacing:.3px;color:#0c0f14}
  .b-hvac{background:var(--hvac)} .b-fire{background:var(--fire)} .b-elec{background:var(--elec)}
  .pill-com{background:var(--panel2);border:1px solid var(--edge);color:var(--dim);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;margin-left:6px}
  .noval{color:var(--warn)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--edge);white-space:nowrap}
  th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--bg)}
  th:hover{color:var(--ink)}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  tr:hover td{background:var(--panel)}
  .twrap{overflow-x:auto;border:1px solid var(--edge);border-radius:12px}
  .foot-note{color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6}

  /* calendar (week grid) */
  .legend{display:flex;gap:14px;margin:2px 0 12px;flex-wrap:wrap}
  .legend .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px}
  .cal-head>div{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;font-weight:700}
  .week-lbl{font-size:11.5px;color:var(--muted);margin:12px 2px 5px;font-weight:600}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal-cell{min-height:80px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 9px}
  .cal-cell.we{background:#12161d}
  .cal-cell.has{border-color:#33414f}
  .cal-cell.today{outline:2px solid var(--accent2);outline-offset:-2px}
  .cal-cell .cd{font-size:12px;color:var(--dim);font-weight:700}
  .cal-cell.today .cd{color:var(--accent2)}
  .cvals{font-size:12.5px;margin-top:6px;font-variant-numeric:tabular-nums}
  .cdots{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .cdot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
  .cdot.miss{opacity:.28}
  .cmore{font-size:10px;color:var(--muted);font-weight:700}
  .cdone{font-size:11px;margin-top:6px;font-weight:700;line-height:1.3}
  .cdone .miss{color:var(--muted);font-weight:600}
  .pct-g{color:#2bd4a7}.pct-a{color:#f5c451}.pct-b{color:#f8736a}
  .cal-cell.pastc{background:#10151d}
  .cal-cell.pastc.we{background:#0f131a}

  @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.jobs{grid-template-columns:1fr}
    .cal-head{display:none}.cal-week{grid-template-columns:repeat(2,1fr)}.cal-cell:not(.has){display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="dot"></span>Scheduled Installs</h1>
      <div class="sub" id="sub"></div>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="grid2">
    <div class="panel"><h3>By Trade</h3><div id="byTrade"></div></div>
    <div class="panel"><h3>By Business Unit</h3><div id="byBU"></div></div>
    <div class="panel"><h3>By Lead Tech</h3><div id="byTech"></div></div>
  </div>

  <div class="controls">
    <select id="fTrade"><option value="">All trades</option></select>
    <select id="fBU"><option value="">All business units</option></select>
    <select id="fTech"><option value="">All techs</option></select>
    <input id="fSearch" placeholder="Search customer, job #, tag…">
    <span class="clr" id="clr">Clear</span>
    <span class="count" id="count"></span>
  </div>

  <h3 style="color:var(--dim);text-transform:uppercase;font-size:14px;letter-spacing:.3px;margin:24px 0 8px">Install calendar</h3>
  <div class="legend" id="calLegend"></div>
  <div id="calendar"></div>

  <h3 style="color:var(--dim);text-transform:uppercase;font-size:14px;letter-spacing:.3px;margin:30px 0 8px">Scheduled by day</h3>
  <div id="schedule"></div>

  <h3 style="color:var(--dim);text-transform:uppercase;font-size:14px;letter-spacing:.3px;margin:30px 0 8px">All scheduled installs</h3>
  <div class="twrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>

  <div class="foot-note" id="note"></div>
</div>

<script>
const DATA = /*DATA_START*/[{"Job #":"148933911","Job Type":"HVAC Install Replacement","Business Unit":"HVAC-Install-CBD","Status":"Scheduled","Created Date":"2025-12-03","Sold On":"2025-12-03","Customer ID":"148862467","Customer Name":"SHELDAHL, RITA","Tags":"Air Conditioner, Gas Furnace, Need to Schedule, Parts In","Jobs Subtotal":13733,"Jobs Total":13733,"Jobs Payments":13733,"Income":13733,"Scheduled Date":"2026-07-17","Hold Date":null,"Upcoming Appt Start Date":"2026-07-17","Assigned Technicians":"Chris B, Todd S, Will B","Primary Technician":"Chris B"},{"Job #":"159563162","Job Type":"FIRE Com Install","Business Unit":"FIRE-Install-Com-CBD","Status":"Scheduled","Created Date":"2026-07-30","Sold On":"2026-07-30","Customer ID":"16191866","Customer Name":"1st CHOICE BUILDERS LLC","Tags":"Fireplace 🔥, Need to Schedule, Parts In, Sign Off Completed","Jobs Subtotal":12930.95,"Jobs Total":12930.95,"Jobs Payments":0,"Income":12930.95,"Scheduled Date":"2026-08-14","Hold Date":null,"Upcoming Appt Start Date":"2026-08-14","Assigned Technicians":"Garrett G, Joe H","Primary Technician":"Garrett G"},{"Job #":"159806862","Job Type":"HVAC Install Replacement","Business Unit":"HVAC-Install-CBD","Status":"Scheduled","Created Date":"2026-08-04","Sold On":"2026-08-04","Customer ID":"16208122","Customer Name":"JOHNSON, JACK AND DIANE","Tags":"Essentials Member, Geo W/W, Parts In, Sign Off Needed","Jobs Subtotal":17314.7,"Jobs Total":17314.7,"Jobs Payments":8650,"Income":17314.7,"Scheduled Date":"2026-08-14","Hold Date":null,"Upcoming Appt Start Date":"2026-08-14","Assigned Technicians":"Luke H, Chris B","Primary Technician":"Chris B"},{"Job #":"159831994","Job Type":"HVAC Install Replacement","Business Unit":"HVAC-Install-CBD","Status":"Scheduled","Created Date":"2026-08-05","Sold On":"2026-08-05","Customer ID":"159316358","Customer Name":"FEATHERSTONE, DON","Tags":"Geo 🌎, Parts In, Rebate, Sign Off Needed","Jobs Subtotal":16482,"Jobs Total":16482,"Jobs Payments":7991,"Income":16482,"Scheduled Date":"2026-08-14","Hold Date":null,"Upcoming Appt Start Date":"2026-08-14","Assigned Technicians":"Jason L, Nash K","Primary Technician":"Jason L"},{"Job #":"160020512","Job Type":"ELEC Install","Business Unit":"ELEC-Install-CBD","Status":"Scheduled","Created Date":"2026-08-11","Sold On":null,"Customer ID":"16210157","Customer Name":"OLSON, SCOTT AND KOURIK, BETH","Tags":"Gas Furnace, Geo 🌎, Potential Member","Jobs Subtotal":0,"Jobs Total":0,"Jobs Payments":0,"Income":0,"Scheduled Date":"2026-08-17","Hold Date":null,"Upcoming Appt Start Date":"2026-08-17","Assigned Technicians":"Buck S","Primary Technician":"Buck S"},{"Job #":"157121180","Job Type":"FIRE Com Install","Business Unit":"FIRE-Install-Com-CBD","Status":"Scheduled","Created Date":"2026-06-24","Sold On":"2026-06-24","Customer ID":"16225493","Customer Name":"THE DETAIL COMPANY","Tags":"Fireplace 🔥, Need to Schedule, Parts In, Sign Off Completed","Jobs Subtotal":6056.2,"Jobs Total":6056.2,"Jobs Payments":6056.2,"Income":6056.2,"Scheduled Date":"2026-08-17","Hold Date":null,"Upcoming Appt Start Date":"2026-08-17","Assigned Technicians":"Garrett G, Joe H","Primary Technician":"Garrett G"},{"Job #":"157200415","Job Type":"FIRE Install","Business Unit":"FIRE-Install-CBD","Status":"Scheduled","Created Date":"2026-06-25","Sold On":"2026-06-25","Customer ID":"114935407","Customer Name":"SPRAFKA, CHARLIE AND KATHY","Tags":"Fireplace 🔥, Need to Schedule, Parts In, Sign Off Completed, Subcontractor","Jobs Subtotal":9080,"Jobs Total":9080,"Jobs Payments":4675,"Income":9080,"Scheduled Date":"2026-08-17","Hold Date":null,"Upcoming Appt Start Date":"2026-08-17","Assigned Technicians":"Dale C, Howard B","Primary Technician":"Dale C"},{"Job #":"159979781","Job Type":"ELEC Install","Business Unit":"ELEC-Install-CBD","Status":"Scheduled","Created Date":"2026-08-10","Sold On":"2026-08-07","Customer ID":"159651989","Customer Name":"MAYNARD, CASEY","Tags":"Electrical, Install Parts Needed, Need to Schedule, Potential Member, Sales Sold","Jobs Subtotal":7506,"Jobs Total":7506,"Jobs Payments":3500,"Income":7506,"Scheduled Date":"2026-08-17","Hold Date":null,"Upcoming Appt Start Date":"2026-08-17","Assigned Technicians":"Jim J, Micah G","Primary Technician":"Jim J"},{"Job #":"159990928","Job Type":"HVAC Install Replacement","Business Unit":"HVAC-Install-CBD","Status":"Scheduled","Created Date":"2026-08-10","Sold On":null,"Customer ID":"159988508","Customer Name":"VETTA, CHRISTOPHER","Tags":"Geo W/W, Potential Member","Jobs Subtotal":0,"Jobs Total":0,"Jobs Payments":0,"Income":0,"Scheduled Date":"2026-08-17","Hold Date":null,"Upcoming Appt Start Date":"2026-08-17","Assigned Technicians":"Noah M","Primary Technician":"Noah M"},{"Job #":"160020424","Job Type":"HVAC Com Install Replacement","Business Unit":"HVAC-Install-Com-CBD","Status":"Scheduled","Created Date":"2026-08-11","Sold On":"2026-08-11","Customer ID":"160038161","Customer Name":"VON LANG CONSTRUCTION","Tags":"DUCTWORK, Install Parts Needed","Jobs Subtotal":3940,"Jobs Total":3940,"Jobs Payments":0,"Income":3940,"Scheduled Date":"2026-08-17","Hold Date":null,"Upcoming Appt Start Date":"2026-08-17","Assigned Technicians":"Jason L, Nash K, Campbell T","Primary Technician":"Campbell T"},{"Job #":"158503563","Job Type":"ELEC Install","Business Unit":"ELEC-Install-CBD","Status":"Scheduled","Created Date":"2026-07-14","Sold On":"2026-07-14","Customer ID":"153741219","Customer Name":"KO STORAGE","Tags":"Install Parts Needed, Need to Schedule, Potential Member, Sales Sold","Jobs Subtotal":5600,"Jobs Total":5600,"Jobs Payments":2800,"Income":5600,"Scheduled Date":"2026-08-18","Hold Date":null,"Upcoming Appt Start Date":"2026-08-18","Assigned Technicians":"Jim J, Micah G","Primary Technician":"Jim J"},{"Job #":"160022925","Job Type":"FIRE Install","Business Unit":"FIRE-Install-CBD","Status":"Scheduled","Created Date":"2026-08-11","Sold On":null,"Customer ID":"156842065","Customer Name":"WAGNER, PATRICK","Tags":"Fireplace 🔥, Potential Member","Jobs Subtotal":0,"Jobs Total":0,"Jobs Payments":0,"Income":0,"Scheduled Date":"2026-08-18","Hold Date":null,"Upcoming Appt Start Date":"2026-08-18","Assigned Technicians":"Garrett G, Joe H","Primary Technician":"Garrett G"},{"Job #":"160177052","Job Type":"ELEC Install","Business Unit":"ELEC-Install-CBD","Status":"Scheduled","Created Date":"2026-08-13","Sold On":null,"Customer ID":"16212449","Customer Name":"LUCHT, DOUG AND AMY","Tags":"Electrical, Potential Member","Jobs Subtotal":0,"Jobs Total":0,"Jobs Payments":0,"Income":0,"Scheduled Date":"2026-08-19","Hold Date":null,"Upcoming Appt Start Date":"2026-08-19","Assigned Technicians":"Micah G","Primary Technician":"Micah G"},{"Job #":"158341406","Job Type":"FIRE Install","Business Unit":"FIRE-Install-CBD","Status":"Scheduled","Created Date":"2026-07-11","Sold On":"2026-07-11","Customer ID":"16201857","Customer Name":"FLAHERTY, DENISE","Tags":"Fireplace 🔥, Need to Schedule, Parts Ordered, Potential Member, Sign Off Completed, Subcontractor","Jobs Subtotal":11184.78,"Jobs Total":11184.78,"Jobs Payments":6642,"Income":11184.78,"Scheduled Date":"2026-08-24","Hold Date":null,"Upcoming Appt Start Date":"2026-08-24","Assigned Technicians":"Garrett G, Joe H","Primary Technician":"Garrett G"}]/*DATA_END*/;
const REFRESHED = /*STAMP_START*/"Aug 14, 2026"/*STAMP_END*/;

const money = v => (v||v===0) ? "$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0}) : "—";
const money2 = v => "$"+Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

function trade(bu){
  if(/^HVAC/i.test(bu)) return "HVAC";
  if(/^FIRE/i.test(bu)) return "Fireplace";
  if(/^ELEC/i.test(bu)) return "Electrical";
  return "Other";
}
const TCLASS = {HVAC:"b-hvac",Fireplace:"b-fire",Electrical:"b-elec"};
const TVAR = {HVAC:"var(--hvac)",Fireplace:"var(--fire)",Electrical:"var(--elec)"};
const isCom = bu => /-Com-/i.test(bu);

// enrich
DATA.forEach(j=>{ j._trade=trade(j["Business Unit"]); j._val=Number(j["Jobs Total"]||0); j._com=isCom(j["Business Unit"]); });

function fmtDate(s){
  if(!s) return "—";
  const [y,m,d]=s.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
function shortDate(s){ if(!s) return "—"; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

// ---------- KPIs ----------
const total = DATA.reduce((a,j)=>a+j._val,0);
const priced = DATA.filter(j=>j._val>0);
const dates = [...new Set(DATA.map(j=>j["Scheduled Date"]).filter(Boolean))].sort();
const techs = [...new Set(DATA.map(j=>j["Primary Technician"]).filter(Boolean))];
const bus = [...new Set(DATA.map(j=>j["Business Unit"]))].sort();

document.getElementById("sub").innerHTML =
  DATA.length+" scheduled install jobs &nbsp;·&nbsp; "+shortDate(dates[0])+" – "+shortDate(dates[dates.length-1])+" 2026 &nbsp;·&nbsp; source: Kody Scheduled Install &nbsp;·&nbsp; refreshed "+REFRESHED;

const kpis=[
  {k:"Scheduled jobs",val:DATA.length,foot:priced.length+" priced · "+(DATA.length-priced.length)+" awaiting price"},
  {k:"Total value",val:money(total),foot:"across all scheduled installs"},
  {k:"Avg job (priced)",val:money(priced.reduce((a,j)=>a+j._val,0)/priced.length),foot:priced.length+" priced jobs"},
  {k:"Install days",val:dates.length,foot:shortDate(dates[0])+" – "+shortDate(dates[dates.length-1])},
  {k:"Techs assigned",val:techs.length,foot:bus.length+" business units"}
];
document.getElementById("kpis").innerHTML = kpis.map(k=>
  `<div class="kpi"><div class="k">${k.k}</div><div class="val">${k.val}</div><div class="foot">${k.foot}</div></div>`).join("");

// ---------- breakdown bars ----------
function groupSum(key){
  const m={};
  DATA.forEach(j=>{ const g=(typeof key==="function")?key(j):j[key]; if(!m[g]) m[g]={n:0,v:0}; m[g].n++; m[g].v+=j._val; });
  return Object.entries(m).sort((a,b)=>b[1].v-a[1].v);
}
function renderBars(elId, entries, colorFn){
  const max=Math.max(...entries.map(e=>e[1].v),1);
  document.getElementById(elId).innerHTML = entries.map(([nm,o])=>{
    const w=Math.max(3,(o.v/max)*100);
    return `<div class="bar-row"><div class="nm" title="${nm}">${nm}</div>
      <div class="track"><div class="fill" style="width:${w}%;background:${colorFn(nm)}"></div></div>
      <div class="amt">${money(o.v)}<span style="color:var(--muted)"> · ${o.n}</span></div></div>`;
  }).join("");
}
renderBars("byTrade", groupSum(j=>j._trade), nm=>TVAR[nm]||"var(--accent)");
renderBars("byBU", groupSum("Business Unit"), nm=>TVAR[trade(nm)]||"var(--accent)");
renderBars("byTech", groupSum("Primary Technician"), ()=>"var(--accent2)");

// ---------- filters ----------
const fTrade=document.getElementById("fTrade"), fBU=document.getElementById("fBU"), fTech=document.getElementById("fTech"), fSearch=document.getElementById("fSearch");
["HVAC","Fireplace","Electrical"].filter(t=>DATA.some(j=>j._trade===t)).forEach(t=>fTrade.add(new Option(t,t)));
bus.forEach(b=>fBU.add(new Option(b,b)));
techs.sort().forEach(t=>fTech.add(new Option(t,t)));

function passes(j){
  if(fTrade.value && j._trade!==fTrade.value) return false;
  if(fBU.value && j["Business Unit"]!==fBU.value) return false;
  if(fTech.value && j["Primary Technician"]!==fTech.value) return false;
  const q=fSearch.value.trim().toLowerCase();
  if(q){ const hay=[j["Customer Name"],j["Job #"],j["Tags"],j["Job Type"],j["Assigned Technicians"]].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}

// ---------- calendar (week grid) ----------
const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const keyOf = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const parseK = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
function mondayOf(dt){ const x=new Date(dt); const off=(x.getDay()+6)%7; x.setDate(x.getDate()-off); x.setHours(0,0,0,0); return x; }
const TODAY = keyOf(new Date());
const PAST_WINDOW_DAYS = 42;
let LEDGER = null;   // adherence ledger jobs, loaded async for the completion overlay

document.getElementById("calLegend").innerHTML =
  ["HVAC","Fireplace","Electrical"].filter(t=>DATA.some(j=>j._trade===t))
   .map(t=>`<span class="lg"><span class="cdot" style="background:${TVAR[t]}"></span>${t}</span>`).join("")
  + `<span class="lg" style="margin-left:6px"><span class="cdot" style="background:var(--dim)"></span>done that day</span>`
  + `<span class="lg"><span class="cdot" style="background:var(--dim);opacity:.28"></span>not done that day</span>`;

// Pull the adherence ledger (same folder) to overlay each past day with % completed on the scheduled day.
if(typeof fetch==="function"){
  fetch("installs_adherence_ledger.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(j=>{ LEDGER=(j&&Array.isArray(j.jobs))?j.jobs:null; renderCalendar(current()); })
    .catch(()=>{});
}

function ledgerPasses(j){
  if(fTrade.value && j.trade!==fTrade.value) return false;
  if(fBU.value && j.bu!==fBU.value) return false;
  if(fTech.value && (j.tech||"")!==fTech.value) return false;
  const q=fSearch.value.trim().toLowerCase();
  if(q){ const hay=[j.customer,j.job,j.tech,j.bu].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
  return true;
}

function renderCalendar(rows){
  const el=document.getElementById("calendar");
  // upcoming / today cohorts from the current scheduled export
  const schedByDay={};
  rows.forEach(j=>{ const d=j["Scheduled Date"]; if(d){ (schedByDay[d]=schedByDay[d]||[]).push(j); } });
  // past cohorts from the ledger (locked scheduled date + completion status), within the trailing window
  const ledByDay={};
  const pastStart=keyOf(new Date(Date.now()-PAST_WINDOW_DAYS*86400000));
  if(LEDGER){ LEDGER.filter(ledgerPasses).forEach(j=>{ const d=j.scheduled_date; if(d && d<TODAY && d>=pastStart){ (ledByDay[d]=ledByDay[d]||[]).push(j); } }); }

  const allDays=new Set([...Object.keys(schedByDay), ...Object.keys(ledByDay)]);
  if(!allDays.size){ el.innerHTML='<div class="panel" style="text-align:center;color:var(--dim)">No scheduled dates match these filters.</div>'; return; }
  const weeks=[...new Set([...allDays].map(d=>keyOf(mondayOf(parseK(d)))))].sort();

  el.innerHTML = '<div class="cal-head">'+WD.map(w=>`<div>${w}</div>`).join("")+'</div>' +
    weeks.map(wk=>{
      const mon=parseK(wk); let cells="";
      for(let i=0;i<7;i++){
        const day=new Date(mon); day.setDate(mon.getDate()+i); const k=keyOf(day);
        const past = k<TODAY;
        let inner="";
        if(past && ledByDay[k]){
          const list=ledByDay[k].slice().sort((a,b)=>(b.value||0)-(a.value||0));
          const sched=list.length;
          const doneOn=list.filter(j=>j.completed_date===k).length;
          const rev=list.reduce((a,j)=>a+(j.value||0),0);
          const uncomp=list.filter(j=>j.completed_date!==k).reduce((a,j)=>a+(j.value||0),0);
          const pctv=sched?Math.round(doneOn/sched*100):0;
          const pc=pctv>=80?'pct-g':pctv>=50?'pct-a':'pct-b';
          const dots=list.slice(0,8).map(j=>`<span class="cdot${j.completed_date===k?'':' miss'}" style="background:${TVAR[j.trade]||'var(--dim)'}" title="${(j.customer||'').replace(/"/g,'')} · ${j.trade}${j.value?' · '+money(j.value):''}${j.completed_date?(j.completed_date===k?' · done '+shortDate(k):' · done '+shortDate(j.completed_date)):' · not yet completed'}"></span>`).join("");
          inner=`<div class="cvals"><b>${sched}</b> job${sched>1?"s":""} · ${money(rev)}</div>`+
                `<div class="cdots">${dots}${list.length>8?`<span class="cmore">+${list.length-8}</span>`:""}</div>`+
                `<div class="cdone"><span class="${pc}">${pctv}% done</span> · <span class="miss">${money(uncomp)} not done</span></div>`;
        } else {
          const list=(schedByDay[k]||[]).slice().sort((a,b)=>b._val-a._val);
          if(list.length){
            const sum=list.reduce((a,j)=>a+j._val,0);
            const dots=list.slice(0,8).map(j=>`<span class="cdot" style="background:${TVAR[j._trade]||'var(--dim)'}" title="${(j['Customer Name']||'').replace(/"/g,'')} · ${j._trade}${j._val?' · '+money(j._val):''}"></span>`).join("");
            inner=`<div class="cvals"><b>${list.length}</b> job${list.length>1?"s":""} · ${money(sum)}</div><div class="cdots">${dots}${list.length>8?`<span class="cmore">+${list.length-8}</span>`:""}</div>`;
          }
        }
        const has=inner?' has':'';
        cells+=`<div class="cal-cell${i>=5?' we':''}${has}${k===TODAY?' today':''}${past&&has?' pastc':''}">
          <div class="cd">${WD[i]} ${day.getDate()}</div>${inner}</div>`;
      }
      return `<div class="week-lbl">Week of ${mon.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}</div><div class="cal-week">${cells}</div>`;
    }).join("");
}

// ---------- schedule (grouped by date) ----------
function renderSchedule(rows){
  const byDay={};
  rows.forEach(j=>{ const d=j["Scheduled Date"]||"Unscheduled"; (byDay[d]=byDay[d]||[]).push(j); });
  const days=Object.keys(byDay).sort();
  const el=document.getElementById("schedule");
  if(!rows.length){ el.innerHTML='<div class="panel" style="text-align:center;color:var(--dim)">No jobs match these filters.</div>'; return; }
  el.innerHTML = days.map(d=>{
    const list=byDay[d].sort((a,b)=>b._val-a._val);
    const dayTot=list.reduce((a,j)=>a+j._val,0);
    return `<div class="day">
      <div class="day-h"><span class="d">${fmtDate(d)}</span><span class="meta">${list.length} job${list.length>1?"s":""} · ${money(dayTot)}</span></div>
      <div class="jobs">${list.map(jobCard).join("")}</div></div>`;
  }).join("");
}
function jobCard(j){
  const tags=(j["Tags"]||"").split(",").map(s=>s.trim()).filter(Boolean);
  const bcl=TCLASS[j._trade]||"";
  return `<div class="job" style="border-left-color:${TVAR[j._trade]||'var(--edge)'}">
    <div class="jt"><div class="cust">${j["Customer Name"]||"—"}</div>
      <div class="amt ${j._val?'':'noval'}">${j._val?money(j._val):"no price"}</div></div>
    <div class="line"><span class="badge ${bcl}">${j._trade}</span>${j._com?'<span class="pill-com">COMMERCIAL</span>':''}
      &nbsp; ${j["Job Type"]}</div>
    <div class="line">Job #${j["Job #"]} &nbsp;·&nbsp; Lead: <b style="color:var(--ink)">${j["Primary Technician"]||"—"}</b>${j["Assigned Technicians"] && j["Assigned Technicians"]!==j["Primary Technician"]?" &nbsp;·&nbsp; Crew: "+j["Assigned Technicians"]:""}</div>
    <div class="line">Sold ${shortDate(j["Sold On"])} · created ${shortDate(j["Created Date"])}</div>
    ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>`:""}
  </div>`;
}

// ---------- table ----------
const COLS=[
  {h:"Sched",f:j=>shortDate(j["Scheduled Date"]),s:j=>j["Scheduled Date"]||""},
  {h:"Job #",f:j=>j["Job #"],s:j=>j["Job #"]},
  {h:"Trade",f:j=>j._trade+(j._com?" (Com)":""),s:j=>j._trade},
  {h:"Business Unit",f:j=>j["Business Unit"],s:j=>j["Business Unit"]},
  {h:"Job Type",f:j=>j["Job Type"],s:j=>j["Job Type"]},
  {h:"Customer",f:j=>j["Customer Name"],s:j=>j["Customer Name"]||""},
  {h:"Lead Tech",f:j=>j["Primary Technician"],s:j=>j["Primary Technician"]||""},
  {h:"Value",r:1,f:j=>j._val?money2(j._val):'<span class="noval">—</span>',s:j=>j._val},
  {h:"Sold On",f:j=>shortDate(j["Sold On"]),s:j=>j["Sold On"]||""}
];
let sortI=0, sortDir=1;
function renderTable(rows){
  document.querySelector("#tbl thead").innerHTML="<tr>"+COLS.map((c,i)=>
    `<th class="${c.r?'r':''}" data-i="${i}">${c.h}${sortI===i?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  const sorted=[...rows].sort((a,b)=>{
    const va=COLS[sortI].s(a), vb=COLS[sortI].s(b);
    if(va<vb) return -1*sortDir; if(va>vb) return 1*sortDir; return 0;
  });
  const tot=sorted.reduce((a,j)=>a+j._val,0);
  document.querySelector("#tbl tbody").innerHTML = sorted.map(j=>"<tr>"+COLS.map(c=>
    `<td class="${c.r?'r':''}">${c.f(j)}</td>`).join("")+"</tr>").join("")
    + `<tr style="font-weight:750"><td colspan="7" style="text-align:right;color:var(--dim)">Total (${sorted.length})</td><td class="r">${money2(tot)}</td><td></td></tr>`;
  document.querySelectorAll("#tbl th").forEach(th=>th.onclick=()=>{
    const i=+th.dataset.i; if(i===sortI) sortDir*=-1; else {sortI=i; sortDir= (COLS[i].h==="Value")?-1:1;}
    renderTable(current());
  });
}

// ---------- wire ----------
function current(){ return DATA.filter(passes); }
function refresh(){
  const rows=current();
  document.getElementById("count").textContent = rows.length+" of "+DATA.length+" jobs · "+money(rows.reduce((a,j)=>a+j._val,0));
  renderCalendar(rows);
  renderSchedule(rows);
  renderTable(rows);
}
[fTrade,fBU,fTech].forEach(s=>s.onchange=refresh);
fSearch.oninput=refresh;
document.getElementById("clr").onclick=()=>{fTrade.value="";fBU.value="";fTech.value="";fSearch.value="";refresh();};

document.getElementById("note").innerHTML =
  "Value = Jobs Total from the export. Jobs showing \u201cno price\u201d have a $0 Jobs Total (not yet priced/invoiced). "+
  "Trade &amp; Residential/Commercial are derived from Business Unit (\u201c-Com-\u201d = Commercial). "+
  "Generated "+new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+".";

refresh();
</script>
