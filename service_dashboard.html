<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Service Dashboard</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1b212b;--edge:#232a34;--ink:#e7edf5;--dim:#93a1b3;--accent:#2bd4a7;--blue:#4c8dff;--red:#ff6b6b;--amber:#f5b74e;--green:#38d39f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
h1{font-size:20px;margin:0 0 2px;font-weight:750}.sub{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden;margin-bottom:16px}
.seg button{background:var(--panel);color:var(--dim);border:0;padding:8px 16px;cursor:pointer;font-weight:650;font-size:13px}
.seg button.active{background:var(--accent);color:#06231b}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px 13px}
.kpi .lab{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:22px;font-weight:750;margin-top:3px}
.kpi .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.g{background:rgba(56,211,159,.15);color:var(--green)}.a{background:rgba(245,183,78,.15);color:var(--amber)}.r{background:rgba(255,107,107,.15);color:var(--red)}.n{background:#222c38;color:var(--dim)}
h2{font-size:14px;margin:16px 0 8px;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:right;font-size:12.5px;border-bottom:1px solid var(--edge)}th:first-child,td:first-child{text-align:left}
th{background:#12161d;color:var(--dim);font-weight:650}
tr.tot td{font-weight:750;background:#12161d}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:4px 0 8px}
.card h3{font-size:13px;margin:10px 12px 6px;font-weight:700}
.bar{height:16px;background:var(--accent);border-radius:3px;display:inline-block;vertical-align:middle;opacity:.85}
.bt{width:100%;border:0}.bt td,.bt th{border-bottom:1px solid var(--edge);font-size:12px;padding:6px 12px}
.muted{color:var(--dim)}.pending{color:var(--amber);font-size:12px;padding:10px 12px}
footer{margin-top:18px;color:var(--dim);font-size:11.5px;line-height:1.6}
</style></head><body><div class="wrap">

</div>
<footer id="foot"></footer>

function money(n){return '$'+Math.round(n).toLocaleString();}
function pct(n){return (n>=0?'':'')+n.toFixed(1)+'%';}
function yoy(cur,ly){if(ly==null||ly===0)return null;return (cur-ly)/Math.abs(ly)*100;}
function yTag(v){if(v==null)return '<span class="tag n">n/a LY</span>';var c=v>=0?'g':'r';return '<span class="tag '+c+'">'+(v>=0?'+':'')+v.toFixed(1)+'% vs LY</span>';}
function gTag(p){var c=p>=100?'g':(p>=95?'a':'r');return '<span class="tag '+c+'">'+p.toFixed(0)+'% of goal</span>';}
function kpi(lab,val,tags){return '<div class="kpi"><div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="row">'+tags.join('')+'</div></div>';}
function render(){
 var s=SVC[cur],sly=SVC[LY[cur]],t=TGL[cur],tly=TGL[LY[cur]],goal=GOAL[cur];

 var avgTicket=jrev?rev/jrev:0, avgJob=jobs?rev/jobs:0;
 var avgTicketLY=sly.nRev?sly.rev/sly.nRev:0, avgJobLY=sly.n?sly.rev/sly.n:0;
 var lp=TGLP[cur],lpLY=TGLP[LY[cur]];var tglPct=jobs?lp.numer/jobs*100:0, tglPctLY=sly.n?lpLY.numer/sly.n*100:0;
 document.getElementById('kpis').innerHTML=
  kpi('Service Revenue',money(rev),[gTag(goal?rev/goal*100:0),yTag(yoy(rev,sly.rev))])+
  kpi('TGL Sales',money(t.sales),[yTag(yoy(t.sales,tly.sales)),'<span class="tag n">'+t.count+' sold est</span>'])+
  kpi('TGL %',tglPct.toFixed(1)+'%',[yTag(tglPct-tglPctLY),'<span class="tag n">'+lp.numer+' of '+jobs+' service visits</span>'])+
  kpi('Avg Ticket <span class="muted">(rev jobs)</span>',money(avgTicket),[yTag(yoy(avgTicket,avgTicketLY))])+
  kpi('Avg Job Revenue <span class="muted">(all jobs)</span>',money(avgJob),[yTag(yoy(avgJob,avgJobLY))])+
  kpi('Service Jobs',jobs.toLocaleString(),[yTag(yoy(jobs,sly.n)),'<span class="tag n">'+jrev+' w/ revenue</span>'])+
  kpi('Service Goal',money(goal),['<span class="tag '+(rev>=goal?'g':'r')+'">'+money(rev-goal)+' vs goal</span>']);
 // BU table + trade totals
 document.getElementById('buper').textContent='— '+PLAB[cur];
 var bus=Object.keys(s.byBU).sort(function(a,b){return s.byBU[b].rev-s.byBU[a].rev;});
 var tb=document.getElementById('butb');tb.innerHTML='';
 function burow(name,x,tot,numer){var at=x.nRev?x.rev/x.nRev:0,aj=x.n?x.rev/x.n:0;
   var tg=(numer!=null&&x.n)?(numer/x.n*100).toFixed(1)+'%':'&mdash;';
   return '<tr'+(tot?' class="tot"':'')+'><td>'+name+'</td><td>'+money(x.rev)+'</td><td>'+x.n+'</td><td>'+x.nRev+'</td><td>'+money(at)+'</td><td>'+money(aj)+'</td><td>'+tg+'</td></tr>';}

 var fp={rev:0,n:0,nRev:0},hv={rev:0,n:0,nRev:0},fpN=0,hvN=0;
 bus.forEach(function(b){var x=s.byBU[b];var isFP=/^FIRE|^Fireplace/i.test(b);var o=isFP?fp:hv;o.rev+=x.rev;o.n+=x.n;o.nRev+=x.nRev;if(isFP)fpN+=(lpBU[b]||0);else hvN+=(lpBU[b]||0);});
 tb.innerHTML+=burow('Fireplace — all service',fp,true,fpN)+burow('HVAC — all service',hv,true,hvN);
 bus.forEach(function(b){tb.innerHTML+=burow(b,s.byBU[b],false,lpBU[b]||0);});
 tb.innerHTML+=burow('TOTAL',{rev:rev,n:jobs,nRev:jrev},true,lp.numer);
 // tech visuals
 techBars('v_rev',mapObj(s.byTech,function(v){return v.rev;}),money,true);
 techBars('v_tgls',mapObj(t.byTech,function(v){return v.sales;}),money,true);

 techBars('v_tglp',tp,function(x){return x.toFixed(1)+'%';},true);
 var av={};Object.keys(s.byTech).forEach(function(tk){var x=s.byTech[tk];if(x.nRev>=3)av[tk]=x.rev/x.nRev;});techBars('v_avg',av,money,true);
}
function mapObj(o,f){var r={};Object.keys(o).forEach(function(k){r[k]=f(o[k]);});return r;}
function techBars(id,obj,fmt,desc){
 var arr=Object.keys(obj).map(function(k){return [k,obj[k]];}).filter(function(x){return x[1]>0;});
 arr.sort(function(a,b){return b[1]-a[1];});arr=arr.slice(0,12);
 var max=arr.length?arr[0][1]:1;
 var html=arr.map(function(x){var w=Math.max(2,x[1]/max*120);
   return '<tr><td style="width:34%">'+esc(x[0])+'</td><td style="text-align:right;width:22%">'+fmt(x[1])+'</td><td><span class="bar" style="width:'+w+'px"></span></td></tr>';}).join('');
 document.getElementById(id).innerHTML=html||'<tr><td class="muted" style="padding:10px 12px">No data this period.</td></tr>';
}
function esc(s){return (''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
