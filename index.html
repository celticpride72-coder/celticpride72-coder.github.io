<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comfort by Design — Dashboards</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --edge:#232a34; --ink:#e7edf5; --dim:#93a1b3;
    --accent:#4c8dff; --accent2:#2bd4a7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:16px;padding:12px 18px;background:linear-gradient(180deg,#171d26,#12161d);border-bottom:1px solid var(--edge);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;font-size:16px;white-space:nowrap}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  .brand small{display:block;font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.3px}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .tab{appearance:none;border:1px solid var(--edge);background:var(--panel);color:var(--dim);
       padding:9px 15px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14.5px;transition:.12s}
  .tab:hover{color:var(--ink);border-color:#31414f}
  .tab.active{color:#fff;background:var(--accent);border-color:var(--accent);box-shadow:0 3px 12px rgba(76,141,255,.35)}
  .tab .ico{margin-right:7px}
  .wrap{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;pointer-events:none;opacity:0;transition:.2s}
  .loading.show{opacity:1}
  footer{padding:7px 18px;font-size:11.5px;color:var(--dim);background:#0b0e13;border-top:1px solid var(--edge);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  footer b{color:#c3cedb;font-weight:600}
  @media(max-width:640px){nav{margin-left:0;width:100%}.tab{flex:1;text-align:center}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><div>Comfort by Design<small>Business Dashboards</small></div></div>
  <nav id="nav"></nav>
</header>

<div class="wrap">
  <div class="loading" id="loading">Loading dashboard…</div>
  <iframe id="frame" title="dashboard" src="revenue_dashboard.html"></iframe>
</div>

<footer>
  <span><b>Live view</b> — each tab loads the current dashboard file; refreshed automatically by the daily updates.</span>
  <span id="stamp"></span>
</footer>

<script>
  const TABS = [
    {id:"revenue",  label:"Revenue",       ico:"📈", file:"revenue_dashboard.html"},
    {id:"sales",    label:"Sales",         ico:"💰", file:"sales_dashboard.html"},
    {id:"booked",   label:"Booked Jobs",   ico:"📋", file:"booked_jobs_dashboard.html"},
    {id:"fourdx",   label:"4DX Scoreboard",ico:"🎯", file:"4dx_dashboard_2026.html"},
    {id:"lastmonth",label:"Last Month",    ico:"🗓️", file:"last_month_dashboard.html"},
    {id:"grossprofit",label:"Gross Profit",ico:"💰", file:"gp_dashboard.html"},
    {id:"service",    label:"Service",      ico:"🛠️", file:"service_dashboard.html"},
    {id:"svcmeeting", label:"Tech Meeting",  ico:"🧑‍🔧", file:"service_tech_meeting.html"},
    {id:"schedinstalls", label:"Sched. Installs", ico:"🗓️", file:"scheduled_installs.html"}
  ];
  const nav = document.getElementById("nav");
  const frame = document.getElementById("frame");
  const loading = document.getElementById("loading");

  // Roomier layout: bigger cards, bigger font, wider container.
  // Injected into each dashboard on load (same-origin) so it survives daily rebuilds.
  const BOOST_BASE = `
    .wrap{max-width:min(1560px,96vw)!important}
    body{font-size:16px!important}
    .card,.kpi,.mcard,.bucard{padding:20px 22px!important}
    table{font-size:15px!important}
    h1{font-size:1.5em!important}
  `;
  const BOOST = {
    revenue:    `.card .val{font-size:33px!important}`,
    sales:      `.card .val{font-size:33px!important}`,
    booked:     `.kpi .val{font-size:46px!important}.downame{font-size:27px!important}`,
    fourdx:     `.card{padding:22px 24px!important}`,
    lastmonth:  `.mcard .big{font-size:40px!important}`,
    grossprofit:`.kpi .val{font-size:27px!important}.bucard .p{font-size:24px!important}`,
    service:    `.kpi .val{font-size:29px!important}`,
    svcmeeting: `.kpi .val{font-size:24px!important}.mv{font-size:27px!important}`,
    schedinstalls:`.kpi .val{font-size:30px!important}.job .cust,.job .amt{font-size:17px!important}`
  };
  let currentId = null;
  function injectBoost(){
    try{
      const d = frame.contentDocument; if(!d || !d.head) return;
      let st = d.getElementById("cbd-roomier");
      if(!st){ st = d.createElement("style"); st.id="cbd-roomier"; d.head.appendChild(st); }
      st.textContent = BOOST_BASE + (BOOST[currentId]||"");
    }catch(e){}
  }

  function pick(t, btn){
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    loading.classList.add("show");
    currentId = t.id;
    frame.src = t.file;
    try{ localStorage.setItem("cbd_tab", t.id); }catch(e){}
  }
  frame.addEventListener("load", ()=>{ loading.classList.remove("show"); injectBoost(); });

  let start = "revenue";
  try{ const s=localStorage.getItem("cbd_tab"); if(s && TABS.some(t=>t.id===s)) start=s; }catch(e){}
  currentId = start;

  TABS.forEach(t=>{
    const b=document.createElement("button");
    b.className="tab"+(t.id===start?" active":"");
    b.innerHTML=`<span class="ico">${t.ico}</span>${t.label}`;
    b.onclick=()=>pick(t,b);
    nav.appendChild(b);
    if(t.id===start) frame.src=t.file;
  });

  document.getElementById("stamp").textContent =
    "Opened " + new Date().toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
</script>
</body>
</html>
