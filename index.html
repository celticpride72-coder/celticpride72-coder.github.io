<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comfort by Design — Dashboards</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#12161d;--edge:#232a34;--ink:#e7edf5;--dim:#93a1b3;--muted:#7c8a9c;--accent:#4c8dff;--accent2:#2bd4a7}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;height:100vh;overflow:hidden}
  /* sidebar */
  .side{width:246px;flex:0 0 246px;background:linear-gradient(180deg,#12161d,#0f131a);border-right:1px solid var(--edge);display:flex;flex-direction:column;height:100%}
  .brand{display:flex;align-items:center;gap:9px;padding:14px 16px 10px;font-weight:750;letter-spacing:.2px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2)}
  .brand small{display:block;font-weight:500;color:var(--dim);font-size:11px}
  .search{margin:2px 12px 8px}
  .search input{width:100%;background:var(--panel);border:1px solid var(--edge);color:var(--ink);border-radius:9px;padding:8px 11px;font-size:13px}
  .search input::placeholder{color:var(--muted)}
  .nav{flex:1;overflow-y:auto;padding:2px 8px 18px}
  .grp{margin:2px 0}
  .ghead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--dim);font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:9px 8px 5px;cursor:pointer}
  .ghead .car{margin-left:auto;transition:transform .15s;color:var(--muted);font-size:10px}
  .grp.collapsed .car{transform:rotate(-90deg)}
  .grp.collapsed .items{display:none}
  .gico{font-size:13px}
  .items{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
  .item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:13.5px;font-weight:600;border:1px solid transparent;text-align:left;background:none;width:100%}
  .item:hover{background:var(--panel);color:var(--ink)}
  .item .ii{width:18px;text-align:center;flex:0 0 18px}
  .item.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 10px rgba(76,141,255,.3)}
  .empty{color:var(--muted);font-size:12px;padding:10px}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
  .top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,#171d26,#12161d);border-bottom:1px solid var(--edge)}
  .burger{display:none;background:var(--panel);border:1px solid var(--edge);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:16px;cursor:pointer}
  .crumb{font-weight:700;font-size:15px}.crumb .g{color:var(--muted);font-weight:600}
  .stamp{margin-left:auto;color:var(--muted);font-size:11.5px}
  .frameWrap{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .scrim{display:none}
  @media(max-width:760px){
    .side{position:fixed;z-index:30;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s}
    body.open .side{transform:translateX(0)}
    .burger{display:inline-block}
    body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
  }
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><span class="dot"></span><div>Comfort by Design<small>Business Dashboards</small></div></div>
    <div class="search"><input id="q" placeholder="Jump to a dashboard…" autocomplete="off"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="top">
      <button class="burger" id="burger">☰</button>
      <div class="crumb" id="crumb"></div>
      <span class="stamp" id="stamp"></span>
    </div>
    <div class="frameWrap"><iframe id="frame" title="dashboard"></iframe></div>
  </div>

<script>
  const TABS = [
    {id:"revenue",  label:"Revenue",       ico:"📈", file:"revenue_dashboard.html"},
    {id:"sales",    label:"Sales",         ico:"💰", file:"sales_dashboard.html"},
    {id:"booked",   label:"Booked Jobs",   ico:"📋", file:"booked_jobs_dashboard.html"},
    {id:"statefair", label:"State Fair 2026", ico:"🎡", file:"state_fair_2026_jobs.html"},
    {id:"fourdx",   label:"4DX Scoreboard",ico:"🎯", file:"4dx_dashboard_2026.html"},
    {id:"lastmonth",label:"Last Month",    ico:"🗓️", file:"last_month_dashboard.html"},
    {id:"ytd", label:"YTD Dashboard", ico:"📊", file:"ytd_dashboard.html"},
    {id:"grossprofit",label:"GP Service Titan",ico:"💰", file:"gp_dashboard.html"},
    {id:"service",    label:"Service",      ico:"🛠️", file:"service_dashboard.html"},
    {id:"svcmeeting", label:"Tech Meeting",  ico:"🧑‍🔧", file:"service_tech_meeting.html"},
    {id:"ccmeeting", label:"Call Center Mtg", ico:"📞", file:"call_center_meeting.html"},
    {id:"schedinstalls", label:"Sched. Installs", ico:"🗓️", file:"scheduled_installs.html"},
    {id:"adherence", label:"Adherence", ico:"⏱️", file:"install_adherence.html"},
    {id:"flash", label:"Flash", ico:"⚡", file:"company_flash.html"},
    {id:"revsales", label:"Rev vs Sales", ico:"📊", file:"revenue_vs_sales.html"},
    {id:"gpfin", label:"GP Financials", ico:"📒", file:"gross_profit_financials.html"},
    {id:"gprecon", label:"GP Reconciliation", ico:"⚖️", file:"gp_reconciliation.html"},
    {id:"gpproj", label:"GP Projection", ico:"🔮", file:"gp_projection.html"},
    {id:"techscore", label:"Tech Scorecard", ico:"🧰", file:"tech_scorecard.html"},
    {id:"salesrep", label:"Sales Reps", ico:"💵", file:"sales_scorecard.html"},
    {id:"callbacks", label:"Callbacks", ico:"🔁", file:"callbacks_dashboard.html"},
    {id:"timetoinstall", label:"Time to Install", ico:"⏳", file:"time_to_install.html"},
    {id:"instnoproj", label:"Install Jobs No Project", ico:"🚩", file:"install_jobs_no_project.html"},
    {id:"instmeeting", label:"Install Meeting", ico:"🧱", file:"install_meeting.html"},
    {id:"instrev", label:"Install Revenue", ico:"🏗️", file:"install_revenue_dashboard.html"}
  ];
  const TMAP={}; TABS.forEach(t=>TMAP[t.id]=t);
  const GROUPS=[
    {name:"Revenue",      ico:"📈", ids:["revenue","revsales"]},
    {name:"Sales",        ico:"💰", ids:["sales","booked","statefair"]},
    {name:"4DX",          ico:"🎯", ids:["fourdx"]},
    {name:"Gross Profit", ico:"💵", ids:["grossprofit","gpfin","gprecon","gpproj"]},
    {name:"Overview",     ico:"⚡", ids:["flash","lastmonth","ytd"]},
    {name:"Service",      ico:"🛠️", ids:["service","callbacks"]},
    {name:"Install",      ico:"🧱", ids:["schedinstalls","adherence","timetoinstall","instnoproj","instrev"]},
    {name:"People",       ico:"👤", ids:["techscore","salesrep"]},
    {name:"Meetings",     ico:"🗓️", ids:["svcmeeting","ccmeeting","instmeeting"]}
  ];

  // ---- per-dashboard styling injected into each iframe (same as the live hub) ----
  const BOOST_BASE = `
    .wrap{max-width:min(1560px,96vw)!important}
    body{font-size:16px!important}
    .card,.kpi,.mcard,.bucard{padding:20px 22px!important}
    table{font-size:15px!important}
    h1{font-size:1.5em!important}
  `;
  const BOOST = {
    revenue:`.card .val{font-size:33px!important}`, sales:`.card .val{font-size:33px!important}`,
    booked:`.kpi .val{font-size:46px!important}.downame{font-size:27px!important}`, fourdx:`.card{padding:22px 24px!important}`,
    lastmonth:`.mcard .big{font-size:40px!important}`, grossprofit:`.kpi .val{font-size:27px!important}.bucard .p{font-size:24px!important}`,
    service:`.kpi .val{font-size:29px!important}`, svcmeeting:`.kpi .val{font-size:24px!important}.mv{font-size:27px!important}`,
    ccmeeting:`.mv{font-size:24px!important}`, schedinstalls:`.kpi .val{font-size:30px!important}.job .cust,.job .amt{font-size:17px!important}`,
    adherence:`.kpi .val{font-size:30px!important}`, flash:`.tile .val{font-size:36px!important}`,
    revsales:`.kpi .val{font-size:26px!important}`, gpfin:`.kpi .val{font-size:26px!important}`, gprecon:`.kpi .val{font-size:25px!important}`, gpproj:`.kpi .val{font-size:27px!important}`,
    techscore:`.kpi .val{font-size:26px!important}`, salesrep:`.kpi .val{font-size:26px!important}`,
    callbacks:`.kpi .val{font-size:30px!important}`, timetoinstall:`.kpi .val{font-size:26px!important}`, instnoproj:`.kpi .val{font-size:30px!important}`
  };
  let currentId=null;
  const frame=document.getElementById("frame");
  function injectBoost(){
    try{const d=frame.contentDocument;if(!d||!d.head)return;let st=d.getElementById("cbd-roomier");
      if(!st){st=d.createElement("style");st.id="cbd-roomier";d.head.appendChild(st);}
      st.textContent=BOOST_BASE+(BOOST[currentId]||"");}catch(e){}
  }
  frame.addEventListener("load",injectBoost);

  // ---- build sidebar ----
  const nav=document.getElementById("nav");
  let collapsed={}; try{collapsed=JSON.parse(localStorage.getItem("cbd_collapsed")||"{}");}catch(e){}
  function groupOf(id){return GROUPS.find(g=>g.ids.includes(id));}
  let start="revenue"; try{const s=localStorage.getItem("cbd_tab"); if(s&&TMAP[s]) start=s;}catch(e){}

  GROUPS.forEach(g=>{
    const grp=document.createElement("div"); grp.className="grp"+(collapsed[g.name]?" collapsed":""); grp.dataset.g=g.name;
    const head=document.createElement("button"); head.className="ghead";
    head.innerHTML=`<span class="gico">${g.ico}</span>${g.name}<span class="car">▾</span>`;
    head.onclick=()=>{grp.classList.toggle("collapsed");collapsed[g.name]=grp.classList.contains("collapsed");try{localStorage.setItem("cbd_collapsed",JSON.stringify(collapsed));}catch(e){}};
    grp.appendChild(head);
    const items=document.createElement("div"); items.className="items";
    g.ids.forEach(id=>{const t=TMAP[id]; if(!t)return;
      const b=document.createElement("button"); b.className="item"; b.dataset.id=id; b.dataset.search=(g.name+" "+t.label).toLowerCase();
      b.innerHTML=`<span class="ii">${t.ico}</span><span class="lbl">${t.label}</span>`;
      b.onclick=()=>pick(id); items.appendChild(b);});
    grp.appendChild(items); nav.appendChild(grp);
  });

  function pick(id){
    const t=TMAP[id]; if(!t)return; currentId=id;
    document.querySelectorAll(".item").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
    frame.src=t.file+(t.file.includes("?")?"&":"?")+"v="+Date.now();
    const g=groupOf(id);
    document.getElementById("crumb").innerHTML=(g?`<span class="g">${g.name} · </span>`:"")+t.label;
    try{localStorage.setItem("cbd_tab",id);}catch(e){}
    document.body.classList.remove("open");
  }

  // ---- search filter ----
  const q=document.getElementById("q");
  q.addEventListener("input",()=>{
    const v=q.value.trim().toLowerCase();
    GROUPS.forEach(g=>{
      const grp=nav.querySelector('.grp[data-g="'+CSS.escape(g.name)+'"]');
      let any=false;
      grp.querySelectorAll(".item").forEach(b=>{const m=!v||b.dataset.search.includes(v);b.style.display=m?"":"none";if(m)any=true;});
      grp.style.display=any?"":"none";
      if(v) grp.classList.remove("collapsed"); else grp.classList.toggle("collapsed",!!collapsed[g.name]);
    });
  });

  // mobile
  document.getElementById("burger").onclick=()=>document.body.classList.toggle("open");
  document.getElementById("scrim").onclick=()=>document.body.classList.remove("open");
  document.getElementById("stamp").textContent="Opened "+new Date().toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

  // start: ensure its group is expanded
  const sg=groupOf(start); if(sg){collapsed[sg.name]=false; nav.querySelector('.grp[data-g="'+CSS.escape(sg.name)+'"]').classList.remove("collapsed");}
  pick(start);
</script>
</body>
</html>
