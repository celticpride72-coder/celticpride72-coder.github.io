<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booked Jobs Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --accent:#f37021;
    --accent-dark:#d35a10;
    --accent-light:#fde3cf;
    --green:#1e9e5a;
    --green-bg:#e6f7ee;
    --amber:#b8860b;
    --amber-bg:#fff6df;
    --red:#d64545;
    --red-bg:#fdeaea;
    --ink:#20242b;
    --sub:#6b7280;
    --line:#e7e5e2;
    --card:#ffffff;
    --bg:#f7f5f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:32px; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:1240px; margin:0 auto;}
  h1{font-size:22px; margin:0 0 4px 0; letter-spacing:-0.01em;}
  .sub-title{color:var(--sub); font-size:13px; margin-bottom:24px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:20px 22px; box-shadow:0 1px 2px rgba(20,20,20,0.03);
  }
  .grid-2{display:grid; grid-template-columns: 1.05fr 1.4fr; gap:20px; margin-bottom:20px;}
  .grid-4{display:grid; grid-template-columns: repeat(4,1fr); gap:16px; margin-bottom:20px;}
  .grid-panels{display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;}
  .section-label{
    font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--sub); margin-bottom:14px;
  }
  /* HERO */
  .hero{display:flex; flex-direction:column; justify-content:center;}
  .hero-weekday{font-size:14px; color:var(--sub); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
  .hero-number{font-size:64px; font-weight:800; line-height:1.05; margin:6px 0 2px 0;}
  .hero-date{font-size:13px; color:var(--sub); margin-bottom:16px;}
  .chips{display:flex; gap:10px; flex-wrap:wrap;}
  .chip{
    padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip .lbl{font-weight:500; opacity:0.75; font-size:11px;}
  .g-green{background:var(--green-bg); color:var(--green);}
  .g-amber{background:var(--amber-bg); color:var(--amber);}
  .g-red{background:var(--red-bg); color:var(--red);}
  .g-neutral{background:#eef0f3; color:var(--sub);}
  /* SPARK */
  .spark-wrap{display:flex; flex-direction:column;}
  .spark-svg-holder{flex:1; display:flex; align-items:flex-end;}
  /* KPI cards */
  .kpi-card{display:flex; flex-direction:column; gap:8px;}
  .kpi-title{font-size:12px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:0.05em;}
  .kpi-value{font-size:30px; font-weight:800;}
  .kpi-row{display:flex; gap:8px; flex-wrap:wrap;}
  .kpi-sub{font-size:11px; color:var(--sub);}
  /* rolling */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--sub); font-weight:700; padding:6px 8px; border-bottom:1px solid var(--line);}
  td{padding:9px 8px; border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .pill{padding:3px 9px; border-radius:999px; font-weight:700; font-size:12px; display:inline-block;}
  /* attainment bars */
  .attain-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .attain-label{width:44px; font-size:12px; font-weight:700; color:var(--sub);}
  .attain-track{flex:1; height:20px; background:#eef0f3; border-radius:6px; position:relative; overflow:visible;}
  .attain-fill{height:100%; border-radius:6px;}
  .attain-goal-marker{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink);}
  .attain-pct{width:56px; text-align:right; font-size:12px; font-weight:700;}
  /* monthly chart */
  .month-chart{width:100%; overflow-x:auto;}
  /* week strip */
  .week-strip{display:flex; gap:10px;}
  .week-day{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .week-day-label{font-size:11px; color:var(--sub); font-weight:600;}
  .week-bar-track{width:100%; height:70px; background:#eef0f3; border-radius:6px; display:flex; align-items:flex-end; overflow:hidden;}
  .week-bar-fill{width:100%; border-radius:0 0 0 0;}
  .week-count{font-size:13px; font-weight:700;}
  footer{margin-top:26px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--sub); line-height:1.6;}
  .legend{display:flex; gap:16px; align-items:center; font-size:11px; color:var(--sub); margin-top:8px;}
  .legend-swatch{width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:5px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Booked Jobs Dashboard</h1>
  <div class="sub-title" id="genSub">Comfort By Design &middot; Booking PBI 4DX (count of jobs by Created Date)</div>

  <!-- YESTERDAY HERO -->
  <div class="grid-2">
    <div class="card hero" id="heroLeft"></div>
    <div class="card spark-wrap">
      <div class="section-label">Last 14 Days</div>
      <div class="spark-svg-holder" id="sparkHolder"></div>
    </div>
  </div>

  <!-- KPI CARDS -->
  <div class="grid-4" id="kpiCards"></div>

  <!-- ROLLING + ATTAINMENT -->
  <div class="grid-panels">
    <div class="card">
      <div class="section-label">Rolling Windows</div>
      <table id="rollingTable"></table>
    </div>
    <div class="card">
      <div class="section-label">Attainment to Date</div>
      <div id="attainPanel"></div>
    </div>
  </div>

  <!-- MONTHLY TREND -->
  <div class="card" style="margin-bottom:20px;">
    <div class="section-label">Monthly Booked Jobs</div>
    <div class="month-chart" id="monthChart"></div>
    <div class="legend" id="monthLegend"></div>
  </div>

  <!-- WEEK STRIP -->
  <div class="card" style="margin-bottom:20px;">
    <div class="section-label">This Week (Monday start)</div>
    <div class="week-strip" id="weekStrip"></div>
  </div>

  <footer id="footerNote"></footer>
</div>

<script>
const DATA = {
  "dataAsOf": "2026-08-17",
  "today": "2026-08-18",
  "yesterday": {"date":"2026-08-17","weekday":"Monday","actual":32,"goal":41.78095238095238,"lastYear":59,"lastYearDate":"2025-08-18","lastYearWeekday":"Monday"},
  "spark": [
    {"date":"2026-08-04","count":62,"goal":41.78095238095238,"weekday":2},
    {"date":"2026-08-05","count":46,"goal":41.78095238095238,"weekday":3},
    {"date":"2026-08-06","count":36,"goal":41.78095238095238,"weekday":4},
    {"date":"2026-08-07","count":48,"goal":41.78095238095238,"weekday":5},
    {"date":"2026-08-08","count":1,"goal":null,"weekday":6},
    {"date":"2026-08-09","count":1,"goal":null,"weekday":0},
    {"date":"2026-08-10","count":46,"goal":41.78095238095238,"weekday":1},
    {"date":"2026-08-11","count":37,"goal":41.78095238095238,"weekday":2},
    {"date":"2026-08-12","count":34,"goal":41.78095238095238,"weekday":3},
    {"date":"2026-08-13","count":35,"goal":41.78095238095238,"weekday":4},
    {"date":"2026-08-14","count":15,"goal":41.78095238095238,"weekday":5},
    {"date":"2026-08-15","count":8,"goal":null,"weekday":6},
    {"date":"2026-08-16","count":4,"goal":null,"weekday":0},
    {"date":"2026-08-17","count":32,"goal":41.78095238095238,"weekday":1}
  ],
  "periods": {
    "WTD": {"label":"WTD","start":"2026-08-17","actual":32,"goal":41.78095238095238,"lastYear":89},
    "MTD": {"label":"MTD","start":"2026-08-01","actual":455,"goal":459.5904761904762,"lastYear":433},
    "QTD": {"label":"QTD","start":"2026-07-01","actual":1349,"goal":1316.5145670995666,"lastYear":1318},
    "YTD": {"label":"YTD","start":"2026-01-01","actual":6545,"goal":6294.834567099572,"lastYear":6072}
  },
  "rolling": [
    {"N":30,"start":"2026-07-19","end":"2026-08-17","actual":825,"goal":867.6495670995671,"lastYear":888},
    {"N":60,"start":"2026-06-19","end":"2026-08-17","actual":1672,"goal":1642.9618398268394,"lastYear":1740},
    {"N":90,"start":"2026-05-20","end":"2026-08-17","actual":2623,"goal":2504.482067099568,"lastYear":2445},
    {"N":180,"start":"2026-02-19","end":"2026-08-17","actual":4951,"goal":4808.754567099566,"lastYear":4679}
  ],
  "monthly": {"2025-01":918,"2025-02":792,"2025-03":702,"2025-04":720,"2025-05":775,"2025-06":847,"2025-07":885,"2025-08":820,"2025-09":996,"2025-10":1386,"2025-11":1079,"2025-12":1088,"2026-01":1157,"2026-02":675,"2026-03":769,"2026-04":880,"2026-05":820,"2026-06":895,"2026-07":894,"2026-08":455},
  "monthlyGoal": {"2026-01":945.5399999999995,"2026-02":831.6000000000001,"2026-03":737.1,"2026-04":737.1,"2026-05":829.2499999999998,"2026-06":897.7299999999996,"2026-07":856.9240909090905,"2026-08":877.4},
  "weekDaily": [
    {"date":"2026-08-17","count":32,"goal":41.78095238095238,"weekday":1},
    {"date":"2026-08-18","count":0,"goal":41.78095238095238,"weekday":2}
  ],
  "minDate": "2025-01-01",
  "maxDate": "2026-08-17",
  "currentMonth": "2026-08"
};

function fmtInt(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtGoal(n){ return n===null||n===undefined ? '—' : n.toFixed(1); }
function pct(actual, goal){ if(goal===null||goal===undefined||goal===0) return null; return (actual/goal)*100; }
function yoy(actual, ly){ if(ly===0||ly===null||ly===undefined) return null; return ((actual-ly)/ly)*100; }
function attainClass(p){ if(p===null) return 'g-neutral'; if(p>=100) return 'g-green'; if(p>=95) return 'g-amber'; return 'g-red'; }
function attainColor(p){ if(p===null) return '#9aa1ab'; if(p>=100) return '#1e9e5a'; if(p>=95) return '#b8860b'; return '#d64545'; }
function yoyClass(p){ if(p===null) return 'g-neutral'; return p>=0 ? 'g-green' : 'g-red'; }
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDateLong(ds){
  const [y,m,d]=ds.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'});
}

// ===== HERO =====
(function(){
  const y = DATA.yesterday;
  const p = pct(y.actual, y.goal);
  const yy = yoy(y.actual, y.lastYear);
  const numColor = attainColor(p);
  const goalChip = (y.goal===null)
    ? `<span class="chip g-neutral"><span class="lbl">vs Goal</span> no goal set</span>`
    : `<span class="chip ${attainClass(p)}"><span class="lbl">vs Goal</span> ${p.toFixed(1)}% (${fmtGoal(y.goal)})</span>`;
  const lyChip = `<span class="chip ${yoyClass(yy)}"><span class="lbl">vs Last Yr</span> ${yy===null?'—':(yy>=0?'+':'')+yy.toFixed(1)+'%'} (${y.lastYear})</span>`;
  document.getElementById('heroLeft').innerHTML = `
    <div class="hero-weekday">Yesterday &middot; ${y.weekday}</div>
    <div class="hero-number" style="color:${numColor}">${fmtInt(y.actual)}</div>
    <div class="hero-date">${fmtDateLong(y.date)}</div>
    <div class="chips">${goalChip}${lyChip}</div>
  `;
})();

// ===== SPARKLINE =====
(function(){
  const spark = DATA.spark;
  const w = 640, h = 190, padL=28, padR=10, padT=18, padB=28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const maxVal = Math.max(...spark.map(d=>d.count), ...spark.filter(d=>d.goal).map(d=>d.goal)) * 1.15;
  const bw = innerW / spark.length;
  const avgGoal = DATA.yesterday.goal;
  let bars = '';
  spark.forEach((d,i)=>{
    const x = padL + i*bw + bw*0.14;
    const barW = bw*0.72;
    const bh = (d.count/maxVal)*innerH;
    const y0 = padT + innerH - bh;
    const isYesterday = d.date === DATA.yesterday.date;
    const isWeekend = d.weekday===0 || d.weekday===6;
    const fill = isYesterday ? '#f37021' : (isWeekend ? '#d8dbe0' : '#c9cdd4');
    bars += `<rect x="${x}" y="${y0}" width="${barW}" height="${Math.max(bh,1)}" rx="3" fill="${fill}"></rect>`;
    bars += `<text x="${x+barW/2}" y="${y0-5}" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="${isYesterday?'700':'500'}">${d.count}</text>`;
    const [,, dd] = d.date.split('-');
    bars += `<text x="${x+barW/2}" y="${h-10}" font-size="10" text-anchor="middle" fill="#9aa1ab">${dd}</text>`;
  });
  const goalY = padT + innerH - (avgGoal/maxVal)*innerH;
  const dashLine = `<line x1="${padL}" y1="${goalY}" x2="${w-padR}" y2="${goalY}" stroke="#20242b" stroke-width="1.3" stroke-dasharray="4,4"></line>
    <text x="${w-padR}" y="${goalY-5}" font-size="10" text-anchor="end" fill="#20242b">avg daily goal ${avgGoal.toFixed(0)}</text>`;
  const svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">${bars}${dashLine}</svg>`;
  document.getElementById('sparkHolder').innerHTML = svg;
})();

// ===== KPI CARDS =====
(function(){
  const order = ['WTD','MTD','QTD','YTD'];
  let html = '';
  order.forEach(key=>{
    const p = DATA.periods[key];
    const at = pct(p.actual, p.goal);
    const yy = yoy(p.actual, p.lastYear);
    html += `<div class="card kpi-card">
      <div class="kpi-title">${key}</div>
      <div class="kpi-value">${fmtInt(p.actual)}</div>
      <div class="kpi-row">
        <span class="chip ${attainClass(at)}">${at===null?'—':at.toFixed(1)+'%'} <span class="lbl">of goal</span></span>
        <span class="chip ${yoyClass(yy)}">${yy===null?'—':(yy>=0?'+':'')+yy.toFixed(1)+'%'} <span class="lbl">YoY</span></span>
      </div>
      <div class="kpi-sub">Goal ${fmtGoal(p.goal)} &middot; LY ${fmtInt(p.lastYear)} &middot; since ${p.start}</div>
    </div>`;
  });
  document.getElementById('kpiCards').innerHTML = html;
})();

// ===== ROLLING TABLE =====
(function(){
  let rows = `<tr><th>Window</th><th>Jobs</th><th>vs Goal</th><th>vs Last Yr</th></tr>`;
  DATA.rolling.forEach(r=>{
    const at = pct(r.actual, r.goal);
    const yy = yoy(r.actual, r.lastYear);
    rows += `<tr>
      <td><strong>Last ${r.N}</strong><br><span style="color:var(--sub); font-size:11px;">${r.start} &rarr; ${r.end}</span></td>
      <td style="font-weight:700;">${fmtInt(r.actual)}</td>
      <td><span class="pill" style="background:${attainClass(at)==='g-green'?'var(--green-bg)':attainClass(at)==='g-amber'?'var(--amber-bg)':'var(--red-bg)'}; color:${attainColor(at)};">${at===null?'—':at.toFixed(1)+'%'}</span></td>
      <td><span class="pill" style="background:${yy>=0?'var(--green-bg)':'var(--red-bg)'}; color:${yy>=0?'var(--green)':'var(--red)'};">${yy===null?'—':(yy>=0?'+':'')+yy.toFixed(1)+'%'}</span></td>
    </tr>`;
  });
  document.getElementById('rollingTable').innerHTML = rows;
})();

// ===== ATTAINMENT PANEL =====
(function(){
  const order = ['WTD','MTD','QTD','YTD'];
  let html = '';
  order.forEach(key=>{
    const p = DATA.periods[key];
    const at = pct(p.actual, p.goal);
    const maxScale = Math.max(p.actual, p.goal||0) * 1.15;
    const fillPct = Math.min((p.actual/maxScale)*100, 100);
    const goalPct = p.goal ? Math.min((p.goal/maxScale)*100, 100) : null;
    html += `<div class="attain-row">
      <div class="attain-label">${key}</div>
      <div class="attain-track">
        <div class="attain-fill" style="width:${fillPct}%; background:${attainColor(at)};"></div>
        ${goalPct!==null ? `<div class="attain-goal-marker" style="left:${goalPct}%;"></div>` : ''}
      </div>
      <div class="attain-pct" style="color:${attainColor(at)};">${at===null?'—':at.toFixed(0)+'%'}</div>
    </div>`;
  });
  html += `<div class="legend"><span><span class="legend-swatch" style="background:#20242b;"></span>Goal marker</span></div>`;
  document.getElementById('attainPanel').innerHTML = html;
})();

// ===== MONTHLY TREND =====
(function(){
  const months = Object.keys(DATA.monthly).sort();
  const maxVal = Math.max(...months.map(m=>DATA.monthly[m])) * 1.15;
  const barW = 34, gap = 12, padL=36, padR=16, padT=16, padB=34;
  const w = padL + padR + months.length*(barW+gap);
  const h = 220;
  const innerH = h - padT - padB;
  let bars = '';
  months.forEach((m,i)=>{
    const val = DATA.monthly[m];
    const year = m.slice(0,4);
    const isCurrent = m === DATA.currentMonth;
    const color = year==='2025' ? '#d8b48c' : '#f37021';
    const x = padL + i*(barW+gap);
    const bh = (val/maxVal)*innerH;
    const y0 = padT + innerH - bh;
    let fillAttr = `fill="${color}"`;
    let hatchId = '';
    if(isCurrent){
      hatchId = `hatch${i}`;
      bars += `<defs><pattern id="${hatchId}" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${color}"></rect><line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="2.5"></line></pattern></defs>`;
      fillAttr = `fill="url(#${hatchId})"`;
    }
    bars += `<rect x="${x}" y="${y0}" width="${barW}" height="${Math.max(bh,1)}" rx="4" ${fillAttr}></rect>`;
    bars += `<text x="${x+barW/2}" y="${y0-6}" font-size="10.5" text-anchor="middle" fill="#6b7280" font-weight="600">${val}</text>`;
    const label = m.slice(5,7)+"/"+m.slice(2,4);
    bars += `<text x="${x+barW/2}" y="${h-14}" font-size="10.5" text-anchor="middle" fill="#9aa1ab">${label}</text>`;
    const g = DATA.monthlyGoal[m];
    if(g !== undefined){
      const gy = padT + innerH - (g/maxVal)*innerH;
      bars += `<line x1="${x-2}" y1="${gy}" x2="${x+barW+2}" y2="${gy}" stroke="#20242b" stroke-width="1.6" stroke-dasharray="3,3"></line>`;
    }
  });
  const svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
  document.getElementById('monthChart').innerHTML = svg;
  document.getElementById('monthLegend').innerHTML = `
    <span><span class="legend-swatch" style="background:#d8b48c;"></span>2025</span>
    <span><span class="legend-swatch" style="background:#f37021;"></span>2026</span>
    <span><span class="legend-swatch" style="background:repeating-linear-gradient(45deg,#f37021,#f37021 2px,#fff 2px,#fff 4px);"></span>Current month (partial)</span>
    <span>&#8210;&#8210; 2026 Booked Jobs Goal</span>
  `;
})();

// ===== WEEK STRIP =====
(function(){
  const maxVal = Math.max(...DATA.weekDaily.map(d=>d.count), ...DATA.weekDaily.filter(d=>d.goal).map(d=>d.goal)) * 1.2 || 1;
  let html = '';
  DATA.weekDaily.forEach(d=>{
    const hPct = Math.max((d.count/maxVal)*100, d.count>0?4:0);
    const isYesterday = d.date === DATA.yesterday.date;
    const color = isYesterday ? '#f37021' : '#c9cdd4';
    html += `<div class="week-day">
      <div class="week-count">${d.count}</div>
      <div class="week-bar-track"><div class="week-bar-fill" style="height:${hPct}%; background:${color};"></div></div>
      <div class="week-day-label">${WD[d.weekday]}</div>
    </div>`;
  });
  document.getElementById('weekStrip').innerHTML = html;
})();

// ===== FOOTER =====
(function(){
  document.getElementById('footerNote').innerHTML = `
    Source: <strong>Booking PBI 4DX.xlsx</strong> (Sheet1) &mdash; metric is a COUNT of rows grouped by <strong>Created Date</strong>, every row with a Created Date counted.
    Goal: <strong>CBD 2026 Revenue Budget.xlsx</strong> &rarr; Daily Goals &rarr; <strong>Booked Jobs Goal</strong> column.<br>
    <strong>Yesterday</strong> = the prior calendar day (${DATA.yesterday.date}). Last-Year comparison uses a 364-day shift so the weekday matches (${DATA.yesterday.lastYearDate}, ${DATA.yesterday.lastYearWeekday}).<br>
    The Booked Jobs Goal column is populated on business days only (Jan 2 &ndash; Aug 31, 2026); weekends, holidays, and unbudgeted months show no goal marker rather than a zero goal.<br>
    Data as of ${DATA.dataAsOf}. Weeks start Monday. Generated ${new Date().toLocaleString('en-US',{dateStyle:'medium', timeStyle:'short'})}.
  `;
})();
</script>
</body>
</html>
