<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booked Jobs Dashboard — Comfort by Design</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b23; --panel2:#1c2230; --border:#252d3d;
  --text:#e8ecf3; --muted:#8b94a7; --accent:#f97316; --accent-soft:#f9731633;
  --green:#22c55e; --amber:#f5b342; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding:24px;max-width:1200px;margin:0 auto}
h1{font-size:22px;font-weight:700;letter-spacing:.3px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:18px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:14px}
/* hero */
.hero{display:flex;gap:24px;flex-wrap:wrap;align-items:stretch;border-left:4px solid var(--accent)}
.hero-left{flex:0 0 260px;display:flex;flex-direction:column;justify-content:center}
.hero-wd{font-size:15px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1.5px}
.hero-num{font-size:64px;font-weight:800;line-height:1.05;margin:4px 0}
.hero-date{color:var(--muted);font-size:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--border);background:var(--panel2)}
.chip small{font-weight:400;color:var(--muted)}
.hero-right{flex:1 1 480px;min-width:340px}
.green{color:var(--green)} .amber{color:var(--amber)} .red{color:var(--red)}
/* KPI cards */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.card .lbl{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.card .val{font-size:34px;font-weight:800;margin:6px 0 8px}
.card .row{display:flex;justify-content:space-between;font-size:12.5px;margin-top:4px}
.card .row .k{color:var(--muted)}
/* attainment bars */
.abar{margin-bottom:14px}
.abar .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.abar .track{position:relative;height:16px;background:var(--panel2);border-radius:8px;overflow:visible}
.abar .fill{position:absolute;top:0;left:0;height:100%;border-radius:8px}
.abar .marker{position:absolute;top:-4px;width:2px;height:24px;background:var(--text);opacity:.85}
.abar .marker::after{content:"Goal";position:absolute;top:-14px;left:-12px;font-size:9px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:'Segoe UI',system-ui,sans-serif}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.wk .d{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.wk .d.today{border-color:var(--accent)}
.wk .d .dn{font-size:11px;color:var(--muted);text-transform:uppercase}
.wk .d .dc{font-size:24px;font-weight:800;margin:2px 0}
.wk .d .dg{font-size:11px;color:var(--muted)}
footer{color:var(--muted);font-size:11.5px;line-height:1.7;margin-top:8px;border-top:1px solid var(--border);padding-top:14px}
</style>
</head>
<body>
<h1>BOOKED JOBS <span>DASHBOARD</span></h1>
<div class="sub" id="sub"></div>

<div class="panel hero" id="hero"></div>

<div class="grid4" id="kpis" style="margin-bottom:18px"></div>

<div class="panel"><h2>Rolling Windows (anchored to last data date)</h2><div class="grid4" id="rolling"></div></div>

<div class="panel"><h2>Attainment to Date</h2><div id="attain"></div>
<div class="legend"><span><i style="background:var(--green)"></i>&ge;100% of goal</span><span><i style="background:var(--amber)"></i>95&ndash;99.9%</span><span><i style="background:var(--red)"></i>&lt;95%</span></div></div>

<div class="panel"><h2>Monthly Booked Jobs by Year</h2><div id="monthly"></div>
<div class="legend"><span><i style="background:#5b8dd9"></i>2025</span><span><i style="background:var(--accent)"></i>2026</span><span><i style="background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 2px,transparent 2px,transparent 4px)"></i>Current month (partial)</span><span>&#9482; dashed tick = 2026 Booked Jobs Goal</span></div></div>

<div class="panel"><h2 id="wkTitle">This Week (Mon-start)</h2><div class="wk" id="week"></div></div>

<footer id="foot"></footer>

<script>
const DATA = {
  today:"2026-09-02", dataAsOf:"2026-09-01",
  yesterday:{date:"2026-09-01",weekday:"Tuesday",actual:57,goal:48.85,lastYear:56,awaiting:false,lyDate:"2025-09-02"},
  spark:[
    {date:"2026-08-19",dow:3,count:38,goal:41.78},{date:"2026-08-20",dow:4,count:19,goal:41.78},
    {date:"2026-08-21",dow:5,count:37,goal:41.78},{date:"2026-08-22",dow:6,count:2,goal:null},
    {date:"2026-08-23",dow:0,count:2,goal:null},{date:"2026-08-24",dow:1,count:35,goal:41.78},
    {date:"2026-08-25",dow:2,count:41,goal:41.78},{date:"2026-08-26",dow:3,count:25,goal:41.78},
    {date:"2026-08-27",dow:4,count:45,goal:41.78},{date:"2026-08-28",dow:5,count:32,goal:41.78},
    {date:"2026-08-29",dow:6,count:9,goal:null},{date:"2026-08-30",dow:0,count:7,goal:null},
    {date:"2026-08-31",dow:1,count:61,goal:41.78},{date:"2026-09-01",dow:2,count:57,goal:48.85}],
  sparkAvgGoal:42.49,
  periods:{
    WTD:{actual:118,goal:90.63,lastYear:58,start:"2026-08-31"},
    MTD:{actual:57,goal:48.85,lastYear:2,start:"2026-09-01"},
    QTD:{actual:1799,goal:1823.98,lastYear:1707,start:"2026-07-01"},
    YTD:{actual:6995,goal:6802.30,lastYear:6461,start:"2026-01-01"}},
  rolling:{
    "Last 30":{actual:896,goal:926.25,lastYear:845},
    "Last 60":{actual:1712,goal:1721.97,lastYear:1655},
    "Last 90":{actual:2589,goal:2599.29,lastYear:2506},
    "Last 180":{actual:5051,goal:4891.14,lastYear:4644}},
  monthly:{"2025-01":918,"2025-02":792,"2025-03":702,"2025-04":720,"2025-05":775,"2025-06":847,"2025-07":885,"2025-08":820,"2025-09":996,"2025-10":1386,"2025-11":1079,"2025-12":1088,"2026-01":1157,"2026-02":675,"2026-03":769,"2026-04":880,"2026-05":820,"2026-06":895,"2026-07":894,"2026-08":848,"2026-09":57},
  monthlyGoal:{"2026-01":946,"2026-02":832,"2026-03":737,"2026-04":737,"2026-05":829,"2026-06":898,"2026-07":898,"2026-08":877,"2026-09":1026},
  week:[{date:"2026-08-31",dow:1,count:61,goal:41.78},{date:"2026-09-01",dow:2,count:57,goal:48.85},{date:"2026-09-02",dow:3,count:0,goal:48.85}]
};
const fmtI=n=>Math.round(n).toLocaleString();
const attCls=p=>p>=100?"green":(p>=95?"amber":"red");
const attColor=p=>p>=100?"var(--green)":(p>=95?"var(--amber)":"var(--red)");
const yoyCls=p=>p>=0?"green":"red";
const pct=(a,g)=>g?a/g*100:null;
const sign=p=>(p>=0?"+":"")+p.toFixed(1)+"%";
const niceDate=s=>{const[y,m,d]=s.split("-");return new Date(+y,m-1,+d).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});};
const shortDate=s=>{const[y,m,d]=s.split("-");return (+m)+"/"+(+d);};

document.getElementById("sub").textContent =
  "Job count vs Booked Jobs Goal and same period last year · Data through "+niceDate(DATA.dataAsOf)+" · Generated "+niceDate(DATA.today);

// ---- HERO ----
(function(){
  const y=DATA.yesterday;
  const p=pct(y.actual,y.goal);
  const numCls = y.goal!=null ? attCls(p) : "";
  const yoy = y.lastYear>0 ? (y.actual-y.lastYear)/y.lastYear*100 : null;
  let chips="";
  if (y.goal!=null) chips += '<span class="chip"><span class="'+attCls(p)+'">'+p.toFixed(1)+'% of goal</span> <small>(goal '+y.goal.toFixed(1)+')</small></span>';
  else chips += '<span class="chip"><small>no goal set / non-business day</small></span>';
  chips += '<span class="chip">'+(yoy!=null?'<span class="'+yoyCls(yoy)+'">'+sign(yoy)+' vs LY</span>':'<span>LY: '+y.lastYear+'</span>')+' <small>(LY '+y.lastYear+' on '+shortDate(y.lyDate)+')</small></span>';
  const awaiting = y.awaiting ? '<div style="color:var(--amber);font-size:12px;margin-top:8px">⚠ Awaiting data — source not yet refreshed for this date.</div>' : "";
  // sparkline
  const W=560,H=170,pad=6,bw=W/14;
  const max=Math.max(...DATA.spark.map(s=>s.count), DATA.sparkAvgGoal||0)*1.15;
  let bars="";
  DATA.spark.forEach((s,i)=>{
    const wknd = s.dow===0||s.dow===6;
    const h=Math.max(2, s.count/max*(H-38));
    const x=i*bw+5, yb=H-24-h;
    const fill = i===13 ? "var(--accent)" : (wknd ? "#3a4356" : "#5b6a85");
    bars += '<rect x="'+x+'" y="'+yb+'" width="'+(bw-10)+'" height="'+h+'" rx="3" fill="'+fill+'"/>';
    bars += '<text x="'+(x+(bw-10)/2)+'" y="'+(yb-5)+'" text-anchor="middle" font-size="10.5" fill="'+(i===13?"var(--accent)":"var(--muted)")+'" font-weight="'+(i===13?'700':'400')+'">'+s.count+'</text>';
    bars += '<text x="'+(x+(bw-10)/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+shortDate(s.date)+'</text>';
  });
  let goalLine="";
  if (DATA.sparkAvgGoal){
    const gy=H-24-(DATA.sparkAvgGoal/max*(H-38));
    goalLine='<line x1="2" x2="'+(W-2)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--text)" stroke-dasharray="5,4" stroke-width="1.2" opacity="0.6"/>'+
      '<text x="'+(W-4)+'" y="'+(gy-5)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">avg daily goal '+DATA.sparkAvgGoal.toFixed(1)+'</text>';
  }
  document.getElementById("hero").innerHTML =
    '<div class="hero-left"><div class="hero-wd">Yesterday · '+y.weekday+'</div>'+
    '<div class="hero-num '+numCls+'">'+y.actual+'</div>'+
    '<div class="hero-date">'+niceDate(y.date)+' · booked jobs</div>'+
    '<div class="chips">'+chips+'</div>'+awaiting+'</div>'+
    '<div class="hero-right"><svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">'+bars+goalLine+'</svg>'+
    '<div style="font-size:11px;color:var(--muted);text-align:center">Last 14 days · weekends muted</div></div>';
})();

// ---- KPI CARDS ----
(function(){
  let html="";
  for (const [name,p] of Object.entries(DATA.periods)){
    const at=pct(p.actual,p.goal);
    const goalRow = p.goal!=null
      ? '<div class="row"><span class="k">vs Goal ('+fmtI(p.goal)+')</span><span class="'+attCls(at)+'">'+at.toFixed(1)+'%</span></div>'
      : '<div class="row"><span class="k">vs Goal</span><span class="k">no goal set</span></div>';
    const yoy = p.lastYear>0 ? (p.actual-p.lastYear)/p.lastYear*100 : null;
    const yoyRow = yoy!=null
      ? '<div class="row"><span class="k">vs Last-yr ('+fmtI(p.lastYear)+')</span><span class="'+yoyCls(yoy)+'">'+sign(yoy)+'</span></div>'
      : '<div class="row"><span class="k">vs Last-yr</span><span class="k">LY '+fmtI(p.lastYear)+'</span></div>';
    html += '<div class="card"><div class="lbl">'+name+' <span style="letter-spacing:0;text-transform:none">· from '+shortDate(p.start)+'</span></div>'+
      '<div class="val">'+fmtI(p.actual)+'</div>'+goalRow+yoyRow+'</div>';
  }
  document.getElementById("kpis").innerHTML=html;
})();

// ---- ROLLING ----
(function(){
  let html="";
  for (const [name,p] of Object.entries(DATA.rolling)){
    const at=pct(p.actual,p.goal);
    const yoy=(p.actual-p.lastYear)/p.lastYear*100;
    html += '<div class="card" style="background:var(--panel2)"><div class="lbl">'+name+' days</div>'+
      '<div class="val" style="font-size:28px">'+fmtI(p.actual)+'</div>'+
      '<div class="row"><span class="k">vs Goal ('+fmtI(p.goal)+')</span><span class="'+attCls(at)+'">'+at.toFixed(1)+'%</span></div>'+
      '<div class="row"><span class="k">vs Last-yr ('+fmtI(p.lastYear)+')</span><span class="'+yoyCls(yoy)+'">'+sign(yoy)+'</span></div></div>';
  }
  document.getElementById("rolling").innerHTML=html;
})();

// ---- ATTAINMENT BARS ----
(function(){
  let html="";
  const items = Object.entries(DATA.periods).concat(Object.entries(DATA.rolling));
  for (const [name,p] of items){
    if (p.goal==null || p.goal===0){
      html += '<div class="abar"><div class="top"><span>'+name+'</span><span style="color:var(--muted)">no goal set for this period</span></div>'+
        '<div class="track"></div></div>';
      continue;
    }
    const at=pct(p.actual,p.goal);
    const scale=Math.max(p.actual,p.goal)*1.08;
    const fw=p.actual/scale*100, gx=p.goal/scale*100;
    html += '<div class="abar"><div class="top"><span>'+name+'</span><span><b>'+fmtI(p.actual)+'</b> <span style="color:var(--muted)">/ '+fmtI(p.goal)+' goal</span> · <span class="'+attCls(at)+'">'+at.toFixed(1)+'%</span></span></div>'+
      '<div class="track"><div class="fill" style="width:'+fw+'%;background:'+attColor(at)+'"></div><div class="marker" style="left:'+gx+'%"></div></div></div>';
  }
  document.getElementById("attain").innerHTML=html;
})();

// ---- MONTHLY CHART ----
(function(){
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const W=1100,H=260,padL=8,padB=22,padT=18;
  const years=["2025","2026"], colors={"2025":"#5b8dd9","2026":"var(--accent)"};
  const max=Math.max(...Object.values(DATA.monthly),...Object.values(DATA.monthlyGoal))*1.12;
  const groupW=(W-padL*2)/12, bw=(groupW-14)/2;
  const curMonth = DATA.dataAsOf.slice(0,7);
  let out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">';
  out += '<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--accent)"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0e1116" stroke-width="2.5"/></pattern></defs>';
  for (let m=0;m<12;m++){
    const mm=String(m+1).padStart(2,"0");
    years.forEach((yr,yi)=>{
      const key=yr+"-"+mm, v=DATA.monthly[key];
      const x=padL+m*groupW+6+yi*(bw+2);
      if (v!=null){
        const h=v/max*(H-padB-padT), yb=H-padB-h;
        const fill = key===curMonth ? "url(#hatch)" : colors[yr];
        out += '<rect x="'+x+'" y="'+yb+'" width="'+bw+'" height="'+h+'" rx="2.5" fill="'+fill+'"/>';
        out += '<text x="'+(x+bw/2)+'" y="'+(yb-4)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+v+'</text>';
      }
      // goal tick on 2026 bars
      if (yr==="2026"){
        const g=DATA.monthlyGoal[key];
        if (g!=null){
          const gy=H-padB-(g/max*(H-padB-padT));
          out += '<line x1="'+(x-2)+'" x2="'+(x+bw+2)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--text)" stroke-dasharray="4,3" stroke-width="1.3" opacity="0.8"/>';
        }
      }
    });
    out += '<text x="'+(padL+m*groupW+groupW/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+months[m]+'</text>';
  }
  out += '</svg>';
  document.getElementById("monthly").innerHTML=out;
})();

// ---- WEEK STRIP ----
(function(){
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  let html="";
  DATA.week.forEach(d=>{
    const isToday = d.date===DATA.today;
    const at = (d.goal!=null && !isToday) ? pct(d.count,d.goal) : null;
    html += '<div class="d'+(isToday?' today':'')+'"><div class="dn">'+names[d.dow]+' '+shortDate(d.date)+(isToday?' · today':'')+'</div>'+
      '<div class="dc'+(at!=null?' '+attCls(at):'')+'">'+d.count+'</div>'+
      '<div class="dg">'+(at!=null?('goal '+d.goal.toFixed(1)+' · '+at.toFixed(0)+'%'):(isToday?('in progress'+(d.goal!=null?' · goal '+d.goal.toFixed(1):'')):'no goal set'))+'</div></div>';
  });
  document.getElementById("week").innerHTML=html;
  document.getElementById("wkTitle").textContent = "This Week · Mon "+shortDate(DATA.week[0].date)+" – today";
})();

document.getElementById("foot").innerHTML =
  'Source: <b>Booking PBI 4DX.xlsx</b> (SharePoint) — metric is the COUNT of rows grouped by Created Date (each row = one booked job; 18,003 rows, Jan 1 2025 – '+niceDate(DATA.dataAsOf)+'). '+
  'Goal: <b>Booked Jobs Goal</b> column, CBD 2026 Revenue Budget.xlsx → Daily Goals.<br>'+
  '<b>Yesterday</b> = prior calendar day; its last-year comparison shifts 364 days so the weekday matches (Sep 1 2026 ↔ Sep 2 2025). '+
  'Weeks start Monday. Period goals and last-year figures anchor to the last Created Date in the data ('+niceDate(DATA.dataAsOf)+'). MTD/WTD last-year windows include Sep 1 2025 (Labor Day, 2 jobs), which depresses those LY baselines.<br>'+
  '<b>Goal coverage caveat:</b> the Booked Jobs Goal is populated on business days only and currently runs Jan 2 – Sep 30, 2026. Weekends, holidays, and unbudgeted months have no goal — those days/periods show "no goal set" rather than 0. Attainment: <span class="green">&ge;100%</span> / <span class="amber">95–99.9%</span> / <span class="red">&lt;95%</span>; YoY green when &ge; last year.';
</script>
</body>
</html>
