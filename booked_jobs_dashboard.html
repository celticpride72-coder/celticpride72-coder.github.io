<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booked Jobs Dashboard — Comfort by Design</title>
<style>
:root{
  --bg:#0d0f13; --panel:#161a21; --panel2:#1d222b; --line:#2a3140;
  --txt:#e8ecf3; --muted:#8b95a7; --accent:#ff8a1f; --accent2:#ffb266;
  --green:#3ddc84; --amber:#ffc94d; --red:#ff5f56;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:26px 22px 50px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.3px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.ptitle{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:14px}
.hero{display:flex;gap:26px;flex-wrap:wrap;align-items:stretch;
  background:linear-gradient(135deg,#1b1f28 0%,#161a21 60%);border:1px solid #33393f;border-left:4px solid var(--accent)}
.hero-l{min-width:250px;flex:0 0 auto}
.hero-r{flex:1 1 460px;min-width:340px}
.hbig{font-size:66px;font-weight:700;line-height:1;margin:6px 0 2px}
.hday{font-size:15px;color:var(--accent2);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.hdate{color:var(--muted);font-size:13px;margin-bottom:14px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:12px;color:var(--muted)}
.chip b{display:block;font-size:17px;margin-top:3px}
.green{color:var(--green)} .amber{color:var(--amber)} .red{color:var(--red)} .accent{color:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card .lab{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.card .val{font-size:34px;font-weight:700;margin:6px 0 10px}
.card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:3px 0}
.card .row b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid #20252e;text-align:right}
tr:last-child td{border-bottom:none}
.bar-wrap{height:16px;background:#20252e;border-radius:8px;position:relative;overflow:visible;min-width:150px}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.goalmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:#e8ecf3}
.foot{color:var(--muted);font-size:11.5px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
svg{display:block;width:100%;height:auto}
</style>
</head>
<body>
<h1>Booked Jobs Dashboard</h1>
<div class="sub" id="sub"></div>

<div class="panel hero">
  <div class="hero-l">
    <div class="hday" id="h-day"></div>
    <div class="hbig" id="h-count"></div>
    <div class="hdate" id="h-date"></div>
    <div class="chips">
      <div class="chip">vs Goal<b id="h-goal"></b></div>
      <div class="chip">vs Last Year<b id="h-ly"></b></div>
    </div>
  </div>
  <div class="hero-r">
    <div class="ptitle">Last 14 days — booked jobs</div>
    <div id="spark"></div>
  </div>
</div>

<div class="grid4" id="kpis"></div>

<div class="panel" style="margin-top:18px">
  <div class="ptitle">Rolling windows (anchored at last data date)</div>
  <table id="rolling"></table>
</div>

<div class="panel">
  <div class="ptitle">Attainment to date</div>
  <table id="attain"></table>
</div>

<div class="panel">
  <div class="ptitle">Monthly booked jobs</div>
  <div id="monthly"></div>
</div>

<div class="panel">
  <div class="ptitle">This week (Monday start)</div>
  <table id="week"></table>
</div>

<div class="panel">
  <div class="foot" id="foot"></div>
</div>

<script>
const D = {"TODAY": "2026-09-04", "dataAsOf": "2026-09-03", "updated": "2026-09-04", "yesterday": {"date": "2026-09-03", "weekday": "Thursday", "full": "Thursday, September 3, 2026", "actual": 44, "goal": 48.85142857142858, "lastYear": 66, "lyDate": "2025-09-04", "awaiting": false}, "spark": [{"date": "2026-08-21", "count": 37, "goal": 41.78095238095238, "dow": 5}, {"date": "2026-08-22", "count": 2, "goal": null, "dow": 6}, {"date": "2026-08-23", "count": 2, "goal": null, "dow": 0}, {"date": "2026-08-24", "count": 35, "goal": 41.78095238095238, "dow": 1}, {"date": "2026-08-25", "count": 41, "goal": 41.78095238095238, "dow": 2}, {"date": "2026-08-26", "count": 25, "goal": 41.78095238095238, "dow": 3}, {"date": "2026-08-27", "count": 45, "goal": 41.78095238095238, "dow": 4}, {"date": "2026-08-28", "count": 32, "goal": 41.78095238095238, "dow": 5}, {"date": "2026-08-29", "count": 9, "goal": null, "dow": 6}, {"date": "2026-08-30", "count": 7, "goal": null, "dow": 0}, {"date": "2026-08-31", "count": 61, "goal": 41.78095238095238, "dow": 1}, {"date": "2026-09-01", "count": 57, "goal": 48.85142857142858, "dow": 2}, {"date": "2026-09-02", "count": 55, "goal": 48.85142857142858, "dow": 3}, {"date": "2026-09-03", "count": 44, "goal": 48.85142857142858, "dow": 4}], "periods": {"WTD": {"start": "2026-08-31", "actual": 217, "goal": 188.3352380952381, "lastYear": 201}, "MTD": {"start": "2026-09-01", "actual": 156, "goal": 146.55428571428573, "lastYear": 135}, "QTD": {"start": "2026-07-01", "actual": 1898, "goal": 1921.6842857142856, "lastYear": 1840}, "YTD": {"start": "2026-01-01", "actual": 7094, "goal": 6900.004285714284, "lastYear": 6594}}, "rolling": {"30": {"actual": 892, "goal": 940.3923809523808, "lastYear": 928, "start": "2026-08-05"}, "60": {"actual": 1805, "goal": 1819.669512987013, "lastYear": 1792, "start": "2026-07-06"}, "90": {"actual": 2617, "goal": 2615.3847402597407, "lastYear": 2575, "start": "2026-06-06"}, "180": {"actual": 5117, "goal": 4955.341558441554, "lastYear": 4765, "start": "2026-03-08"}}, "monthly": {"2025-01": 918, "2025-02": 792, "2025-03": 702, "2025-04": 720, "2025-05": 775, "2025-06": 847, "2025-07": 885, "2025-08": 820, "2025-09": 996, "2025-10": 1386, "2025-11": 1079, "2025-12": 1088, "2026-01": 1157, "2026-02": 675, "2026-03": 769, "2026-04": 880, "2026-05": 820, "2026-06": 895, "2026-07": 894, "2026-08": 848, "2026-09": 156}, "monthlyGoal": {"2026-01": 945.54, "2026-02": 831.6, "2026-03": 737.1, "2026-04": 737.1, "2026-05": 829.25, "2026-06": 897.73, "2026-07": 897.73, "2026-08": 877.4, "2026-09": 1025.88}, "weekDaily": [{"date": "2026-08-31", "count": 61, "goal": 41.78095238095238}, {"date": "2026-09-01", "count": 57, "goal": 48.85142857142858}, {"date": "2026-09-02", "count": 55, "goal": 48.85142857142858}, {"date": "2026-09-03", "count": 44, "goal": 48.85142857142858}, {"date": "2026-09-04", "count": 0, "goal": 48.85142857142858}]};

const fmtI = n => Math.round(n).toLocaleString();
const attCls = p => p>=100?'green':(p>=95?'amber':'red');
const yoyCls = p => p>=0?'green':'red';
const pct = (a,g) => g? (a/g*100) : null;
const sgn = v => (v>=0?'+':'') + v.toFixed(1) + '%';
const parse = s => {const [a,b,c]=s.split('-').map(Number); return new Date(a,b-1,c);};

document.getElementById('sub').textContent =
  'Count of booked jobs vs the Booked Jobs Goal and same period last year · data through ' +
  parse(D.dataAsOf).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) +
  ' · generated ' + parse(D.TODAY).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

/* ---------- HERO ---------- */
const Y = D.yesterday;
document.getElementById('h-day').textContent = Y.weekday;
document.getElementById('h-date').textContent = Y.full + (Y.awaiting ? ' — awaiting data' : '');
const yPct = Y.goal ? pct(Y.actual, Y.goal) : null;
const hc = document.getElementById('h-count');
hc.textContent = Y.awaiting ? '—' : fmtI(Y.actual);
hc.className = 'hbig ' + (yPct===null ? 'accent' : attCls(yPct));
document.getElementById('h-goal').innerHTML = Y.goal
  ? '<span class="'+attCls(yPct)+'">'+yPct.toFixed(1)+'%</span> <span style="color:#8b95a7;font-size:12px">of '+Y.goal.toFixed(1)+'</span>'
  : '<span style="color:#8b95a7;font-size:13px">no goal set / non-business day</span>';
const yoy = Y.lastYear ? (Y.actual - Y.lastYear)/Y.lastYear*100 : null;
document.getElementById('h-ly').innerHTML = yoy===null
  ? '<span style="color:#8b95a7;font-size:13px">n/a</span>'
  : '<span class="'+yoyCls(yoy)+'">'+sgn(yoy)+'</span> <span style="color:#8b95a7;font-size:12px">vs '+fmtI(Y.lastYear)+'</span>';

/* ---------- SPARKLINE ---------- */
(function(){
  const s = D.spark, W=760, H=210, pad={t:22,r:12,b:36,l:12};
  const n=s.length, iw=W-pad.l-pad.r, bw=iw/n*0.66, gap=iw/n;
  const goals = s.map(d=>d.goal).filter(g=>g!==null);
  const avgGoal = goals.length? goals.reduce((a,b)=>a+b,0)/goals.length : null;
  const max = Math.max(...s.map(d=>d.count), avgGoal||0)*1.18 || 1;
  const ih = H-pad.t-pad.b;
  let o = '<svg viewBox="0 0 '+W+' '+H+'">';
  if(avgGoal){
    const gy = pad.t + ih - (avgGoal/max)*ih;
    o += '<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+gy+'" y2="'+gy+'" stroke="#ffffff" stroke-opacity=".45" stroke-dasharray="5 4"/>';
    o += '<text x="'+(W-pad.r)+'" y="'+(gy-5)+'" text-anchor="end" font-size="10" fill="#8b95a7">avg daily goal '+avgGoal.toFixed(1)+'</text>';
  }
  s.forEach((d,i)=>{
    const x = pad.l + i*gap + (gap-bw)/2;
    const h = (d.count/max)*ih, y = pad.t+ih-h;
    const wknd = d.dow===0||d.dow===6;
    const last = i===n-1;
    o += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="3" fill="'+(last?'#ff8a1f':(wknd?'#333b48':'#46536b'))+'"/>';
    o += '<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="10.5" fill="'+(last?'#ffb266':'#8b95a7')+'">'+d.count+'</text>';
    const dt = parse(d.date);
    o += '<text x="'+(x+bw/2)+'" y="'+(H-20)+'" text-anchor="middle" font-size="9.5" fill="#8b95a7">'+dt.toLocaleDateString('en-US',{weekday:'short'}).charAt(0)+'</text>';
    o += '<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#5f6a7d">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</text>';
  });
  o += '</svg>';
  document.getElementById('spark').innerHTML = o;
})();

/* ---------- KPI CARDS ---------- */
(function(){
  const order=['WTD','MTD','QTD','YTD'];
  const lab={WTD:'Week to date',MTD:'Month to date',QTD:'Quarter to date',YTD:'Year to date'};
  document.getElementById('kpis').innerHTML = order.map(k=>{
    const p=D.periods[k], a=pct(p.actual,p.goal), y=p.lastYear?(p.actual-p.lastYear)/p.lastYear*100:null;
    return '<div class="card"><div class="lab">'+lab[k]+'</div><div class="val">'+fmtI(p.actual)+'</div>'+
      '<div class="row"><span>vs Goal ('+fmtI(p.goal)+')</span><b class="'+(a?attCls(a):'')+'">'+(a?a.toFixed(1)+'%':'—')+'</b></div>'+
      '<div class="row"><span>vs Last yr ('+fmtI(p.lastYear)+')</span><b class="'+(y===null?'':yoyCls(y))+'">'+(y===null?'—':sgn(y))+'</b></div></div>';
  }).join('');
})();

/* ---------- ROLLING ---------- */
(function(){
  let h='<tr><th>Window</th><th>Booked jobs</th><th>Goal</th><th>% of goal</th><th>Last year</th><th>YoY</th></tr>';
  [30,60,90,180].forEach(N=>{
    const r=D.rolling[String(N)], a=pct(r.actual,r.goal), y=r.lastYear?(r.actual-r.lastYear)/r.lastYear*100:null;
    h+='<tr><td>Last '+N+' days</td><td>'+fmtI(r.actual)+'</td><td>'+fmtI(r.goal)+'</td>'+
       '<td class="'+(a?attCls(a):'')+'">'+(a?a.toFixed(1)+'%':'—')+'</td><td>'+fmtI(r.lastYear)+'</td>'+
       '<td class="'+(y===null?'':yoyCls(y))+'">'+(y===null?'—':sgn(y))+'</td></tr>';
  });
  document.getElementById('rolling').innerHTML=h;
})();

/* ---------- ATTAINMENT BARS ---------- */
(function(){
  const order=['WTD','MTD','QTD','YTD'];
  let h='<tr><th>Period</th><th style="width:46%"></th><th>Actual</th><th>Goal</th><th>%</th></tr>';
  order.forEach(k=>{
    const p=D.periods[k], a=pct(p.actual,p.goal);
    const scale=Math.max(p.actual,p.goal)*1.08||1;
    h+='<tr><td>'+k+'</td><td><div class="bar-wrap"><div class="bar-fill" style="width:'+(p.actual/scale*100).toFixed(1)+'%"></div>'+
       '<div class="goalmark" style="left:'+(p.goal/scale*100).toFixed(1)+'%"></div></div></td>'+
       '<td>'+fmtI(p.actual)+'</td><td>'+fmtI(p.goal)+'</td><td class="'+(a?attCls(a):'')+'">'+(a?a.toFixed(1)+'%':'—')+'</td></tr>';
  });
  document.getElementById('attain').innerHTML=h;
})();

/* ---------- MONTHLY ---------- */
(function(){
  const keys=Object.keys(D.monthly).sort();
  const W=1120,H=280,pad={t:24,r:14,b:46,l:14};
  const n=keys.length, iw=W-pad.l-pad.r, gap=iw/n, bw=gap*0.62, ih=H-pad.t-pad.b;
  const max=Math.max(...keys.map(k=>Math.max(D.monthly[k], D.monthlyGoal[k]||0)))*1.15||1;
  const curMonth = D.TODAY.slice(0,7);
  let o='<svg viewBox="0 0 '+W+' '+H+'">';
  o+='<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
     '<rect width="6" height="6" fill="#ff8a1f" fill-opacity=".35"/><line x1="0" y1="0" x2="0" y2="6" stroke="#ffb266" stroke-width="3"/></pattern></defs>';
  keys.forEach((k,i)=>{
    const v=D.monthly[k], g=D.monthlyGoal[k];
    const x=pad.l+i*gap+(gap-bw)/2, h=(v/max)*ih, y=pad.t+ih-h;
    const yr=k.slice(0,4);
    const col = k===curMonth ? 'url(#hatch)' : (yr==='2026' ? '#ff8a1f' : '#46536b');
    o+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1)+'" rx="3" fill="'+col+'"/>';
    o+='<text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="9.5" fill="#8b95a7">'+v+'</text>';
    if(g){const gy=pad.t+ih-(g/max)*ih;
      o+='<line x1="'+(x-2)+'" x2="'+(x+bw+2)+'" y1="'+gy+'" y2="'+gy+'" stroke="#e8ecf3" stroke-opacity=".8" stroke-dasharray="4 3" stroke-width="1.6"/>';}
    const mm=k.slice(5);
    o+='<text x="'+(x+bw/2)+'" y="'+(H-24)+'" text-anchor="middle" font-size="9.5" fill="#8b95a7">'+mm+'</text>';
    if(mm==='01'||i===0) o+='<text x="'+(x+bw/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="#5f6a7d">'+yr+'</text>';
  });
  o+='</svg>';
  document.getElementById('monthly').innerHTML=o+
    '<div style="color:#8b95a7;font-size:11px;margin-top:6px">Orange = 2026 · slate = 2025 · hatched = current (partial) month · dashed tick = 2026 Booked Jobs Goal for that month</div>';
})();

/* ---------- WEEK STRIP ---------- */
(function(){
  let h='<tr><th>Day</th><th>Date</th><th>Booked jobs</th><th>Goal</th><th>% of goal</th></tr>';
  D.weekDaily.forEach(d=>{
    const dt=parse(d.date), a=d.goal?pct(d.count,d.goal):null;
    h+='<tr><td>'+dt.toLocaleDateString('en-US',{weekday:'long'})+'</td><td>'+dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</td>'+
       '<td>'+fmtI(d.count)+'</td><td>'+(d.goal?d.goal.toFixed(1):'—')+'</td>'+
       '<td class="'+(a?attCls(a):'')+'">'+(a?a.toFixed(1)+'%':'—')+'</td></tr>';
  });
  document.getElementById('week').innerHTML=h;
})();

/* ---------- FOOTER ---------- */
document.getElementById('foot').innerHTML =
  'Source: <b>Booking PBI 4DX.xlsx</b> via the booking history ledger (updated '+D.updated+') — metric is the COUNT of booked jobs by <b>Created Date</b>. '+
  'Goal: <b>Booked Jobs Goal</b> column, "Daily Goals" tab of CBD 2026 Revenue Budget.xlsx.<br>'+
  '<b>Yesterday</b> = the prior calendar day ('+D.yesterday.date+'); last year = a 364-day shift ('+D.yesterday.lyDate+') so the weekday matches.<br>'+
  'Weeks start Monday. Goal and last-year comparisons for periods and rolling windows anchor to the last Created Date in the data ('+D.dataAsOf+').<br>'+
  '<b>Goal coverage caveat:</b> the Booked Jobs Goal is populated on business days only (Jan 2 – Sep 30, 2026). Weekends, holidays and unbudgeted months carry no goal and are omitted from goal markers rather than counted as zero.';
</script>
</body>
</html>
