<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booked Jobs Dashboard — Comfort By Design</title>
<style>
:root{
  --accent:#F26A1B; --accent-soft:#FDE3D2; --accent-dark:#C24E08;
  --bg:#F7F7F5; --card:#FFFFFF; --ink:#1F2328; --muted:#6B7280; --line:#E6E6E2;
  --green:#15803D; --green-bg:#DCFCE7; --amber:#B45309; --amber-bg:#FEF3C7; --red:#B91C1C; --red-bg:#FEE2E2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;border-bottom:3px solid var(--accent);padding-bottom:14px}
h1{margin:0;font-size:26px;letter-spacing:-.4px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2.sect{font-size:13px;text-transform:uppercase;letter-spacing:.10em;color:var(--muted);margin:30px 0 12px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:0;overflow:hidden}
.hero .left{padding:22px 24px;border-right:1px solid var(--line)}
.hero .right{padding:18px 22px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.downame{font-size:22px;font-weight:700;margin-top:8px}
.bignum{font-size:76px;font-weight:800;line-height:1;letter-spacing:-3px;margin:2px 0 4px}
.fulldate{color:var(--muted);font-size:13px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;line-height:1.25}
.chip small{display:block;font-weight:500;opacity:.8;font-size:10.5px;letter-spacing:.02em}
.ok{background:var(--green-bg);color:var(--green)} .warn{background:var(--amber-bg);color:var(--amber)} .bad{background:var(--red-bg);color:var(--red)}
.neutral{background:#EFEFEC;color:var(--muted)}

/* kpi cards */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px 18px}
.kpi .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .val{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 2px}
.kpi .rng{font-size:11px;color:var(--muted);margin-bottom:10px}
.kpi .rows{display:flex;flex-direction:column;gap:5px}
.kpi .r{display:flex;justify-content:space-between;font-size:12px;align-items:center}
.kpi .r b{font-weight:700}
.pill{padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700}

/* attainment bars */
.att{padding:18px 22px}
.attrow{margin:14px 0}
.attrow .h{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.track{position:relative;height:16px;background:#EFEFEC;border-radius:8px;overflow:visible}
.fill{height:100%;border-radius:8px;background:var(--accent)}
.mark{position:absolute;top:-4px;height:24px;width:2px;background:#111}
.mark span{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;color:#111;white-space:nowrap;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
tbody tr:last-child td{border-bottom:none}
.pad{padding:6px 8px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}
.stale{background:var(--amber-bg);color:var(--amber);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:14px}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero .left{border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Booked <span>Jobs</span> Dashboard</h1>
      <div class="sub">Comfort By Design &middot; count of booked jobs vs. Booked Jobs Goal and same period last year</div>
    </div>
    <div class="sub" id="stamp"></div>
  </header>

  <div id="staleBox"></div>

  <div class="card hero">
    <div class="left">
      <div class="eyebrow">Yesterday</div>
      <div class="downame" id="yDow"></div>
      <div class="bignum" id="yNum"></div>
      <div class="fulldate" id="yDate"></div>
      <div class="chips" id="yChips"></div>
    </div>
    <div class="right">
      <div style="font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px">Last 14 days</div>
      <div id="spark"></div>
    </div>
  </div>

  <h2 class="sect">Period to date</h2>
  <div class="grid4" id="kpis"></div>

  <h2 class="sect">Rolling windows</h2>
  <div class="grid4" id="rolls"></div>

  <h2 class="sect">Attainment to date</h2>
  <div class="card att" id="att"></div>

  <h2 class="sect">Monthly booked jobs</h2>
  <div class="card" style="padding:18px 22px"><div id="monthly"></div></div>

  <h2 class="sect">This week (Monday start)</h2>
  <div class="card" style="padding:6px 8px"><table id="week"></table></div>

  <footer id="foot"></footer>
</div>

<script>
const DATA = {
  today: "2026-08-13",
  dataAsOf: "2026-08-12",
  yesterday: {date:"2026-08-12", dow:"Wednesday", actual:34, goal:41.78095238095238, lastYear:53, lyDate:"2025-08-13", lyDow:"Wednesday", stale:false},
  spark: [
    {date:"2026-07-30",count:31,goal:40.80590909090909,dow:4},
    {date:"2026-07-31",count:33,goal:40.80590909090909,dow:5},
    {date:"2026-08-01",count:2,goal:null,dow:6},
    {date:"2026-08-02",count:7,goal:null,dow:0},
    {date:"2026-08-03",count:41,goal:41.78095238095238,dow:1},
    {date:"2026-08-04",count:62,goal:41.78095238095238,dow:2},
    {date:"2026-08-05",count:46,goal:41.78095238095238,dow:3},
    {date:"2026-08-06",count:36,goal:41.78095238095238,dow:4},
    {date:"2026-08-07",count:48,goal:41.78095238095238,dow:5},
    {date:"2026-08-08",count:1,goal:null,dow:6},
    {date:"2026-08-09",count:1,goal:null,dow:0},
    {date:"2026-08-10",count:46,goal:41.78095238095238,dow:1},
    {date:"2026-08-11",count:37,goal:41.78095238095238,dow:2},
    {date:"2026-08-12",count:34,goal:41.78095238095238,dow:3}
  ],
  periods: {
    WTD:{start:"2026-08-10",actual:117,goal:125.34285714285713,lastYear:152},
    MTD:{start:"2026-08-01",actual:361,goal:334.247619047619,lastYear:295},
    QTD:{start:"2026-07-01",actual:1255,goal:1231.9776190476186,lastYear:1180},
    YTD:{start:"2026-01-01",actual:6451,goal:6210.297619047625,lastYear:5934}
  },
  rolling: {
    L30:{start:"2026-07-14",end:"2026-08-12",actual:905,goal:905.5303463203463,lastYear:877},
    L60:{start:"2026-06-14",end:"2026-08-12",actual:1754,goal:1721.6485281385283,lastYear:1753},
    L90:{start:"2026-05-15",end:"2026-08-12",actual:2662,goal:2544.33261904762,lastYear:2421},
    L180:{start:"2026-02-14",end:"2026-08-12",actual:4949,goal:4848.957619047619,lastYear:4685}
  },
  monthly: {"2025-01":918,"2025-02":792,"2025-03":702,"2025-04":720,"2025-05":775,"2025-06":847,"2025-07":885,"2025-08":820,"2025-09":996,"2025-10":1386,"2025-11":1079,"2025-12":1088,"2026-01":1157,"2026-02":675,"2026-03":769,"2026-04":880,"2026-05":820,"2026-06":895,"2026-07":894,"2026-08":361},
  monthlyGoal: {"2026-01":945.5,"2026-02":831.6,"2026-03":737.1,"2026-04":737.1,"2026-05":829.2,"2026-06":897.7,"2026-07":897.7,"2026-08":877.4},
  weekDaily: [
    {date:"2026-08-10",count:46,goal:41.78095238095238,dow:1},
    {date:"2026-08-11",count:37,goal:41.78095238095238,dow:2},
    {date:"2026-08-12",count:34,goal:41.78095238095238,dow:3},
    {date:"2026-08-13",count:0,goal:41.78095238095238,dow:4}
  ]
};

const P = s => {const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);};
const fmtLong = s => P(s).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const fmtShort = s => P(s).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const n0 = v => Math.round(v).toLocaleString('en-US');
const pct1 = v => (v>=0?'':'') + v.toFixed(1) + '%';
const attCls = p => p>=100?'ok':(p>=95?'warn':'bad');
const yoyCls = p => p>=0?'ok':'bad';

document.getElementById('stamp').innerHTML =
  'Generated ' + fmtLong(DATA.today) + '<br>Data through <b>' + fmtLong(DATA.dataAsOf) + '</b>';

/* ---------- hero ---------- */
const Y = DATA.yesterday;
const yAtt = Y.goal ? (Y.actual/Y.goal*100) : null;
const yYoY = Y.lastYear ? ((Y.actual-Y.lastYear)/Y.lastYear*100) : null;
document.getElementById('yDow').textContent = Y.dow;
const yNum = document.getElementById('yNum');
yNum.textContent = n0(Y.actual);
yNum.style.color = yAtt===null ? 'var(--ink)' : (yAtt>=100?'var(--green)':(yAtt>=95?'var(--amber)':'var(--red)'));
document.getElementById('yDate').textContent = fmtLong(Y.date) + ' · booked jobs';
let chips = '';
if (yAtt===null) chips += '<div class="chip neutral">No goal set<small>non-business day</small></div>';
else chips += '<div class="chip '+attCls(yAtt)+'">'+yAtt.toFixed(1)+'% of goal<small>goal '+Y.goal.toFixed(1)+'</small></div>';
if (yYoY===null) chips += '<div class="chip neutral">No LY data<small>'+Y.lyDate+'</small></div>';
else chips += '<div class="chip '+yoyCls(yYoY)+'">'+(yYoY>=0?'+':'')+yYoY.toFixed(1)+'% vs last yr<small>'+Y.lyDow.slice(0,3)+' '+fmtShort(Y.lyDate)+': '+n0(Y.lastYear)+'</small></div>';
document.getElementById('yChips').innerHTML = chips;
if (Y.stale) {
  document.getElementById('staleBox').innerHTML =
    '<div class="stale">Awaiting data &mdash; yesterday ('+Y.date+') is later than the newest Created Date in the source ('+DATA.dataAsOf+'). The Yesterday card reflects rows loaded so far and may be incomplete.</div>';
}

/* ---------- sparkline (14-day bars) ---------- */
(function(){
  const S = DATA.spark, W=680, H=190, padT=22, padB=30, padL=6, padR=6;
  const max = Math.max(...S.map(d=>d.count), ...S.map(d=>d.goal||0), 1);
  const bw = (W-padL-padR)/S.length, gap = bw*0.22;
  const goals = S.map(d=>d.goal).filter(g=>g!=null);
  const avgGoal = goals.length ? goals.reduce((a,b)=>a+b,0)/goals.length : null;
  const yS = v => padT + (H-padT-padB) * (1 - v/max);
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  S.forEach((d,i)=>{
    const x = padL + i*bw + gap/2, w = bw-gap;
    const h = Math.max(1, (H-padT-padB) * (d.count/max));
    const isY = d.date===Y.date, wk = (d.dow===0||d.dow===6);
    const col = isY ? 'var(--accent)' : (wk ? '#DCDCD6' : '#B9BAB4');
    svg += '<rect x="'+x.toFixed(1)+'" y="'+(H-padB-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+col+'"/>';
    svg += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-padB-h-5).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="'+(isY?'800':'600')+'" fill="'+(isY?'var(--accent-dark)':'#6B7280')+'">'+d.count+'</text>';
    svg += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-padB+13).toFixed(1)+'" text-anchor="middle" font-size="9" fill="'+(isY?'var(--accent-dark)':'#9CA3AF')+'" font-weight="'+(isY?'700':'400')+'">'+fmtShort(d.date)+'</text>';
  });
  if (avgGoal!=null){
    const gy = yS(avgGoal);
    svg += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="#111" stroke-width="1.2" stroke-dasharray="5 4"/>';
    svg += '<text x="'+(W-padR)+'" y="'+(gy-5).toFixed(1)+'" text-anchor="end" font-size="9.5" font-weight="700" fill="#111">avg daily goal '+avgGoal.toFixed(1)+'</text>';
  }
  svg += '</svg>';
  document.getElementById('spark').innerHTML = svg;
})();

/* ---------- KPI cards ---------- */
function kpiCard(label, o, rangeTxt){
  const att = o.goal ? o.actual/o.goal*100 : null;
  const yoy = o.lastYear ? (o.actual-o.lastYear)/o.lastYear*100 : null;
  return '<div class="card kpi">'+
    '<div class="lab">'+label+'</div>'+
    '<div class="val">'+n0(o.actual)+'</div>'+
    '<div class="rng">'+rangeTxt+'</div>'+
    '<div class="rows">'+
      '<div class="r"><span>vs Goal <b style="color:var(--muted);font-weight:500">'+(o.goal?n0(o.goal):'—')+'</b></span>'+
        (att===null?'<span class="pill neutral">n/a</span>':'<span class="pill '+attCls(att)+'">'+att.toFixed(1)+'%</span>')+'</div>'+
      '<div class="r"><span>vs Last yr <b style="color:var(--muted);font-weight:500">'+(o.lastYear?n0(o.lastYear):'—')+'</b></span>'+
        (yoy===null?'<span class="pill neutral">n/a</span>':'<span class="pill '+yoyCls(yoy)+'">'+(yoy>=0?'+':'')+yoy.toFixed(1)+'%</span>')+'</div>'+
    '</div></div>';
}
document.getElementById('kpis').innerHTML =
  ['WTD','MTD','QTD','YTD'].map(k=>kpiCard(k, DATA.periods[k], fmtShort(DATA.periods[k].start)+' – '+fmtShort(DATA.today))).join('');
document.getElementById('rolls').innerHTML =
  [['L30','Last 30'],['L60','Last 60'],['L90','Last 90'],['L180','Last 180']]
  .map(([k,lab])=>kpiCard(lab+' days', DATA.rolling[k], fmtShort(DATA.rolling[k].start)+' – '+fmtShort(DATA.rolling[k].end))).join('');

/* ---------- attainment bars ---------- */
(function(){
  const rows = [['WTD',DATA.periods.WTD],['MTD',DATA.periods.MTD],['QTD',DATA.periods.QTD],['YTD',DATA.periods.YTD]];
  let html = '';
  rows.forEach(([lab,o])=>{
    const att = o.goal ? o.actual/o.goal*100 : null;
    const scale = Math.max(o.actual, o.goal||0) * 1.10;
    const fw = Math.min(100, o.actual/scale*100);
    const gp = o.goal ? Math.min(100, o.goal/scale*100) : null;
    html += '<div class="attrow">'+
      '<div class="h"><b>'+lab+'</b><span>'+n0(o.actual)+' of '+(o.goal?n0(o.goal):'—')+
        (att===null?'':' · <b style="color:'+(att>=100?'var(--green)':(att>=95?'var(--amber)':'var(--red)'))+'">'+att.toFixed(1)+'%</b>')+'</span></div>'+
      '<div class="track"><div class="fill" style="width:'+fw.toFixed(1)+'%"></div>'+
        (gp===null?'':'<div class="mark" style="left:'+gp.toFixed(1)+'%"><span>Goal</span></div>')+
      '</div></div>';
  });
  document.getElementById('att').innerHTML = html;
})();

/* ---------- monthly trend ---------- */
(function(){
  const keys = Object.keys(DATA.monthly).sort();
  const W=1060, H=300, padT=30, padB=46, padL=8, padR=8;
  const maxV = Math.max(...keys.map(k=>DATA.monthly[k]), ...Object.values(DATA.monthlyGoal));
  const bw=(W-padL-padR)/keys.length, gap=bw*0.26;
  const curMonth = DATA.today.slice(0,7);
  const colors = {"2025":"#C9CAC4","2026":"var(--accent)"};
  let svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  svg += '<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">'+
         '<rect width="6" height="6" fill="var(--accent-soft)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--accent)" stroke-width="3"/></pattern></defs>';
  keys.forEach((k,i)=>{
    const v = DATA.monthly[k], yr = k.slice(0,4);
    const x = padL + i*bw + gap/2, w = bw-gap;
    const h = (H-padT-padB) * (v/maxV);
    const isCur = k===curMonth;
    const fill = isCur ? 'url(#hatch)' : (colors[yr]||'#9CA3AF');
    svg += '<rect x="'+x.toFixed(1)+'" y="'+(H-padB-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+fill+'"'+(isCur?' stroke="var(--accent)" stroke-width="1"':'')+'/>';
    svg += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-padB-h-6).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="600" fill="#4B5563">'+v+'</text>';
    const g = DATA.monthlyGoal[k];
    if (g!=null){
      const gy = H-padB-(H-padT-padB)*(g/maxV);
      svg += '<line x1="'+(x-1).toFixed(1)+'" x2="'+(x+w+1).toFixed(1)+'" y1="'+gy.toFixed(1)+'" y2="'+gy.toFixed(1)+'" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/>';
    }
    const lab = P(k+'-01').toLocaleDateString('en-US',{month:'short'});
    svg += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-padB+14).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="#6B7280">'+lab+'</text>';
    if (i===0 || keys[i-1].slice(0,4)!==yr)
      svg += '<text x="'+x.toFixed(1)+'" y="'+(H-padB+30).toFixed(1)+'" font-size="11" font-weight="800" fill="#374151">'+yr+'</text>';
  });
  svg += '<g transform="translate('+(padL)+','+14+')" font-size="10" fill="#6B7280">'+
    '<rect x="0" y="-9" width="11" height="11" rx="2" fill="#C9CAC4"/><text x="16" y="0">2025</text>'+
    '<rect x="52" y="-9" width="11" height="11" rx="2" fill="var(--accent)"/><text x="68" y="0">2026</text>'+
    '<rect x="104" y="-9" width="11" height="11" rx="2" fill="url(#hatch)" stroke="var(--accent)"/><text x="120" y="0">current month (partial)</text>'+
    '<line x1="248" y1="-4" x2="266" y2="-4" stroke="#111" stroke-width="1.6" stroke-dasharray="4 3"/><text x="271" y="0">2026 monthly Booked Jobs Goal</text></g>';
  svg += '</svg>';
  document.getElementById('monthly').innerHTML = svg;
})();

/* ---------- week strip ---------- */
(function(){
  let h = '<thead><tr><th>Day</th><th>Date</th><th>Jobs</th><th>Goal</th><th>Attainment</th></tr></thead><tbody>';
  let tot=0, gtot=0;
  DATA.weekDaily.forEach(d=>{
    const att = d.goal ? d.count/d.goal*100 : null;
    tot += d.count; gtot += (d.goal||0);
    h += '<tr><td>'+P(d.date).toLocaleDateString('en-US',{weekday:'long'})+'</td><td>'+fmtShort(d.date)+'</td>'+
      '<td><b>'+d.count+'</b></td><td>'+(d.goal?d.goal.toFixed(1):'—')+'</td>'+
      '<td>'+(att===null?'<span class="pill neutral">no goal</span>':'<span class="pill '+attCls(att)+'">'+att.toFixed(0)+'%</span>')+'</td></tr>';
  });
  const tAtt = gtot ? tot/gtot*100 : null;
  h += '</tbody><tfoot><tr style="border-top:2px solid var(--line)"><td colspan="2"><b>Week to date</b></td><td><b>'+tot+'</b></td><td>'+gtot.toFixed(1)+'</td>'+
       '<td>'+(tAtt===null?'—':'<span class="pill '+attCls(tAtt)+'">'+tAtt.toFixed(0)+'%</span>')+'</td></tr></tfoot>';
  document.getElementById('week').innerHTML = h;
})();

document.getElementById('foot').innerHTML =
  '<b>Sources.</b> Bookings: <i>Booking PBI 4DX.xlsx</i> (SharePoint &rsaquo; PBI/2025/4DX) &mdash; metric is the COUNT of rows, one row per booked job, grouped by the <i>Created Date</i> column. Goal: <i>CBD 2026 Revenue Budget.xlsx</i> &rsaquo; <i>Daily Goals</i> &rsaquo; <i>Booked Jobs Goal</i>.<br>' +
  '<b>Yesterday</b> = the prior calendar day (' + DATA.yesterday.date + '). Last year for the Yesterday card is a 364-day shift (' + DATA.yesterday.lyDate + ') so the weekday matches.<br>' +
  '<b>Goal coverage.</b> The Booked Jobs Goal column is populated on business days only and currently runs Jan 2 – Aug 31, 2026. Weekends, holidays and unbudgeted months carry no goal and are omitted rather than treated as zero, so period goal totals cover business days only. Weeks start Monday; goal and last-year figures anchor to the latest Created Date in the bookings file (' + DATA.dataAsOf + ').';
</script>
</body>
</html>
