<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booked Jobs Dashboard — Comfort By Design</title>
<style>
:root{
  --accent:#f97316; --accent-soft:rgba(249,115,22,.14); --accent-line:rgba(249,115,22,.45);
  --bg:#0e1116; --panel:#161b23; --panel-2:#1c222c; --line:#2a323f;
  --txt:#e8edf4; --muted:#93a1b5; --dim:#5f6d80;
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:26px 22px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:23px;margin:0 0 3px;letter-spacing:-.3px}
h1 .dot{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600}

/* hero */
.hero{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:center;
  background:linear-gradient(135deg,var(--panel) 0%,var(--panel-2) 100%);
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.hero .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.hero .wd{font-size:20px;font-weight:600;color:var(--txt);margin-bottom:2px}
.hero .big{font-size:66px;font-weight:800;line-height:1;letter-spacing:-2px;margin:6px 0 4px}
.hero .full{color:var(--muted);font-size:13px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.chip b{font-size:13px}
.chip.nogoal{color:var(--dim)}
.awaiting{margin-top:10px;font-size:12px;color:var(--amber);border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.08);border-radius:8px;padding:7px 10px}

/* kpi */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px}
.kpi .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .rng{font-size:11px;color:var(--dim);margin-top:2px}
.kpi .v{font-size:34px;font-weight:750;letter-spacing:-1px;margin:9px 0 8px}
.kpi .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:3px 0}
.kpi .row b{font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid rgba(42,50,63,.55);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
td.n{text-align:right}
.g{color:var(--green)}.a{color:var(--amber)}.r{color:var(--red)}
.legend{font-size:11.5px;color:var(--dim);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
footer{color:var(--dim);font-size:11.5px;line-height:1.75;border-top:1px solid var(--line);padding-top:14px;margin-top:26px}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Booked Jobs Dashboard <span class="dot">·</span> Comfort By Design</h1>
  <div class="sub" id="sub"></div>

  <div class="hero">
    <div>
      <div class="lbl">Yesterday</div>
      <div class="wd" id="hWd"></div>
      <div class="big" id="hBig">—</div>
      <div class="full" id="hFull"></div>
      <div class="chips" id="hChips"></div>
      <div id="hAwait"></div>
    </div>
    <div><div id="spark"></div></div>
  </div>

  <div class="grid4" id="kpis"></div>

  <div class="panel"><h2>Rolling windows (anchored at last Created Date)</h2>
    <table id="rollTbl"></table></div>

  <div class="panel"><h2>Attainment to date</h2><div id="attain"></div>
    <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>Actual jobs</span>
    <span><span class="sw" style="background:var(--txt)"></span>Goal marker</span></div></div>

  <div class="panel"><h2>Monthly booked jobs</h2><div id="monthly"></div>
    <div class="legend"><span><span class="sw" style="background:#5b7fa8"></span>2025</span>
    <span><span class="sw" style="background:var(--accent)"></span>2026</span>
    <span><span class="sw" style="background:var(--txt);height:2px;width:16px;border-radius:0"></span>2026 Booked Jobs Goal</span>
    <span>Hatched = current month (partial)</span></div></div>

  <div class="panel"><h2>This week (Monday start)</h2><div id="week"></div></div>

  <footer id="foot"></footer>
</div>

<script>
const D = {"TODAY":"2026-08-17","dataAsOf":"2026-08-16","yest":{"date":"2026-08-16","weekday":"Sunday","actual":4,"goal":null,"lastYear":2,"lyDate":"2025-08-17","lyWeekday":"Sunday","awaiting":false},"spark":[{"date":"2026-08-03","dow":1,"count":41,"goal":41.78095238095238},{"date":"2026-08-04","dow":2,"count":62,"goal":41.78095238095238},{"date":"2026-08-05","dow":3,"count":46,"goal":41.78095238095238},{"date":"2026-08-06","dow":4,"count":36,"goal":41.78095238095238},{"date":"2026-08-07","dow":5,"count":48,"goal":41.78095238095238},{"date":"2026-08-08","dow":6,"count":1,"goal":null},{"date":"2026-08-09","dow":0,"count":1,"goal":null},{"date":"2026-08-10","dow":1,"count":46,"goal":41.78095238095238},{"date":"2026-08-11","dow":2,"count":37,"goal":41.78095238095238},{"date":"2026-08-12","dow":3,"count":34,"goal":41.78095238095238},{"date":"2026-08-13","dow":4,"count":35,"goal":41.78095238095238},{"date":"2026-08-14","dow":5,"count":15,"goal":41.78095238095238},{"date":"2026-08-15","dow":6,"count":8,"goal":null},{"date":"2026-08-16","dow":0,"count":4,"goal":null}],"periods":{"WTD":{"start":"2026-08-17","actual":0,"goal":null,"lastYear":0},"MTD":{"start":"2026-08-01","actual":423,"goal":417.8095238095238,"lastYear":431},"QTD":{"start":"2026-07-01","actual":1317,"goal":1315.5395238095234,"lastYear":1316},"YTD":{"start":"2026-01-01","actual":6513,"goal":6293.859523809529,"lastYear":6070}},"rolling":{"L30":{"n":30,"start":"2026-07-18","end":"2026-08-16","actual":810,"goal":825.8686147186147,"lastYear":830},"L60":{"n":60,"start":"2026-06-18","end":"2026-08-16","actual":1674,"goal":1682.7927056277053,"lastYear":1728},"L90":{"n":90,"start":"2026-05-19","end":"2026-08-16","actual":2637,"goal":2544.969523809525,"lastYear":2420},"L180":{"n":180,"start":"2026-02-18","end":"2026-08-16","actual":4945,"goal":4849.359523809523,"lastYear":4663}},"monthly":{"2025-01":918,"2025-02":792,"2025-03":702,"2025-04":720,"2025-05":775,"2025-06":847,"2025-07":885,"2025-08":820,"2025-09":996,"2025-10":1386,"2025-11":1079,"2025-12":1088,"2026-01":1157,"2026-02":675,"2026-03":769,"2026-04":880,"2026-05":820,"2026-06":895,"2026-07":894,"2026-08":423},"monthlyGoal":{"2026-01":945.5399999999995,"2026-02":831.6000000000001,"2026-03":737.1,"2026-04":737.1,"2026-05":829.2499999999998,"2026-06":897.7299999999996,"2026-07":897.7299999999996,"2026-08":877.4},"weekDaily":[{"date":"2026-08-17","dow":1,"count":0,"goal":41.78095238095238}]};

const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pd=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c);};
const nice=k=>{const d=pd(k);return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();};
const shortD=k=>{const d=pd(k);return MON[d.getMonth()]+' '+d.getDate();};
const int=n=>Math.round(n).toLocaleString();
const attClass=p=>p==null?'':(p>=100?'g':(p>=95?'a':'r'));
const attColor=p=>p==null?'var(--muted)':(p>=100?'var(--green)':(p>=95?'var(--amber)':'var(--red)'));
const yoyClass=p=>p==null?'':(p>=0?'g':'r');
const pct=(a,g)=>(g==null||g===0)?null:a/g*100;
const yoy=(a,l)=>(l==null||l===0)?null:(a-l)/l*100;
const fp=p=>p==null?'—':(p>=0?'':'')+p.toFixed(1)+'%';
const fy=p=>p==null?'—':(p>=0?'+':'')+p.toFixed(1)+'%';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

document.getElementById('sub').textContent =
  'Count of booked jobs by Created Date · Today '+nice(D.TODAY)+' · Data through '+nice(D.dataAsOf);

/* ---------- HERO ---------- */
(function(){
  const y=D.yest, p=pct(y.actual,y.goal), v=yoy(y.actual,y.lastYear);
  document.getElementById('hWd').textContent=y.weekday;
  const big=document.getElementById('hBig');
  big.textContent=int(y.actual);
  big.style.color = y.goal==null ? 'var(--accent)' : attColor(p);
  document.getElementById('hFull').textContent=nice(y.date);
  const chips=[];
  if(y.goal==null) chips.push('<span class="chip nogoal">no goal set / non-business day</span>');
  else chips.push('<span class="chip">vs Goal <b class="'+attClass(p)+'">'+fp(p)+'</b> <span style="color:var(--dim)">(goal '+int(y.goal)+')</span></span>');
  chips.push('<span class="chip">vs Last Yr <b class="'+yoyClass(v)+'">'+fy(v)+'</b> <span style="color:var(--dim)">('+int(y.lastYear)+' on '+y.lyWeekday.slice(0,3)+' '+shortD(y.lyDate)+')</span></span>');
  document.getElementById('hChips').innerHTML=chips.join('');
  if(y.awaiting) document.getElementById('hAwait').innerHTML=
    '<div class="awaiting">Awaiting data — source last refreshed through '+nice(D.dataAsOf)+'.</div>';
})();

/* ---------- SPARKLINE (14 days) ---------- */
(function(){
  const s=D.spark, W=660,H=200,pad={t:22,r:12,b:34,l:12};
  const gs=s.filter(x=>x.goal!=null).map(x=>x.goal);
  const avgGoal=gs.length?gs.reduce((a,b)=>a+b,0)/gs.length:null;
  const max=Math.max(...s.map(x=>x.count), avgGoal||0, 1)*1.18;
  const iw=W-pad.l-pad.r, bw=iw/s.length, bar=bw*0.62;
  const yy=v=>pad.t+(H-pad.t-pad.b)*(1-v/max);
  let o='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  s.forEach((d,i)=>{
    const x=pad.l+i*bw+(bw-bar)/2, last=i===s.length-1, wknd=d.dow===0||d.dow===6;
    const col=last?'var(--accent)':(wknd?'#39424f':'#4a596d');
    const h=Math.max(H-pad.b-yy(d.count),0);
    o+='<rect x="'+x.toFixed(1)+'" y="'+yy(d.count).toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2.5" fill="'+col+'"/>';
    o+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(yy(d.count)-5).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="'+(last?'700':'500')+'" fill="'+(last?'var(--accent)':'var(--muted)')+'">'+d.count+'</text>';
    o+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(H-pad.b+13)+'" text-anchor="middle" font-size="9" fill="'+(last?'var(--txt)':'var(--dim)')+'">'+DOW[d.dow][0]+'</text>';
    o+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(H-pad.b+24)+'" text-anchor="middle" font-size="8.5" fill="var(--dim)">'+pd(d.date).getDate()+'</text>';
  });
  if(avgGoal!=null){
    o+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+yy(avgGoal).toFixed(1)+'" y2="'+yy(avgGoal).toFixed(1)+'" stroke="var(--txt)" stroke-width="1.2" stroke-dasharray="5 4" opacity=".6"/>';
    o+='<text x="'+(W-pad.r)+'" y="'+(yy(avgGoal)-6).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">avg daily goal '+avgGoal.toFixed(0)+'</text>';
  }
  o+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+(H-pad.b)+'" y2="'+(H-pad.b)+'" stroke="var(--line)"/>';
  o+='<text x="'+pad.l+'" y="12" font-size="10" fill="var(--dim)">Last 14 days ending '+shortD(s[s.length-1].date)+'</text></svg>';
  document.getElementById('spark').innerHTML=o;
})();

/* ---------- KPI CARDS ---------- */
(function(){
  const html=['WTD','MTD','QTD','YTD'].map(k=>{
    const d=D.periods[k], p=pct(d.actual,d.goal), v=yoy(d.actual,d.lastYear);
    return '<div class="kpi"><div class="t">'+k+'</div><div class="rng">'+shortD(d.start)+' – '+shortD(D.TODAY)+'</div>'+
      '<div class="v">'+int(d.actual)+'</div>'+
      '<div class="row"><span>vs Goal '+(d.goal==null?'':'('+int(d.goal)+')')+'</span><b class="'+attClass(p)+'">'+fp(p)+'</b></div>'+
      '<div class="row"><span>vs Last yr ('+int(d.lastYear)+')</span><b class="'+yoyClass(v)+'">'+fy(v)+'</b></div></div>';
  }).join('');
  document.getElementById('kpis').innerHTML=html;
})();

/* ---------- ROLLING ---------- */
(function(){
  let o='<tr><th>Window</th><th class="n" style="text-align:right">Jobs</th><th class="n" style="text-align:right">Goal</th><th class="n" style="text-align:right">vs Goal</th><th class="n" style="text-align:right">Last Yr</th><th class="n" style="text-align:right">vs Last Yr</th><th>Range</th></tr>';
  Object.keys(D.rolling).forEach(k=>{
    const d=D.rolling[k], p=pct(d.actual,d.goal), v=yoy(d.actual,d.lastYear);
    o+='<tr><td><b>Last '+d.n+'</b></td><td class="n">'+int(d.actual)+'</td><td class="n" style="color:var(--muted)">'+(d.goal==null?'—':int(d.goal))+'</td>'+
       '<td class="n '+attClass(p)+'"><b>'+fp(p)+'</b></td><td class="n" style="color:var(--muted)">'+int(d.lastYear)+'</td>'+
       '<td class="n '+yoyClass(v)+'"><b>'+fy(v)+'</b></td><td style="color:var(--dim);font-size:12px">'+shortD(d.start)+' – '+shortD(d.end)+'</td></tr>';
  });
  document.getElementById('rollTbl').innerHTML=o;
})();

/* ---------- ATTAINMENT BARS ---------- */
(function(){
  const ks=['WTD','MTD','QTD','YTD'];
  const W=1080,rowH=46,H=ks.length*rowH+16,labW=60,valW=210;
  const iw=W-labW-valW-24;
  let o='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  ks.forEach((k,i)=>{
    const d=D.periods[k], p=pct(d.actual,d.goal);
    const scale=Math.max(d.actual, d.goal||0)*1.06||1;
    const y=i*rowH+8, bh=20;
    o+='<text x="0" y="'+(y+15)+'" font-size="12" font-weight="700" fill="var(--txt)">'+k+'</text>';
    o+='<rect x="'+labW+'" y="'+y+'" width="'+iw+'" height="'+bh+'" rx="4" fill="rgba(255,255,255,.04)"/>';
    o+='<rect x="'+labW+'" y="'+y+'" width="'+(iw*d.actual/scale).toFixed(1)+'" height="'+bh+'" rx="4" fill="var(--accent)" opacity=".9"/>';
    if(d.goal!=null){
      const gx=labW+iw*d.goal/scale;
      o+='<line x1="'+gx.toFixed(1)+'" x2="'+gx.toFixed(1)+'" y1="'+(y-4)+'" y2="'+(y+bh+4)+'" stroke="var(--txt)" stroke-width="2"/>';
      o+='<text x="'+gx.toFixed(1)+'" y="'+(y+bh+16)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">goal '+int(d.goal)+'</text>';
    }
    o+='<text x="'+(labW+iw+10)+'" y="'+(y+15)+'" font-size="13" font-weight="700" fill="var(--txt)">'+int(d.actual)+' jobs</text>';
    o+='<text x="'+W+'" y="'+(y+15)+'" text-anchor="end" font-size="13" font-weight="700" fill="'+attColor(p)+'">'+fp(p)+' of goal</text>';
  });
  o+='</svg>';
  document.getElementById('attain').innerHTML=o;
})();

/* ---------- MONTHLY ---------- */
(function(){
  const ms=Object.keys(D.monthly).sort();
  const curM=D.TODAY.slice(0,7);
  const W=1080,H=290,pad={t:26,r:14,b:46,l:44};
  const max=Math.max(...ms.map(m=>Math.max(D.monthly[m], D.monthlyGoal[m]||0)))*1.16;
  const iw=W-pad.l-pad.r, bw=iw/ms.length, bar=Math.min(bw*0.66,46);
  const yy=v=>pad.t+(H-pad.t-pad.b)*(1-v/max);
  let o='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  o+='<defs><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'+
     '<rect width="6" height="6" fill="var(--accent)" opacity=".35"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--accent)" stroke-width="3"/></pattern></defs>';
  [0,.25,.5,.75,1].forEach(f=>{const v=max*f;
    o+='<line x1="'+pad.l+'" x2="'+(W-pad.r)+'" y1="'+yy(v).toFixed(1)+'" y2="'+yy(v).toFixed(1)+'" stroke="var(--line)" stroke-width="'+(f===0?1:.6)+'" opacity="'+(f===0?1:.55)+'"/>';
    o+='<text x="'+(pad.l-7)+'" y="'+(yy(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--dim)">'+Math.round(v)+'</text>';});
  ms.forEach((m,i)=>{
    const x=pad.l+i*bw+(bw-bar)/2, yr=m.slice(0,4), cur=m===curM;
    const fill = cur ? 'url(#hatch)' : (yr==='2026' ? 'var(--accent)' : '#5b7fa8');
    const v=D.monthly[m], h=Math.max(H-pad.b-yy(v),0);
    o+='<rect x="'+x.toFixed(1)+'" y="'+yy(v).toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+fill+'" '+(cur?'stroke="var(--accent)" stroke-width="1"':'')+'/>';
    o+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(yy(v)-5).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="var(--muted)">'+v+'</text>';
    const g=D.monthlyGoal[m];
    if(g!=null){
      o+='<line x1="'+(x-3).toFixed(1)+'" x2="'+(x+bar+3).toFixed(1)+'" y1="'+yy(g).toFixed(1)+'" y2="'+yy(g).toFixed(1)+'" stroke="var(--txt)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".85"/>';
    }
    o+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(H-pad.b+14)+'" text-anchor="middle" font-size="9" fill="var(--dim)">'+MON[+m.slice(5,7)-1]+'</text>';
    if(m.slice(5,7)==='01'||i===0) o+='<text x="'+(x+bar/2).toFixed(1)+'" y="'+(H-pad.b+26)+'" text-anchor="middle" font-size="9" font-weight="700" fill="var(--muted)">'+yr+'</text>';
  });
  o+='</svg>';
  document.getElementById('monthly').innerHTML=o;
})();

/* ---------- WEEK STRIP ---------- */
(function(){
  const w=D.weekDaily;
  let o='<table><tr><th>Day</th><th style="text-align:right">Jobs</th><th style="text-align:right">Goal</th><th style="text-align:right">vs Goal</th></tr>';
  w.forEach(d=>{
    const pend=d.date>D.dataAsOf;
    const p=pend?null:pct(d.count,d.goal), isY=d.date===D.yest.date;
    o+='<tr'+(isY?' style="background:var(--accent-soft)"':'')+'><td>'+(isY?'<b>':'')+DOW[d.dow]+' '+shortD(d.date)+(isY?'</b>':'')+'</td>'+
       '<td class="n"'+(pend?' style="color:var(--dim)"':'')+'>'+(isY?'<b>':'')+(pend?'—':d.count)+(isY?'</b>':'')+'</td>'+
       '<td class="n" style="color:var(--muted)">'+(d.goal==null?'—':int(d.goal))+'</td>'+
       '<td class="n '+attClass(p)+'"><b>'+(pend?'<span style="color:var(--dim);font-weight:400">awaiting data</span>':(d.goal==null?'no goal':fp(p)))+'</b></td></tr>';
  });
  o+='</table>';
  document.getElementById('week').innerHTML=o;
})();

/* ---------- FOOTER ---------- */
document.getElementById('foot').innerHTML=
 'Source — bookings: <b>Booking PBI 4DX.xlsx</b> (Sheet1, count of rows by <b>Created Date</b>); goal: <b>CBD 2026 Revenue Budget.xlsx</b> → Daily Goals → <b>Booked Jobs Goal</b>. SharePoint / comfortbydesign.com.<br>'+
 'Yesterday = the prior calendar day ('+nice(D.yest.date)+'); its last-year comparison uses a 364-day shift ('+nice(D.yest.lyDate)+') so the weekday matches.<br>'+
