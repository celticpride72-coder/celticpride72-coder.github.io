 .kpi .val{font-size:25px;font-weight:750;margin-top:5px}.kpi .foot{font-size:11.5px;color:var(--dim);margin-top:4px}
 .panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px;margin:14px 0}
 .panel h3{margin:0 0 12px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
 .bar-row{display:grid;grid-template-columns:120px 1fr 96px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
 .bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:15px;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px}.bar-row .amt{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:13px}

 td.g{color:var(--good)}td.a{color:var(--warn)}td.b{color:var(--bad)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 .note{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
 @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
