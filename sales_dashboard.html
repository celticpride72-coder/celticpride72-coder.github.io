<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBD Sales Dashboard</title>
<style>
:root{
  --bg:#0f1419; --panel:#171d26; --panel2:#1d2530; --line:#2a3441;
  --txt:#e8edf4; --muted:#8b98a9; --accent:#4da3ff;
  --green:#3ddc84; --amber:#ffc861; --red:#ff6b6b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:28px 22px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-bottom:26px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:34px 0 14px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 15px}
.card .label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.card .range{font-size:10.5px;color:#66738a;margin-top:2px}
.card .val{font-size:25px;font-weight:700;margin:11px 0 12px;letter-spacing:-.02em}
.metric{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;padding:4px 0;border-top:1px solid var(--line)}
.metric span:first-child{color:var(--muted)}
.metric b{font-weight:700;font-variant-numeric:tabular-nums}
.g{color:var(--green)}.a{color:var(--amber)}.r{color:var(--red)}.n{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{text-align:right;padding:10px 13px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--panel2);font-weight:600}
th:first-child,td:first-child{text-align:left}
td{padding:10px 13px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child{font-weight:600}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.bars{display:flex;align-items:flex-end;gap:5px;height:230px;padding-top:10px}
.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.bar{width:100%;background:linear-gradient(180deg,#4da3ff,#2b6fb8);border-radius:4px 4px 0 0;position:relative}
.bar.cur{background:repeating-linear-gradient(45deg,#4da3ff,#4da3ff 5px,#2b6fb8 5px,#2b6fb8 10px)}
.gtick{position:absolute;left:0;right:0;border-top:2px dashed var(--amber);z-index:2}
.blab{font-size:9px;color:var(--muted);margin-top:6px;white-space:nowrap;transform:rotate(-60deg);transform-origin:center;height:34px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 9px;text-align:center}
.day .d{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .v{font-size:15px;font-weight:700;margin-top:6px}
.day.future{opacity:.35}
.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.legend{font-size:11.5px;color:var(--muted);margin-top:9px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Comfort By Design — Sales Dashboard</h1>
<div class="sub" id="sub"></div>

<h2>Period to date</h2>
<div class="cards" id="kpiCards"></div>

<h2>Rolling windows <span style="text-transform:none;letter-spacing:0">(anchored at data-as-of)</span></h2>
<div class="cards" id="rollCards"></div>

<h2>Attainment to date</h2>
<table id="attTable"></table>

<h2>Monthly trend — sold estimates</h2>
<div class="chart">
  <div class="bars" id="bars"></div>
  <div class="legend">Dashed amber tick = 2026 monthly Sales Goal. Hatched bar = current (partial) month.</div>
</div>

<h2>This week (Monday start)</h2>
<div class="week" id="week"></div>

<h2>Additional data — YTD 2026 breakdowns</h2>
<div class="grid2">
  <table id="tBU"></table>
  <table id="tRep"></table>
  <table id="tLead"></table>
</div>

<footer id="foot"></footer>

<script>
const D = {
  today: "2026-08-12",
  dataAsOf: "2026-08-11",
  kpi:{yesterday:26090.70, wtd:40559.70, mtd:593273.98, qtd:1545810.36, ytd:5784054.02},
  goal:{yesterday:40000, wtd:80000, mtd:280000, qtd:1181259.35, ytd:5982161.42},
  budget:{yesterday:37530.19, wtd:75060.38, mtd:262711.33, qtd:1141713.38, ytd:5512485.82},
  lastYear:{yesterday:16516, wtd:21984, mtd:198653, qtd:916710.05, ytd:4604605.27},
  ranges:{yesterday:["2026-08-11","2026-08-11"],wtd:["2026-08-10","2026-08-12"],mtd:["2026-08-01","2026-08-12"],qtd:["2026-07-01","2026-08-12"],ytd:["2026-01-01","2026-08-12"]},
  trailing:{
    d30:{actual:1218195.12,goal:894495.01,budget:862030.91,lastYear:678307.15,range:["2026-07-13","2026-08-11"]},
    d60:{actual:2038769.27,goal:1646995.40,budget:1583272.16,lastYear:1582822.87,range:["2026-06-13","2026-08-11"]},
    d90:{actual:3138450.21,goal:2504258.79,budget:2387682.07,lastYear:2153239.32,range:["2026-05-14","2026-08-11"]},
    d180:{actual:4634918.45,goal:4878811.42,budget:4510329.92,lastYear:3862837.11,range:["2026-02-13","2026-08-11"]},
    d365:{actual:10046632.88,goal:null,budget:null,lastYear:7146537.96,range:["2025-08-12","2026-08-11"]}
  },
  monthly:[["2025-01",487213,null],["2025-02",475289,null],["2025-03",495622,null],["2025-04",673500,null],["2025-05",660351,null],["2025-06",855181,null],["2025-07",729569,null],["2025-08",568014,null],["2025-09",1047646,null],["2025-10",1059139,null],["2025-11",888977,null],["2025-12",910168,null],["2026-01",858925,760000],["2026-02",632359,763000],["2026-03",446246,741053],["2026-04",493484,830000],["2026-05",873503,853000],["2026-06",933727,853849],["2026-07",952536,901259],["2026-08",593274,840000]],
  weekDaily:[{date:"2026-08-10",value:14469},{date:"2026-08-11",value:26090.70},{date:"2026-08-12",value:0}],
  byBU:[["HVAC-Sales-CBD",3188217.07],["FIRE-Sales-CBD",1159084.48],["HVAC-Sales-Com-CBD",732581.26],["FIRE-Sales-Com-CBD",704171.21]],
  byRep:[["Aaron Fischer",3701869.22],["Noah Meshak",1979665.43],["Michael K",65756.22],["Lee P",31498.88],["Collin Lieffort",5185.27],["Kurtis K",79]],
  byLead:[["(direct / no lead job)",3580558.55],["HVAC Repair Aged",949783.54],["HVAC Repair",463230.71],["HVAC Membership Visit Aged",281743.57],["FIRE Repair",137946.50],["FIRE Inspection",96815],["HVAC Membership Visit",94851.16],["HVAC System Check Aged",93521.18],["HVAC System Check",71306.64],["PLMB Repair",11627.17],["FIRE Membership Visit",2670]]
};

const usd=v=>"$"+Math.round(v).toLocaleString();
const usdK=v=> v>=1e6 ? "$"+(v/1e6).toFixed(2)+"M" : "$"+Math.round(v/1000)+"k";
const cls=p=> p>=100?"g":(p>=95?"a":"r");
function att(a,t){ if(t==null||t===0) return {t:"—",c:"n"}; const p=a/t*100; return {t:p.toFixed(1)+"%",c:cls(p)}; }
function yoy(a,l){ if(l==null||l===0) return {t:"—",c:"n"}; const p=(a-l)/l*100; return {t:(p>=0?"+":"")+p.toFixed(1)+"%",c:p>=0?"g":"r"}; }
const fmtR=r=>{const f=s=>{const p=s.split("-");return p[1]+"/"+p[2];}; return r[0]===r[1]?f(r[0]):f(r[0])+" – "+f(r[1]);};

document.getElementById("sub").textContent =
  "Sold estimates vs Goal, Budget and same period last year · Data as of "+D.dataAsOf+" · Generated "+D.today;

// KPI cards
const periods=[["yesterday","Yesterday"],["wtd","Week to date"],["mtd","Month to date"],["qtd","Quarter to date"],["ytd","Year to date"]];
document.getElementById("kpiCards").innerHTML = periods.map(([k,lab])=>{
  const g=att(D.kpi[k],D.goal[k]), b=att(D.kpi[k],D.budget[k]), y=yoy(D.kpi[k],D.lastYear[k]);
  return `<div class="card"><div class="label">${lab}</div><div class="range">${fmtR(D.ranges[k])}</div>
    <div class="val">${usd(D.kpi[k])}</div>
    <div class="metric"><span>vs Goal</span><b class="${g.c}">${g.t}</b></div>
    <div class="metric"><span>vs Budget</span><b class="${b.c}">${b.t}</b></div>
    <div class="metric"><span>vs Last Yr</span><b class="${y.c}">${y.t}</b></div></div>`;
}).join("");

// Rolling cards
const rolls=[["d30","Last 30 days"],["d60","Last 60 days"],["d90","Last 90 days"],["d180","Last 180 days"],["d365","Last 365 days"]];
document.getElementById("rollCards").innerHTML = rolls.map(([k,lab])=>{
  const t=D.trailing[k];
  const g=att(t.actual,t.goal), b=att(t.actual,t.budget), y=yoy(t.actual,t.lastYear);
  return `<div class="card"><div class="label">${lab}</div><div class="range">${fmtR(t.range)}</div>
    <div class="val">${usd(t.actual)}</div>
    <div class="metric"><span>vs Goal</span><b class="${g.c}">${g.t}</b></div>
    <div class="metric"><span>vs Budget</span><b class="${b.c}">${b.t}</b></div>
    <div class="metric"><span>vs Last Yr</span><b class="${y.c}">${y.t}</b></div></div>`;
}).join("");

// Attainment table
let rows = periods.map(([k,lab])=>({lab,a:D.kpi[k],g:D.goal[k],b:D.budget[k],l:D.lastYear[k]}))
  .concat(rolls.map(([k,lab])=>{const t=D.trailing[k];return {lab,a:t.actual,g:t.goal,b:t.budget,l:t.lastYear};}));
document.getElementById("attTable").innerHTML =
  "<tr><th>Period</th><th>Actual</th><th>Goal</th><th>vs Goal</th><th>Budget</th><th>vs Budget</th><th>Last Year</th><th>YoY</th></tr>"+
  rows.map(r=>{const g=att(r.a,r.g),b=att(r.a,r.b),y=yoy(r.a,r.l);
    return `<tr><td>${r.lab}</td><td>${usd(r.a)}</td><td>${r.g==null?"—":usd(r.g)}</td><td class="${g.c}">${g.t}</td>
    <td>${r.b==null?"—":usd(r.b)}</td><td class="${b.c}">${b.t}</td><td>${usd(r.l)}</td><td class="${y.c}">${y.t}</td></tr>`;}).join("");

// Monthly bars
const maxV = Math.max(...D.monthly.map(m=>Math.max(m[1], m[2]||0)))*1.08;
document.getElementById("bars").innerHTML = D.monthly.map(([m,v,g])=>{
  const h=(v/maxV*100).toFixed(1), cur = m===D.today.slice(0,7);
  const tick = g!=null ? `<div class="gtick" style="bottom:${(g/maxV*100).toFixed(1)}%"></div>` : "";
  return `<div class="bcol" title="${m}: ${usd(v)}${g?' | goal '+usd(g):''}">${tick}
    <div class="bar${cur?' cur':''}" style="height:${h}%"></div>
    <div class="blab">${m}</div></div>`;
}).join("");

// Week strip
const names=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const start=D.weekDaily[0].date, map={}; D.weekDaily.forEach(d=>map[d.date]=d.value);
const sp=start.split("-").map(Number); const s0=new Date(sp[0],sp[1]-1,sp[2]);
document.getElementById("week").innerHTML = names.map((n,i)=>{
  const d=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+i);
  const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const has=k in map;
  return `<div class="day${has?"":" future"}"><div class="d">${n} ${d.getMonth()+1}/${d.getDate()}</div>
    <div class="v">${has?usdK(map[k]):"—"}</div></div>`;
}).join("");

function bd(id,title,data){
  const tot=data.reduce((a,b)=>a+b[1],0);
  document.getElementById(id).innerHTML =
    `<tr><th>${title}</th><th>YTD 2026</th><th>%</th></tr>`+
    data.map(([n,v])=>`<tr><td>${n}</td><td>${usd(v)}</td><td>${(v/tot*100).toFixed(1)}%</td></tr>`).join("")+
    `<tr><td><b>Total</b></td><td><b>${usd(tot)}</b></td><td>100.0%</td></tr>`;
}
bd("tBU","Business unit",D.byBU);
bd("tRep","Sales rep",D.byRep);
bd("tLead","Lead source",D.byLead);

document.getElementById("foot").innerHTML =
  "<b>Sales</b> = sum of Estimates Subtotal dated by Sold On for the four sales business units: HVAC-Sales-CBD, FIRE-Sales-CBD, HVAC-Sales-Com-CBD, FIRE-Sales-Com-CBD.<br>"+
  "Goal = <i>Sales Goal</i>; Budget = <i>Install(HVAC/FP) Goal</i> from CBD 2026 Revenue Budget → Daily Goals. Goal/Budget/Last-Year are anchored to the actuals' last populated Sold On date ("+D.dataAsOf+").<br>"+
  "Weeks start Monday. Attainment: <span class='g'>green ≥100%</span>, <span class='a'>amber 95–99.9%</span>, <span class='r'>red &lt;95%</span>. YoY: <span class='g'>green ≥0</span>, <span class='r'>red &lt;0</span>. \"—\" = no target available (2025 Daily Goals are blank, so Last 365 shows YoY only).";
</script>
</body>
</html>
