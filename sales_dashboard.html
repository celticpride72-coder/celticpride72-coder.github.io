<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBD Sales Dashboard</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b23; --panel2:#1c222c; --line:#2a3140;
  --txt:#e6edf3; --muted:#8b98a9; --accent:#4c8dff;
  --green:#2ea043; --amber:#d29922; --red:#da3633;
  --greenb:rgba(46,160,67,.14); --amberb:rgba(210,153,34,.14); --redb:rgba(218,54,51,.14);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:22px 26px 60px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);margin:30px 0 12px;font-weight:600}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.card .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
.card .rng{font-size:10.5px;color:#61708a;margin-top:2px}
.card .val{font-size:25px;font-weight:700;margin:9px 0 10px;letter-spacing:-.5px}
.metrics{display:flex;flex-direction:column;gap:5px}
.m{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.m span:first-child{color:var(--muted)}
.pill{font-weight:700;padding:1.5px 7px;border-radius:5px;font-size:11.5px}
.g{color:var(--green);background:var(--greenb)}
.a{color:var(--amber);background:var(--amberb)}
.r{color:var(--red);background:var(--redb)}
.n{color:var(--muted);background:rgba(139,152,169,.12)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 12px;text-align:right;font-size:12.5px;border-bottom:1px solid var(--line)}
th{background:var(--panel2);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
footer{margin-top:34px;color:#61708a;font-size:11.5px;border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wk .d{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.wk .d .dn{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.wk .d .dv{font-size:15px;font-weight:700;margin-top:5px}
.wk .d .dg{font-size:10px;color:#61708a;margin-top:2px}
.wk .d.fut{opacity:.38}
</style>
</head>
<body>
<h1>Comfort By Design &mdash; Sales Dashboard</h1>
<div class="sub" id="asof"></div>

<h2>Period to date</h2>
<div class="cards" id="kpiCards"></div>

<h2>Rolling windows</h2>
<div class="cards" id="rollCards"></div>

<h2>Attainment to date</h2>
<table id="attTable"></table>

<h2>Monthly trend</h2>
<div class="chart"><canvas id="monthly" height="150"></canvas></div>

<h2>This week (Monday start)</h2>
<div class="wk" id="week"></div>

<h2>Additional data &mdash; YTD 2026 breakdowns</h2>
<div class="grid3">
  <div><table id="tBU"></table></div>
  <div><table id="tRep"></table></div>
  <div><table id="tLead"></table></div>
</div>

<footer id="foot"></footer>

<script>
const DATA = {
  dataAsOf: "2026-08-12",
  today: "2026-08-13",
  periods: [
    {k:"yesterday", label:"Yesterday", range:["2026-08-12","2026-08-12"], actual:27725.50,  goal:40000,            budget:37530.19047619047,  lastYear:54771.35},
    {k:"wtd",       label:"WTD",       range:["2026-08-10","2026-08-13"], actual:68285.20,  goal:120000,           budget:112590.57142857142, lastYear:76755.35},
    {k:"mtd",       label:"MTD",       range:["2026-08-01","2026-08-13"], actual:620999.48, goal:320000,           budget:300241.5238095238,  lastYear:253424.35},
    {k:"qtd",       label:"QTD",       range:["2026-07-01","2026-08-13"], actual:1573535.86,goal:1221259.3460869566,budget:1179243.5655486544,lastYear:971481.40},
    {k:"ytd",       label:"YTD",       range:["2026-01-01","2026-08-13"], actual:5811779.52,goal:6022161.417665898, budget:5550016.005548647, lastYear:4659376.62}
  ],
  rolling: [
    {label:"Last 30 days",  range:["2026-07-14","2026-08-12"], actual:1195052.82, goal:893528.6747826088,  budget:859606.4594616981,  lastYear:710649.96},
    {label:"Last 60 days",  range:["2026-06-14","2026-08-12"], actual:2066494.77, goal:1686995.404268774,  budget:1620802.3510031996, lastYear:1637594.22},
    {label:"Last 90 days",  range:["2026-05-15","2026-08-12"], actual:3125597.12, goal:2501608.786086954,  budget:2385535.5055486523, lastYear:2191672.67},
    {label:"Last 180 days", range:["2026-02-14","2026-08-12"], actual:4638477.65, goal:4880661.417665904,  budget:4511082.005548655,  lastYear:3897964.27},
    {label:"Last 365 days", range:["2025-08-13","2026-08-12"], actual:10057842.38,goal:null,               budget:null,               lastYear:7147978.94}
  ],
  monthly: {"2024-01":505499.09,"2024-02":279319.95,"2024-03":326822.98,"2024-04":283537.71,"2024-05":572078.31,"2024-06":530314.93,"2024-07":590277.14,"2024-08":429146.31,"2024-09":756209.92,"2024-10":561904.93,"2024-11":452581.50,"2024-12":497865.81,"2025-01":487212.78,"2025-02":475288.64,"2025-03":495621.85,"2025-04":673499.71,"2025-05":660351.22,"2025-06":855181.12,"2025-07":729568.67,"2025-08":568014.04,"2025-09":1047646.03,"2025-10":1059139.44,"2025-11":888977.05,"2025-12":910167.58,"2026-01":858925.30,"2026-02":632359.01,"2026-03":446245.73,"2026-04":493483.67,"2026-05":873502.81,"2026-06":933727.14,"2026-07":952536.38,"2026-08":620999.48},
  monthlyGoal: {"2026-01":760000.00,"2026-02":763000,"2026-03":741052.63,"2026-04":830000.00,"2026-05":853000,"2026-06":853849.44,"2026-07":901259.35,"2026-08":840000},
  weekDaily: [
    {date:"2026-08-10", day:"Mon", value:14469.00,  goal:40000},
    {date:"2026-08-11", day:"Tue", value:26090.70,  goal:40000},
    {date:"2026-08-12", day:"Wed", value:27725.50,  goal:40000},
    {date:"2026-08-13", day:"Thu", value:0,         goal:40000, future:true},
    {date:"2026-08-14", day:"Fri", value:0,         goal:40000, future:true},
    {date:"2026-08-15", day:"Sat", value:0,         goal:0,     future:true},
    {date:"2026-08-16", day:"Sun", value:0,         goal:0,     future:true}
  ],
  byBU:   [["HVAC-Sales-CBD",3189217],["FIRE-Sales-CBD",1168383],["HVAC-Sales-Com-CBD",735302],["FIRE-Sales-Com-CBD",718877]],
  byRep:  [["Aaron Fischer",3720296],["Noah Fischer",1988964],["Michael K",65756],["Lee P",31499],["Collin Lieffort",5185],["Kurtis K",79]],
  byLead: [["Direct / self-generated",3605563],["HVAC-Service-CBD",1589087],["HVAC-Scheduled Service-CBD",349823],["FIRE-Service-CBD",264637],["FIRE-Scheduled Service-CBD",2670]]
};

const fmt = n => "$" + Math.round(n).toLocaleString("en-US");
const fmtK = n => n >= 1e6 ? "$" + (n/1e6).toFixed(2) + "M" : "$" + Math.round(n/1000) + "k";
const dfmt = s => { const p = s.split("-"); return p[1].replace(/^0/,"") + "/" + p[2].replace(/^0/,"") + "/" + p[0].slice(2); };

function attClass(p){ if(p===null) return "n"; if(p>=100) return "g"; if(p>=95) return "a"; return "r"; }
function pct(a,t){ if(t===null||t===undefined||t===0) return null; return a/t*100; }
function yoy(a,l){ if(l===null||l===undefined||l===0) return null; return (a-l)/l*100; }
function pillPct(v,cls){ return v===null ? '<span class="pill n">&mdash;</span>' : '<span class="pill '+cls+'">'+v.toFixed(1)+'%</span>'; }
function pillYoY(v){ if(v===null) return '<span class="pill n">&mdash;</span>';
  return '<span class="pill '+(v>=0?"g":"r")+'">'+(v>=0?"+":"")+v.toFixed(1)+'%</span>'; }

document.getElementById("asof").textContent =
  "Sold estimates vs Goal, Budget and same period last year  ·  Data as of " + dfmt(DATA.dataAsOf) + "  ·  Generated " + dfmt(DATA.today);

function cardHTML(o){
  const g = pct(o.actual, o.goal), b = pct(o.actual, o.budget), y = yoy(o.actual, o.lastYear);
  return '<div class="card">'
    + '<div class="lbl">' + o.label + '</div>'
    + '<div class="rng">' + dfmt(o.range[0]) + (o.range[0]===o.range[1] ? '' : ' – ' + dfmt(o.range[1])) + '</div>'
    + '<div class="val">' + fmt(o.actual) + '</div>'
    + '<div class="metrics">'
    +   '<div class="m"><span>vs Goal</span>' + pillPct(g, attClass(g)) + '</div>'
    +   '<div class="m"><span>vs Budget</span>' + pillPct(b, attClass(b)) + '</div>'
    +   '<div class="m"><span>vs Last Yr</span>' + pillYoY(y) + '</div>'
    + '</div></div>';
}
document.getElementById("kpiCards").innerHTML  = DATA.periods.map(cardHTML).join("");
document.getElementById("rollCards").innerHTML = DATA.rolling.map(cardHTML).join("");

// Attainment table
(function(){
  const rows = DATA.periods.concat(DATA.rolling);
  let h = '<tr><th>Period</th><th>Actual</th><th>Goal</th><th>% Goal</th><th>Budget</th><th>% Budget</th><th>Last Year</th><th>YoY</th></tr>';
  rows.forEach(o=>{
    const g = pct(o.actual,o.goal), b = pct(o.actual,o.budget), y = yoy(o.actual,o.lastYear);
    h += '<tr><td>'+o.label+'</td><td>'+fmt(o.actual)+'</td>'
      + '<td>'+(o.goal===null?'&mdash;':fmt(o.goal))+'</td><td>'+pillPct(g,attClass(g))+'</td>'
      + '<td>'+(o.budget===null?'&mdash;':fmt(o.budget))+'</td><td>'+pillPct(b,attClass(b))+'</td>'
      + '<td>'+fmt(o.lastYear)+'</td><td>'+pillYoY(y)+'</td></tr>';
  });
  document.getElementById("attTable").innerHTML = h;
})();

// Week strip
document.getElementById("week").innerHTML = DATA.weekDaily.map(d=>
  '<div class="d'+(d.future?' fut':'')+'"><div class="dn">'+d.day+' '+dfmt(d.date).split("/").slice(0,2).join("/")+'</div>'
  + '<div class="dv">'+fmt(d.value)+'</div>'
  + '<div class="dg">'+(d.goal?'goal '+fmt(d.goal):'&mdash;')+'</div></div>').join("");

// Breakdown tables
function bt(el,title,rows){
  const tot = rows.reduce((s,r)=>s+r[1],0);
  let h='<tr><th>'+title+'</th><th>YTD 2026</th><th>%</th></tr>';
  rows.forEach(r=>{ h+='<tr><td>'+r[0]+'</td><td>'+fmt(r[1])+'</td><td>'+(r[1]/tot*100).toFixed(1)+'%</td></tr>'; });
  h+='<tr><td><b>Total</b></td><td><b>'+fmt(tot)+'</b></td><td><b>100.0%</b></td></tr>';
  document.getElementById(el).innerHTML=h;
}
bt("tBU","Business unit",DATA.byBU);
bt("tRep","Sales rep",DATA.byRep);
bt("tLead","Lead source",DATA.byLead);

// Monthly bar chart (canvas, no deps)
(function(){
  const c = document.getElementById("monthly");
  const keys = Object.keys(DATA.monthly).sort();
  const dpr = window.devicePixelRatio || 1;
  function draw(){
    const W = c.parentNode.clientWidth - 32, H = 300;
    c.width = W*dpr; c.height = H*dpr; c.style.width = W+"px"; c.style.height = H+"px";
    const x = c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
    const padL=62, padR=10, padT=14, padB=42;
    const cw = W-padL-padR, ch = H-padT-padB;
    const vals = keys.map(k=>DATA.monthly[k]);
    const goals = keys.map(k=>DATA.monthlyGoal[k]||null);
    const max = Math.max.apply(null, vals.concat(goals.filter(v=>v!==null))) * 1.1;
    // gridlines
    x.strokeStyle="#2a3140"; x.fillStyle="#8b98a9"; x.font="10px sans-serif"; x.lineWidth=1;
    for(let i=0;i<=4;i++){
      const y = padT + ch - (ch*i/4);
      x.beginPath(); x.moveTo(padL,y); x.lineTo(W-padR,y); x.stroke();
      x.textAlign="right"; x.fillText(fmtK(max*i/4), padL-8, y+3);
    }
    const bw = cw/keys.length;
    keys.forEach((k,i)=>{
      const v = DATA.monthly[k];
      const bh = ch*v/max;
      const bx = padL + i*bw + bw*0.16, by = padT+ch-bh, bwid = bw*0.68;
      const cur = (k === DATA.today.slice(0,7));
      const y26 = k.slice(0,4)==="2026";
      x.fillStyle = y26 ? "#4c8dff" : "#33405a";
      x.fillRect(bx,by,bwid,bh);
      if(cur){ // hatch current month
        x.save(); x.beginPath(); x.rect(bx,by,bwid,bh); x.clip();
        x.strokeStyle="rgba(255,255,255,.45)"; x.lineWidth=1.5;
        for(let o=-bh; o<bwid+bh; o+=7){ x.beginPath(); x.moveTo(bx+o,by+bh); x.lineTo(bx+o+bh,by); x.stroke(); }
        x.restore();
      }
      const g = DATA.monthlyGoal[k];
      if(g){ // dashed goal tick
        const gy = padT+ch-ch*g/max;
        x.save(); x.setLineDash([4,3]); x.strokeStyle="#d29922"; x.lineWidth=1.6;
        x.beginPath(); x.moveTo(bx-bw*0.06, gy); x.lineTo(bx+bwid+bw*0.06, gy); x.stroke(); x.restore();
      }
      if(i%2===0 || y26){
        x.fillStyle="#61708a"; x.font="9px sans-serif"; x.textAlign="center"; x.save();
        x.translate(bx+bwid/2, H-padB+13); x.rotate(-Math.PI/4);
        x.fillText(k, 0, 0); x.restore();
      }
    });
    // legend
    x.textAlign="left"; x.font="10.5px sans-serif";
    x.fillStyle="#4c8dff"; x.fillRect(padL,H-14,10,10); x.fillStyle="#8b98a9"; x.fillText("2026 sold",padL+15,H-5);
    x.fillStyle="#33405a"; x.fillRect(padL+80,H-14,10,10); x.fillStyle="#8b98a9"; x.fillText("prior years",padL+95,H-5);
    x.strokeStyle="#d29922"; x.save(); x.setLineDash([4,3]); x.lineWidth=1.6;
    x.beginPath(); x.moveTo(padL+180,H-9); x.lineTo(padL+195,H-9); x.stroke(); x.restore();
    x.fillStyle="#8b98a9"; x.fillText("2026 Sales Goal",padL+200,H-5);
  }
  draw(); window.addEventListener("resize",draw);
})();

document.getElementById("foot").innerHTML =
  "<b>Sales</b> = sum of \"Estimates Subtotal\" dated by \"Sold On\" for the four sales business units: HVAC-Sales-CBD, FIRE-Sales-CBD, HVAC-Sales-Com-CBD, FIRE-Sales-Com-CBD.<br>"
  + "Goal = \"Sales Goal\" and Budget = \"Install(HVAC/FP) Goal\" from the CBD 2026 Revenue Budget → Daily Goals tab. Targets and last-year comparisons are anchored to the last populated Sold On date (" + dfmt(DATA.dataAsOf) + ").<br>"
  + "Weeks start Monday. Last 365 days shows no Goal/Budget because 2025 daily goals are not populated. Attainment colours: green ≥100%, amber 95–99.9%, red &lt;95%. YoY: green ≥0%, red &lt;0%.<br>"
  + "Sources: Sales4dx.xlsx (Sheet1) and CBD 2026 Revenue Budget.xlsx (Daily Goals), SharePoint / OneDrive.";
</script>
</body>
</html>
