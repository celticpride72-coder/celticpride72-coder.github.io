<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Company Flash — Comfort by Design</title>
<style>
 :root{--bg:#0e1116;--panel:#161b22;--panel2:#1b212b;--edge:#232a34;--ink:#e7edf5;--dim:#93a1b3;--muted:#7c8a9c;--accent:#4c8dff;--accent2:#2bd4a7;--good:#2bd4a7;--warn:#f5c451;--bad:#f8736a}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .wrap{max-width:1480px;margin:0 auto;padding:22px 22px 70px}h1{margin:0;font-size:26px}
 .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);margin-right:8px;vertical-align:middle}
 .sub{color:var(--dim);font-size:14px;margin-top:4px}
 .sec{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 2px 10px}
 .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
 .tile{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:14px;padding:18px 20px}
 .tile .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
 .tile .val{font-size:34px;font-weight:750;margin-top:8px;line-height:1.05}
 .tile .sec2{font-size:13px;color:var(--dim);margin-top:8px}
 .tile .src{font-size:11px;color:var(--muted);margin-top:10px}
 .tile.hero .val{color:var(--accent2)}
 .note{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.6}
 @media(max-width:1050px){.tiles{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
 <h1><span class="dot"></span>Daily Company Flash</h1>
 <div class="sub" id="sub"></div>

 <div class="sec">Production — completed work</div>
 <div class="tiles" id="prod"></div>
 <div class="sec">Efficiency &amp; pipeline</div>
 <div class="tiles" id="eff"></div>
 <div class="note" id="note"></div>
</div>
<script>
const F=/*DATA_START*/{"asOf":"2026-08-24","today":"2026-08-26","month":"August 2026","rev_mtd":679384,"rev_ytd":7358035,"jobs_mtd":577,"jobs_ytd":6621,"svc_mtd":91597,"svc_ytd":1244281,"inst_ytd":5994654,"inst_n":1034,"gp":49.6,"fcc":86,"ttiMed":13,"backlog":259090,"backlogN":13}/*DATA_END*/;
const REFRESHED=/*STAMP_START*/"Aug 26, 2026"/*STAMP_END*/;
const money=v=>(v||v===0)?"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0}):"—";
const moneyK=v=>v>=1000000?"$"+(v/1000000).toFixed(2)+"M":"$"+Math.round(v/1000)+"K";
function tile(o){return `<div class="tile${o.hero?' hero':''}"><div class="k">${o.k}</div><div class="val">${o.v}</div><div class="sec2">${o.s||""}</div><div class="src">${o.src||""}</div></div>`;}
document.getElementById("prod").innerHTML=[
 {k:"Revenue — "+F.month,v:moneyK(F.rev_mtd),s:F.jobs_mtd+" jobs completed MTD",src:"→ Revenue"},
 {k:"Revenue — 2026 YTD",v:moneyK(F.rev_ytd),s:F.jobs_ytd+" jobs YTD",src:"→ Revenue"},
 {k:"Install GP% — YTD",v:(F.gp==null?"—":F.gp+"%"),s:F.inst_n+" installs · "+moneyK(F.inst_ytd),src:"→ Gross Profit",hero:1},
 {k:"Service revenue — YTD",v:moneyK(F.svc_ytd),s:moneyK(F.svc_mtd)+" this month",src:"→ Service"}
].map(tile).join("");
document.getElementById("eff").innerHTML=[
 {k:"First-call complete — YTD",v:F.fcc+"%",s:"install & service",src:"→ Callbacks",hero:1},
 {k:"Install same-day %",v:'<span id="sameday">…</span>',s:'<span id="samedaySub">from adherence tracker</span>',src:"→ Adherence"},
 {k:"Median time to install",v:F.ttiMed+" days",s:"sold → completed",src:"→ Time to Install"},
 {k:"Scheduled backlog",v:moneyK(F.backlog),s:F.backlogN+" jobs waiting",src:"→ Sched. Installs"}
].map(tile).join("");
document.getElementById("sub").innerHTML="One-glance company pulse &nbsp;·&nbsp; data through "+F.asOf+" &nbsp;·&nbsp; updated "+REFRESHED;
document.getElementById("note").innerHTML="Figures are completed-work actuals from the shared workbooks (revenue = Jobs Total Revenue). Revenue-vs-goal, closing %, TGL sales, holds and NPS live on their own tabs — this page is the quick pulse; use the arrows as a guide to the full dashboards. Install same-day % is pulled live from the adherence ledger and fills in as jobs complete.";
// live same-day % from the adherence ledger
if(typeof fetch==="function"){
 fetch("installs_adherence_ledger.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{
   const el=document.getElementById("sameday"),sub=document.getElementById("samedaySub");if(!el)return;
   if(!j||!j.jobs){el.textContent="—";return;}
   // resolved = completed OR missed. A job that was scheduled and never completed is an
   // adherence failure and must stay in the denominator, otherwise this reads 100% forever.
   const R=j.jobs.filter(x=>x.status==="completed"||x.status==="missed");
   if(!R.length){el.textContent="—";sub.textContent="no completions logged yet";return;}
   const same=R.filter(x=>x.status==="completed"&&x.on_time).length;
   const miss=R.filter(x=>x.status==="missed").length;
   el.textContent=Math.round(same/R.length*100)+"%";
   sub.textContent=same+" of "+R.length+" on scheduled day"+(miss?" · "+miss+" never completed":"");
 }).catch(()=>{const el=document.getElementById("sameday");if(el)el.textContent="—";});
}
</script></body></html>
