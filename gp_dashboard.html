   r.items.push(j);
   tot.rev+=j[4];tot.gp+=j[5];tot.n++;
   var b=bu[j[2]]||(bu[j[2]]={rev:0,gp:0,n:0});b.rev+=j[4];b.gp+=j[5];b.n++;
 });
 var arr=Object.keys(rows).map(function(k){var r=rows[k];r.gpp=r.rev?r.gp/r.rev*100:0;r.soldU=uniq(r.sold);r.techU=uniq(r.tech);return r;});
 return {arr:arr,tot:tot,bu:bu};
}
function render(){
 var c=compute();
 // KPIs
 var t=c.tot, blended=t.rev?t.gp/t.rev*100:0, avg=t.n?t.gp/t.n:0;
 document.getElementById('kpis').innerHTML=
  kpi('Revenue',money(t.rev))+kpi('Gross Profit $',money(t.gp))+
  kpi('Blended GP %',pct(blended),'sm')+kpi('Jobs',t.n.toLocaleString())+
  kpi('Locations',c.arr.length.toLocaleString())+kpi('Avg GP $ / job',money(avg),'sm');
 // BU
 var order=['FR','FC','HR','HC'];
 document.getElementById('bu').innerHTML=order.map(function(b){
   var x=c.bu[b]||{rev:0,gp:0,n:0};var p=x.rev?x.gp/x.rev*100:0;
   return '<div class="bucard"><div class="t">'+BULAB[b]+'</div><div class="p"><span class="pill '+cls(p)+'">'+pct(p)+'</span></div>'+
     '<div class="m">'+money(x.gp)+' GP &middot; '+money(x.rev)+' rev &middot; '+x.n+' jobs</div></div>';
 }).join('');
 // table
 var arr=c.arr.filter(function(r){if(!search)return true;var s=search.toLowerCase();return r.name.toLowerCase().indexOf(s)>=0||r.loc.indexOf(s)>=0;});
 arr.sort(function(a,b){var v;if(sortK=='name')v=a.name.localeCompare(b.name);else if(sortK=='sold')v=(a.soldU.join()).localeCompare(b.soldU.join());else if(sortK=='tech')v=(a.techU.join()).localeCompare(b.techU.join());else v=a[sortK]-b[sortK];return v*sortDir;});
 document.getElementById('loccount').textContent=arr.length+' shown';
 var tb=document.getElementById('tb');tb.innerHTML='';
 arr.forEach(function(r,i){
   var tr=document.createElement('tr');tr.className='loc';tr.dataset.i=i;
   tr.innerHTML='<td><span class="chev">&#9654;</span> <b>'+r.loc+'</b> <span class="tw">'+esc(r.name)+'</span></td>'+
     '<td>'+r.jobs+'</td><td>'+money(r.rev)+'</td><td>'+money(r.gp)+'</td>'+
     '<td><span class="pill '+cls(r.gpp)+'">'+pct(r.gpp)+'</span></td>'+
     '<td class="tw">'+esc(r.soldU.join(', ')||'&mdash;')+'</td><td class="tw">'+esc(r.techU.join(', ')||'&mdash;')+'</td>';
   var det=document.createElement('tr');det.className='jobwrap';det.style.display='none';
   det.innerHTML='<td colspan="7">'+jobTable(r)+'</td>';
   tr.onclick=function(){var open=det.style.display!='none';det.style.display=open?'none':'';tr.classList.toggle('open',!open);};
   tb.appendChild(tr);tb.appendChild(det);
 });
}
function jobTable(r){
 var items=r.items.slice().sort(function(a,b){return b._d-a._d;});
 var rows=items.map(function(j){var p=j[4]?j[5]/j[4]*100:0;
   return '<tr><td>'+j[0]+'</td><td>'+j[1]+'</td><td>'+BUSHORT[j[2]]+'</td><td>'+money(j[4])+'</td><td>'+money(j[5])+'</td>'+
     '<td><span class="pill '+cls(p)+'">'+pct(p)+'</span></td><td>'+esc(j[6]||'&mdash;')+'</td><td>'+esc(j[7]||'&mdash;')+'</td></tr>';
 }).join('');
 return '<table class="jobtbl"><thead><tr><th style="text-align:left">Job #</th><th style="text-align:left">Completed</th><th style="text-align:left">Type</th><th>Revenue</th><th>GP $</th><th>GP %</th><th style="text-align:left">Sales</th><th style="text-align:left">Lead Tech</th></tr></thead><tbody>'+rows+'</tbody></table>';
}
function kpi(l,v,sm){return '<div class="kpi"><div class="lab">'+l+'</div><div class="val'+(sm?' sm':'')+'">'+v+'</div></div>';}
function esc(s){return (''+s).replace(/&(?!mdash;|amp;)/g,'&amp;').replace(/</g,'&lt;');}
// period buttons
var pc=document.getElementById('periods');
PERIODS.forEach(function(p){var b=document.createElement('button');b.className='pbtn'+(p.k==cur?' active':'');b.textContent=p.l;b.onclick=function(){cur=p.k;[].forEach.call(pc.children,function(x){x.classList.remove('active');});b.classList.add('active');render();};pc.appendChild(b);});
// sort headers
[].forEach.call(document.querySelectorAll('#tbl thead th'),function(th){th.onclick=function(){var k=th.dataset.k;if(sortK==k)sortDir*=-1;else{sortK=k;sortDir=(k=='name')?1:-1;}[].forEach.call(document.querySelectorAll('#tbl thead th'),function(x){x.classList.remove('s-asc','s-desc');});th.classList.add(sortDir>0?'s-asc':'s-desc');render();};});
document.getElementById('search').oninput=function(e){search=e.target.value;render();};
// subtitle
var maxd=JOBS.reduce(function(m,j){return j._d>m?j._d:m;},new Date(2000,0,1));
document.getElementById('sub').innerHTML='Completed install jobs, 2026 &middot; excludes jobs closed in the last 5 days &middot; data through '+(maxd.getMonth()+1)+'/'+maxd.getDate()+'/'+maxd.getFullYear()+' &middot; '+JOBS.length+' jobs';
document.getElementById('foot').innerHTML='<b>Scope:</b> Fireplace &amp; HVAC install business units only (FP Res/Com, HVAC Res/Com). <b>Gross Profit</b> = Jobs Gross Margin $ from the completed spreadsheet; <b>GP %</b> = revenue-weighted (Σ GP $ ÷ Σ Revenue). Rolling windows count backward from '+((TODAY.getMonth()+1)+'/'+TODAY.getDate()+'/'+TODAY.getFullYear())+'. Quarters and MTD are calendar 2026 (current quarter/month partial). GP % shading (red &lt;0, amber &lt;40, green &ge;40) is a visual guide only. Click any location to see its jobs.';
render();
</script></body></html>
