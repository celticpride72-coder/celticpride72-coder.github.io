<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time to Install & Backlog — Comfort by Design</title>
<style>
 :root{--bg:#0e1116;--panel:#161b22;--panel2:#1b212b;--edge:#232a34;--ink:#e7edf5;--dim:#93a1b3;--muted:#7c8a9c;--accent:#4c8dff;--accent2:#2bd4a7;--good:#2bd4a7;--warn:#f5c451;--bad:#f8736a;--hvac:#4c8dff;--fire:#ff7a59;--elec:#f5c451}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .wrap{max-width:1480px;margin:0 auto;padding:22px 22px 70px}h1{margin:0;font-size:26px}
 .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);margin-right:8px;vertical-align:middle}
 .sub{color:var(--dim);font-size:14px;margin-top:4px}
 .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}
 .kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:12px;padding:14px 16px}
 .kpi .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.kpi .val{font-size:25px;font-weight:750;margin-top:5px}.kpi .foot{font-size:11.5px;color:var(--dim);margin-top:4px}
 .kpi.hero .val{color:var(--accent2)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px}
 .panel h3{margin:0 0 12px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
 .bar-row{display:grid;grid-template-columns:120px 1fr 120px;align-items:center;gap:10px;margin:8px 0;font-size:14px}.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .track{height:15px;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px}.bar-row .amt{text-align:right;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
 table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--edge)}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
 .note{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
 @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
 <h1><span class="dot"></span>Time to Install &amp; Backlog</h1>
 <div class="sub" id="sub"></div>
 <div class="kpis" id="kpis"></div>
 <div class="grid2">
  <div class="panel"><h3>Sold → completed (days) distribution</h3><div id="dist"></div></div>
  <div class="panel"><h3>Median days by trade</h3><div id="byTrade"></div></div>
 </div>
 <div class="grid2">
  <div class="panel"><h3>Median sold→completed by month</h3><div id="trend"></div></div>
  <div class="panel"><h3>Scheduled backlog — aging by days since sold</h3><div id="backlog"></div></div>
 </div>
 <div class="panel" style="margin-top:14px"><h3>By business unit</h3><div class="twrap" style="overflow-x:auto"><table id="tbl"><thead><tr><th>Business unit</th><th>Jobs</th><th>Median days</th><th>Avg days</th><th>Revenue</th></tr></thead><tbody></tbody></table></div></div>
 <div class="note" id="note"></div>
</div>
<script>
const EMB=/*DATA_START*/{"asOf":"2026-08-10","today":"2026-08-13","overall":{"n":611,"avg":25.0,"med":11,"rev":4702434},"dist":[{"b":"0\u20137d","n":248},{"b":"8\u201314d","n":92},{"b":"15\u201330d","n":129},{"b":"31\u201360d","n":79},{"b":"61\u201390d","n":27},{"b":"90+d","n":36}],"byTrade":[{"trade":"HVAC","n":296,"avg":9.4,"med":5,"rev":2896599},{"trade":"Fireplace","n":247,"avg":46.0,"med":29,"rev":1555421},{"trade":"Electrical","n":47,"avg":22.6,"med":12,"rev":197361},{"trade":"Other","n":21,"avg":4.0,"med":2,"rev":53053}],"byBU":[{"bu":"HVAC-Install","n":289,"avg":9.4,"med":5,"rev":2839214},{"bu":"FIRE-Install","n":147,"avg":38.6,"med":27,"rev":971569},{"bu":"FIRE-Install-Com","n":100,"avg":56.9,"med":36,"rev":583852},{"bu":"ELEC-Install","n":47,"avg":22.6,"med":12,"rev":197361},{"bu":"PLMB-Install","n":21,"avg":4.0,"med":2,"rev":53053},{"bu":"HVAC-Install-Com","n":7,"avg":6.0,"med":6,"rev":57385}],"trend":[{"m":"2026-01","n":9,"avg":47.6,"med":9,"rev":65731},{"m":"2026-02","n":96,"avg":32.1,"med":22,"rev":755166},{"m":"2026-03","n":89,"avg":31.9,"med":21,"rev":648442},{"m":"2026-04","n":74,"avg":28.8,"med":12,"rev":531524},{"m":"2026-05","n":80,"avg":28.8,"med":8,"rev":573237},{"m":"2026-06","n":117,"avg":16.6,"med":6,"rev":993574},{"m":"2026-07","n":121,"avg":17.5,"med":8,"rev":949235},{"m":"2026-08","n":25,"avg":17.4,"med":7,"rev":185525}],"stages":{"soldToSched":10,"schedToComplete":0},"backlog":{"n":16,"val":123927,"age":[{"b":"0\u201314d","n":7,"val":68547},{"b":"15\u201330d","n":0,"val":0},{"b":"31\u201360d","n":3,"val":19771},{"b":"60+d","n":3,"val":35609},{"b":"no sold date","n":3,"val":0}],"avgDays":46}}/*DATA_END*/;
const REFRESHED=/*STAMP_START*/"from example workbook (Aug 10, 2026)"/*STAMP_END*/;
const money=v=>(v||v===0)?"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0}):"—";
const TVAR={HVAC:"var(--hvac)",Fireplace:"var(--fire)",Electrical:"var(--elec)",Other:"var(--dim)"};
const o=EMB.overall,b=EMB.backlog,st=EMB.stages;
document.getElementById("kpis").innerHTML=[
 {k:"Median sold→install",v:o.med+"d",f:o.n+" install jobs",hero:1},
 {k:"Average",v:o.avg+"d",f:"mean days"},
 {k:"Sold → scheduled",v:st.soldToSched+"d",f:"median"},
 {k:"Scheduled → done",v:st.schedToComplete+"d",f:"median"},
 {k:"Backlog jobs",v:b.n,f:"currently scheduled"},
 {k:"Backlog value",v:money(b.val),f:"avg "+b.avgDays+"d since sold"}
].map(c=>`<div class="kpi${c.hero?' hero':''}"><div class="k">${c.k}</div><div class="val">${c.v}</div><div class="foot">${c.f}</div></div>`).join("");
function bars(el,items,label,val,colf,max){const mx=max||Math.max(...items.map(val),1);document.getElementById(el).innerHTML=items.map(x=>`<div class="bar-row"><div class="nm" title="${label(x)}">${label(x)}</div><div class="track"><div class="fill" style="width:${Math.max(2,val(x)/mx*100)}%;background:${colf(x)}"></div></div><div class="amt">${val(x)}${el==="dist"||el==="backlog"?"":"d"}</div></div>`).join("");}
// distribution
{const mx=Math.max(...EMB.dist.map(x=>x.n),1);document.getElementById("dist").innerHTML=EMB.dist.map(x=>`<div class="bar-row"><div class="nm">${x.b}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.n/mx*100)}%;background:var(--accent)"></div></div><div class="amt">${x.n}</div></div>`).join("");}
// by trade median
{const mx=Math.max(...EMB.byTrade.map(x=>x.med),1);document.getElementById("byTrade").innerHTML=EMB.byTrade.map(x=>`<div class="bar-row"><div class="nm">${x.trade}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.med/mx*100)}%;background:${TVAR[x.trade]}"></div></div><div class="amt">${x.med}d · ${x.n}</div></div>`).join("");}
// trend
{const mx=Math.max(...EMB.trend.map(x=>x.med),1);document.getElementById("trend").innerHTML=EMB.trend.map(x=>{const lbl=new Date(x.m+"-01").toLocaleDateString(undefined,{month:"short"});return `<div class="bar-row"><div class="nm">${lbl}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.med/mx*100)}%;background:var(--accent2)"></div></div><div class="amt">${x.med}d · ${x.n}</div></div>`;}).join("");}
// backlog aging
{const mx=Math.max(...b.age.map(x=>x.val),1);document.getElementById("backlog").innerHTML=b.age.filter(x=>x.n).map(x=>`<div class="bar-row"><div class="nm">${x.b}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.val/mx*100)}%;background:${x.b.startsWith("60")||x.b.startsWith("31")?"var(--warn)":"var(--accent)"}"></div></div><div class="amt">${money(x.val)} · ${x.n}</div></div>`).join("");}
document.querySelector("#tbl tbody").innerHTML=EMB.byBU.map(x=>`<tr><td>${x.bu}</td><td>${x.n}</td><td>${x.med}d</td><td>${x.avg}d</td><td>${money(x.rev)}</td></tr>`).join("");
document.getElementById("sub").innerHTML="How long from sale to completed install, plus what\u2019s in the scheduled backlog &nbsp;·&nbsp; data through "+EMB.asOf+" &nbsp;·&nbsp; updated "+REFRESHED;
document.getElementById("note").innerHTML="<b>Scope:</b> 2026 completed install jobs that carry a Sold On date ("+o.n+" jobs). <b>Median sold→install</b> is the typical wait from sale to completed install; the two stage numbers split it into sold→scheduled and scheduled→done. <b>Backlog</b> is the currently-scheduled installs (from Kody Scheduled Install), aged by days since the job was sold. Fireplace jobs run longer than HVAC, largely surround/parts lead time.";
</script></body></html>
