<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time to Install & Backlog — Comfort by Design</title>
<style>
 :root{--bg:#0e1116;--panel:#161b22;--panel2:#1b212b;--edge:#232a34;--ink:#e7edf5;--dim:#93a1b3;--muted:#7c8a9c;--accent:#4c8dff;--accent2:#2bd4a7;--good:#2bd4a7;--warn:#f5c451;--bad:#f8736a;--hvac:#4c8dff;--fire:#ff7a59;--elec:#f5c451}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .wrap{max-width:1480px;margin:0 auto;padding:22px 22px 70px}h1{margin:0;font-size:26px}
 .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent2);box-shadow:0 0 10px var(--accent2);margin-right:8px;vertical-align:middle}
 .sub{color:var(--dim);font-size:14px;margin-top:4px}
 .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}
 .kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--edge);border-radius:12px;padding:14px 16px}
 .kpi .k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.kpi .val{font-size:25px;font-weight:750;margin-top:5px}.kpi .foot{font-size:11.5px;color:var(--dim);margin-top:4px}
 .kpi.hero .val{color:var(--accent2)}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px}
 .panel h3{margin:0 0 12px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
 .bar-row{display:grid;grid-template-columns:120px 1fr 120px;align-items:center;gap:10px;margin:8px 0;font-size:14px}.bar-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .track{height:15px;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px}.bar-row .amt{text-align:right;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
 table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--edge)}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
 .yoy td,.yoy th{white-space:nowrap}.yoy .d{font-size:12px;font-weight:700}.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
 .yoy tr:hover td{background:var(--panel2)}
 .note{color:var(--muted);font-size:12px;margin-top:20px;line-height:1.6}
 @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
 <h1><span class="dot"></span>Time to Install &amp; Backlog</h1>
 <div class="sub" id="sub"></div>
 <div class="kpis" id="kpis"></div>
 <div class="panel" style="margin:14px 0"><h3 id="yoyH">Year over year</h3><div style="overflow-x:auto"><table class="yoy" id="yoy"></table></div></div>
 <div class="grid2">
  <div class="panel"><h3>Sold → completed (days) distribution — 2026</h3><div id="dist"></div></div>
  <div class="panel"><h3>Median days by trade — 2026</h3><div id="byTrade"></div></div>
 </div>
 <div class="grid2">
  <div class="panel"><h3>Median sold→completed by month — 2026</h3><div id="trend"></div></div>
  <div class="panel"><h3>Scheduled backlog — aging by days since sold</h3><div id="backlog"></div></div>
 </div>
 <div class="panel" style="margin-top:14px"><h3>By business unit — 2026</h3><div style="overflow-x:auto"><table id="tbl"><thead><tr><th>Business unit</th><th>Jobs</th><th>Median days</th><th>Avg days</th><th>Revenue</th></tr></thead><tbody></tbody></table></div></div>
 <div class="note" id="note"></div>
</div>
<script>
const EMB=/*DATA_START*/{"asOf":"2026-08-25","today":"2026-08-27","overall":{"n":777,"avg":27.2,"med":13,"rev":5793477},"dist":[{"b":"0\u20137d","n":289},{"b":"8\u201314d","n":112},{"b":"15\u201330d","n":157},{"b":"31\u201360d","n":133},{"b":"61\u201390d","n":38},{"b":"90+d","n":48}],"byTrade":[{"trade":"HVAC","n":356,"avg":11.4,"med":5,"rev":3411745},{"trade":"Fireplace","n":337,"avg":45.3,"med":33,"rev":2070442},{"trade":"Electrical","n":60,"avg":28.6,"med":12,"rev":252468},{"trade":"Plumbing","n":24,"avg":4.5,"med":2,"rev":58821}],"byBU":[{"bu":"HVAC-Install","n":348,"avg":11.6,"med":5,"rev":3344492},{"bu":"FIRE-Install","n":196,"avg":38.8,"med":31,"rev":1262958},{"bu":"FIRE-Install-Com","n":141,"avg":54.3,"med":36,"rev":807484},{"bu":"ELEC-Install","n":60,"avg":28.6,"med":12,"rev":252468},{"bu":"PLMB-Install","n":24,"avg":4.5,"med":2,"rev":58821},{"bu":"HVAC-Install-Com","n":8,"avg":5.6,"med":5,"rev":67253}],"trend":[{"m":"2026-01","n":121,"avg":34.7,"med":31,"rev":721917},{"m":"2026-02","n":96,"avg":32.1,"med":22,"rev":755166},{"m":"2026-03","n":91,"avg":31.2,"med":21,"rev":661119},{"m":"2026-04","n":80,"avg":32.2,"med":14,"rev":557276},{"m":"2026-05","n":85,"avg":27.5,"med":8,"rev":640836},{"m":"2026-06","n":117,"avg":17.5,"med":6,"rev":960226},{"m":"2026-07","n":115,"avg":17,"med":8,"rev":914316},{"m":"2026-08","n":72,"avg":29.4,"med":11,"rev":582621}],"stages":{"soldToSched":13,"schedToComplete":0},"backlog":{"n":12,"val":86470,"age":[{"b":"0\u201314d","n":4,"val":30731},{"b":"15\u201330d","n":5,"val":49831},{"b":"31\u201360d","n":1,"val":2173},{"b":"60+d","n":1,"val":3735},{"b":"no sold date","n":1,"val":0}],"avgDays":32},"yoy":{"years":[2024,2025,2026],"cutoffLabel":"Jan 1 \u2013 Aug 25","rows":[{"label":"Median days (sold\u2192install)","better":"down","unit":"d","vals":[12,12,13]},{"label":"Average days","better":"down","unit":"d","vals":[21.6,23.7,27.2]},{"label":"Install jobs","better":"up","unit":"","vals":[708,728,777]},{"label":"Install revenue","better":"up","unit":"$","vals":[4628063,5382223,5793477]},{"label":"HVAC median","better":"down","unit":"d","vals":[5,3,5]},{"label":"Fireplace median","better":"down","unit":"d","vals":[26,23,33]},{"label":"Electrical median","better":"down","unit":"d","vals":[9,16,12]}]}}/*DATA_END*/;
const REFRESHED=/*STAMP_START*/"Aug 27, 2026"/*STAMP_END*/;
const money=v=>(v||v===0)?"$"+Number(v).toLocaleString(undefined,{maximumFractionDigits:0}):"—";
const moneyK=v=>{const k=Math.round(v/1000);return Math.abs(k)>=1000?"$"+(v/1000000).toFixed(2)+"M":"$"+k+"K";};
const TVAR={HVAC:"var(--hvac)",Fireplace:"var(--fire)",Electrical:"var(--elec)",Plumbing:"#39c5cf",Other:"var(--dim)"};
const o=EMB.overall,b=EMB.backlog,st=EMB.stages,Y=EMB.yoy;
// KPI delta: 2026 median vs 2025 median (yoy row 0)
const medRow=Y.rows[0].vals, med26=medRow[2], med25=medRow[1], dMed=med26-med25;
const medDelta=dMed===0?'<span class="flat">— vs 2025</span>':`<span class="${dMed<0?'up':'down'}">${dMed<0?'▼':'▲'}${Math.abs(dMed)}d vs 2025</span>`;
document.getElementById("kpis").innerHTML=[
 {k:"Median sold→install",v:o.med+"d",f:medDelta,hero:1},
 {k:"Average",v:o.avg+"d",f:"mean days"},
 {k:"Sold → scheduled",v:st.soldToSched+"d",f:"median"},
 {k:"Scheduled → done",v:st.schedToComplete+"d",f:"median"},
 {k:"Backlog jobs",v:b.n,f:"currently scheduled"},
 {k:"Backlog value",v:money(b.val),f:"avg "+b.avgDays+"d since sold"}
].map(c=>`<div class="kpi${c.hero?' hero':''}"><div class="k">${c.k}</div><div class="val">${c.v}</div><div class="foot">${c.f}</div></div>`).join("");
// ---- YoY table ----
function fmt(v,u){return u==="$"?moneyK(v):u==="d"?v+"d":Number(v).toLocaleString();}
function delta(a,c,better,u){const d=c-a;if(!d)return '<span class="flat">—</span>';const good=(better==="up")?d>0:d<0;const arrow=d>0?"▲":"▼";const val=u==="$"?moneyK(Math.abs(d)):u==="d"?Math.abs(Math.round(d*10)/10)+"d":Math.abs(d).toLocaleString();return `<span class="${good?'up':'down'}">${arrow}${val}</span>`;}
document.getElementById("yoyH").textContent="Year over year — same period ("+Y.cutoffLabel+" each year)";
document.getElementById("yoy").innerHTML=
 "<thead><tr><th>Metric</th><th>2024</th><th>2025</th><th class='d'>vs ’24</th><th>2026</th><th class='d'>vs ’25</th></tr></thead><tbody>"+
 Y.rows.map(r=>`<tr><td>${r.label}</td><td>${fmt(r.vals[0],r.unit)}</td><td>${fmt(r.vals[1],r.unit)}</td><td class="d">${delta(r.vals[0],r.vals[1],r.better,r.unit)}</td><td>${fmt(r.vals[2],r.unit)}</td><td class="d">${delta(r.vals[1],r.vals[2],r.better,r.unit)}</td></tr>`).join("")+"</tbody>";
// ---- 2026 detail bars ----
{const mx=Math.max(...EMB.dist.map(x=>x.n),1);document.getElementById("dist").innerHTML=EMB.dist.map(x=>`<div class="bar-row"><div class="nm">${x.b}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.n/mx*100)}%;background:var(--accent)"></div></div><div class="amt">${x.n}</div></div>`).join("");}
{const mx=Math.max(...EMB.byTrade.map(x=>x.med),1);document.getElementById("byTrade").innerHTML=EMB.byTrade.map(x=>`<div class="bar-row"><div class="nm">${x.trade}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.med/mx*100)}%;background:${TVAR[x.trade]||'var(--dim)'}"></div></div><div class="amt">${x.med}d · ${x.n}</div></div>`).join("");}
{const mx=Math.max(...EMB.trend.map(x=>x.med),1);document.getElementById("trend").innerHTML=EMB.trend.map(x=>{const l=new Date(x.m+"-01").toLocaleDateString(undefined,{month:"short"});return `<div class="bar-row"><div class="nm">${l}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.med/mx*100)}%;background:var(--accent2)"></div></div><div class="amt">${x.med}d · ${x.n}</div></div>`;}).join("");}
{const mx=Math.max(...b.age.map(x=>x.val),1);document.getElementById("backlog").innerHTML=b.age.filter(x=>x.n).map(x=>`<div class="bar-row"><div class="nm">${x.b}</div><div class="track"><div class="fill" style="width:${Math.max(2,x.val/mx*100)}%;background:${x.b.startsWith("60")||x.b.startsWith("31")?"var(--warn)":"var(--accent)"}"></div></div><div class="amt">${money(x.val)} · ${x.n}</div></div>`).join("");}
document.querySelector("#tbl tbody").innerHTML=EMB.byBU.map(x=>`<tr><td>${x.bu}</td><td>${x.n}</td><td>${x.med}d</td><td>${x.avg}d</td><td>${money(x.rev)}</td></tr>`).join("");
document.getElementById("sub").innerHTML="Sale-to-install speed with year-over-year trend, plus the scheduled backlog &nbsp;·&nbsp; data through "+EMB.asOf+" &nbsp;·&nbsp; updated "+REFRESHED;
document.getElementById("note").innerHTML="<b>Year over year</b> compares the same calendar window each year ("+Y.cutoffLabel+") so 2026 (partial) is fair against full prior years. For days metrics, ▼ (fewer days) is the improvement; for jobs and revenue, ▲ is the improvement. The lower detail panels cover 2026 completions. Backlog is the currently-scheduled installs aged by days since sold. Trade names were normalized across the 2024→2026 business-unit renames.";
</script></body></html>
